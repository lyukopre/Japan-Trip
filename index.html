<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >
  <meta name="apple-mobile-web-app-title" content="Giappone">

  <title>Giappone 2026/27</title>

  <link rel="manifest" href="manifest.json">

  <script
    src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
  ></script>

  <style>
    /* ================================================================
       1. Tema e variabili
       ================================================================ */

    :root {
      --bg: #f3f1ec;
      --surface: rgba(255, 255, 255, 0.95);
      --surface-solid: #ffffff;
      --surface-soft: rgba(250, 248, 244, 0.96);
      --text: #1c1a18;
      --muted: #77716a;
      --border: rgba(222, 216, 205, 0.95);
      --accent: #c94a5a;
      --accent-soft: #fae9eb;
      --gold: #c9a24a;
      --header: rgba(243, 241, 236, 0.96);
      --nav: rgba(255, 255, 255, 0.98);
      --shadow: 0 2px 12px rgba(28, 20, 10, 0.10);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius-large: 28px;
      --radius-medium: 20px;
      --radius-small: 12px;
    }

    html[data-theme="dark"] {
      --bg: #111318;
      --surface: rgba(27, 30, 38, 0.97);
      --surface-solid: #1b1e26;
      --surface-soft: rgba(34, 37, 46, 0.98);
      --text: #f2f0ec;
      --muted: #96939a;
      --border: rgba(55, 58, 68, 0.96);
      --accent-soft: #35232a;
      --header: rgba(17, 19, 24, 0.98);
      --nav: rgba(17, 19, 24, 0.99);
      --shadow: 0 2px 14px rgba(0, 0, 0, 0.42);
    }

    html[data-accent="ao"] {
      --accent: #3f6ea8;
      --accent-soft: #e8eef8;
    }

    html[data-accent="torii"] {
      --accent: #c94a5a;
      --accent-soft: #fae9eb;
    }

    html[data-accent="matcha"] {
      --accent: #4f8a5e;
      --accent-soft: #e8f2e9;
    }

    html[data-accent="sakura"] {
      --accent: #d97ea0;
      --accent-soft: #f9e9f0;
    }

    html[data-theme="dark"][data-accent="ao"] {
      --accent-soft: #1a293b;
    }

    html[data-theme="dark"][data-accent="matcha"] {
      --accent-soft: #192d1e;
    }

    html[data-theme="dark"][data-accent="sakura"] {
      --accent-soft: #30212a;
    }

    .city-osaka { --city: #e08a3c; }
    .city-kyoto { --city: #4f8a5e; }
    .city-tokyo { --city: #2c4a6e; }
    .city-takayama { --city: #b5623f; }
    .city-hiroshima { --city: #7a6bb0; }
    .city-kamakura { --city: #3f9b9b; }
    .city-kawaguchiko { --city: #4f8fc9; }
    .city-default { --city: var(--accent); }

    /* ================================================================
       2. Reset e struttura
       ================================================================ */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
      overscroll-behavior-y: none;
      -webkit-text-size-adjust: 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    select {
      cursor: pointer;
    }

    a {
      color: var(--accent);
    }

    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      isolation: isolate;
    }

    #main {
      position: relative;
      z-index: 2;
      flex: 1;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 12px 16px calc(148px + var(--safe-bottom));
    }

    .view-fade {
      animation: viewFade 0.25s ease;
    }

    @keyframes viewFade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================================================================
       3. Sfondo decorativo non interattivo
       ================================================================ */

    #backgroundLayer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none !important;
      background:
        radial-gradient(
          circle at 88% 8%,
          color-mix(in srgb, var(--accent) 13%, transparent),
          transparent 30%
        ),
        radial-gradient(
          circle at 8% 38%,
          color-mix(in srgb, var(--gold) 9%, transparent),
          transparent 27%
        );
    }

    #backgroundPattern {
      width: 100%;
      height: 100%;
      opacity: 0.10;
      pointer-events: none !important;
    }

    html[data-theme="dark"] #backgroundPattern {
      opacity: 0.16;
    }

    /* ================================================================
       4. Header
       ================================================================ */

    #topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: max(14px, calc(var(--safe-top) + 10px)) 18px 10px;
      border-bottom: 1px solid transparent;
      background: var(--header);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      transition: 0.25s ease;
    }

    #topbar.scrolled {
      padding-bottom: 6px;
      border-bottom-color: var(--border);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 9px;
      background: var(--accent);
    }

    .logo svg {
      width: 62%;
      height: 62%;
    }

    #topbar.scrolled .logo {
      width: 24px;
      height: 24px;
    }

    .page-title {
      flex: 1;
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.03em;
      transition: 0.25s ease;
    }

    #topbar.scrolled .page-title {
      font-size: 19px;
    }

    .page-subtitle {
      max-height: 24px;
      margin-top: 3px;
      padding-left: 40px;
      overflow: hidden;
      color: var(--muted);
      font-size: 13.5px;
      transition: 0.25s ease;
    }

    #topbar.scrolled .page-subtitle {
      max-height: 0;
      margin-top: 0;
      opacity: 0;
    }

    .trip-banner {
      margin-top: 10px;
      padding: 11px 15px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-soft), transparent);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    /* ================================================================
       5. Mappa avanzata
       ================================================================ */

    .map-hero {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .map-hero-kicker {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .map-hero-title {
      margin: 5px 0 0;
      font-size: 25px;
      font-weight: 850;
      letter-spacing: -.03em;
    }

    .map-hero-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .map-counters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .map-counter {
      padding: 11px 7px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--surface-soft);
      text-align: center;
    }

    .map-counter-value {
      font-size: 18px;
      font-weight: 850;
    }

    .map-counter-label {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .map-mode-row {
      display: flex;
      gap: 8px;
      margin: 14px 0 10px;
    }

    .map-mode-button {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .map-mode-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .map-search-row {
      display: flex;
      gap: 8px;
      margin: 10px 0 12px;
    }

    .map-search-row input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
    }

    .map-filter-title {
      margin: 14px 0 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    /* ================================================================
       6. Card comuni
       ================================================================ */

    .card,
    .stat-box,
    .progress-card,
    .toolbar input,
    .dropdown select,
    .settings-button,
    .rate-box {
      background: var(--surface);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .card {
      position: relative;
      overflow: hidden;
      margin-bottom: 12px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .15s ease;
    }

    .card:active {
      transform: scale(.985);
    }

    .card.city-card {
      border-left: 4px solid var(--city, var(--accent));
    }

    .card-top,
    .card-top-left {
      display: flex;
      align-items: center;
    }

    .card-top {
      justify-content: space-between;
      gap: 10px;
    }

    .card-top-left {
      min-width: 0;
      gap: 10px;
    }

    .card-title-wrap {
      min-width: 0;
    }

    .card-title {
      margin: 0;
      font-size: 17.5px;
      font-weight: 800;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .card-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .badge {
      flex: 0 0 auto;
      padding: 5px 11px;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .bullet {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.45;
    }

    .bullet-icon {
      width: 20px;
      flex: 0 0 auto;
      margin-top: 1px;
      text-align: center;
    }

    .bullet.muted {
      color: var(--muted);
      font-size: 13.5px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 11px;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      padding: 10px 15px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: var(--shadow);
    }

    .action-button.small {
      padding: 8px 13px;
      font-size: 12.5px;
    }

    .action-button.secondary {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: none;
    }

    .empty-state {
      padding: 56px 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 4px 10px;
      font-size: 14px;
      font-weight: 800;
    }

    /* ================================================================
       7. Header e dashboard principali
       ================================================================ */

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0 6px;
    }

    .stat-box {
      padding: 15px 8px;
      border: 1px solid var(--border);
      border-radius: 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
    }

    .progress-card {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 14px 0 6px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .progress-ring {
      flex: 0 0 auto;
      transform: rotate(-90deg);
    }

    .progress-ring-background {
      fill: none;
      stroke: var(--border);
      stroke-width: 8;
    }

    .progress-ring-value {
      fill: none;
      stroke: var(--accent);
      stroke-width: 8;
      stroke-linecap: round;
    }

    .progress-ring-label {
      fill: var(--text);
      font-size: 13px;
      font-weight: 800;
    }

    .progress-title {
      font-size: 14px;
      font-weight: 800;
    }

    .progress-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
    }

    .dashboard-card {
      margin-bottom: 14px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .dashboard-kicker {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .dashboard-title {
      margin: 5px 0 0;
      font-size: 25px;
      font-weight: 850;
      letter-spacing: -.03em;
    }

    .dashboard-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .dashboard-metric {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface-soft);
    }

    .dashboard-metric-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .dashboard-metric-value {
      margin-top: 4px;
      font-size: 16px;
      font-weight: 850;
    }

    /* ================================================================
       8. Floating tabbar realmente fissa
       ================================================================ */

    #tabbar {
      position: fixed !important;
      right: 14px !important;
      bottom: calc(12px + var(--safe-bottom)) !important;
      left: 14px !important;
      z-index: 9999 !important;
      display: flex !important;
      gap: 6px;
      overflow-x: auto;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 29px;
      background: var(--nav);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, .18),
        0 2px 8px rgba(0, 0, 0, .08);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      scrollbar-width: none;
      pointer-events: auto !important;
      transform: translateZ(0);
    }

    #tabbar::-webkit-scrollbar {
      display: none;
    }

    .tab-button {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 76px;
      min-height: 52px;
      padding: 6px 10px;
      border: 0;
      border-radius: 21px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      pointer-events: auto !important;
    }

    .tab-button-icon {
      font-size: 20px;
      line-height: 1;
    }

    .tab-button.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px color-mix(
        in srgb,
        var(--accent) 35%,
        transparent
      );
    }

    .floating-button {
      position: fixed;
      right: 18px;
      bottom: calc(106px + var(--safe-bottom));
      z-index: 9998;
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 18px;
      background: var(--accent);
      color: #fff;
      font-size: 26px;
      box-shadow: 0 8px 20px -4px var(--accent);
    }

    /* ================================================================
       9. Modali e impostazioni
       ================================================================ */

    .settings-section {
      margin-bottom: 26px;
    }

    .settings-heading {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .theme-options,
    .accent-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill-button {
      padding: 11px 17px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    .pill-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .color-swatch {
      width: 42px;
      height: 42px;
      border: 3px solid transparent;
      border-radius: 50%;
      box-shadow: var(--shadow);
    }

    .color-swatch.active {
      border-color: var(--text);
    }

    .settings-button,
    .rate-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 10px;
      margin-top: 8px;
      padding: 15px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      box-shadow: var(--shadow);
    }

    .rate-box input {
      width: 90px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 15px;
      text-align: right;
    }

    input[type="file"] {
      display: none;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: flex;
      align-items: flex-end;
      background: rgba(20, 15, 10, .5);
    }

    .modal {
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 22px 20px calc(26px + var(--safe-bottom));
      border-radius: 28px 28px 0 0;
      background: var(--surface-solid);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, .25);
    }

    .modal-title {
      margin: 0 0 16px;
      font-size: 19px;
      font-weight: 800;
    }

    .field {
      margin-bottom: 13px;
    }

    .field-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 16px;
    }

    .field textarea {
      min-height: 64px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-actions button {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
    }

    .save-button { background: var(--accent); color: #fff; }
    .cancel-button { border: 1px solid var(--border) !important; background: var(--surface-soft); color: var(--text); }
    .delete-button { background: #c94a5a; color: #fff; }

    .toast {
      position: fixed;
      bottom: calc(112px + var(--safe-bottom));
      left: 50%;
      z-index: 100001;
      max-width: 90vw;
      padding: 12px 18px;
      border-radius: 20px;
      background: var(--text);
      color: var(--bg);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity .3s ease;
    }

    .toast.visible {
      opacity: 1;
    }


    /* Ripristino filtri in stile pillola, senza modificare la logica */
    .filter-row{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;align-items:center!important;gap:8px!important;width:100%!important;margin:0 0 16px!important;padding:2px 2px 6px!important;overflow-x:auto!important;overflow-y:hidden!important;white-space:nowrap!important;scrollbar-width:none!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-x!important}
    .filter-row::-webkit-scrollbar{display:none!important}
    .filter-row .filter-chip,.filter-row button{display:inline-flex!important;flex:0 0 auto!important;align-items:center!important;justify-content:center!important;width:auto!important;min-width:max-content!important;height:36px!important;min-height:36px!important;padding:0 14px!important;border:1px solid #353d4d!important;border-radius:999px!important;background:#1b202c!important;color:#a4a7b0!important;font-size:12px!important;font-weight:750!important;line-height:1!important;white-space:nowrap!important;box-shadow:none!important}
    .filter-row .filter-chip.active,.filter-row button.active{background:#d14e63!important;border-color:#d14e63!important;color:#fff!important;box-shadow:0 5px 13px rgba(209,78,99,.22)!important}
    .toolbar{display:grid!important;gap:14px!important;width:100%!important;margin:14px 0 16px!important}
    .toolbar>input,.toolbar input[type=search],.toolbar select,.dropdown select{width:100%!important;height:42px!important;min-height:42px!important;box-sizing:border-box!important;border-radius:999px!important}

  </style>
</head>

<body>
  <div id="app">
    <div id="backgroundLayer" aria-hidden="true">
      <svg
        id="backgroundPattern"
        viewBox="0 0 520 520"
        preserveAspectRatio="xMidYMid slice"
      ></svg>
    </div>

    <header id="topbar">
      <div class="topbar-row">
        <div class="logo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M3 9h18M6 9V6c0-1 1-2 2-2h8c1 0 2 1 2 2v3M6 9v11M18 9v11" />
          </svg>
        </div>
        <h1 id="pageTitle" class="page-title">Itinerario</h1>
      </div>
      <div id="pageSubtitle" class="page-subtitle"></div>
      <div id="tripBanner" class="trip-banner" hidden></div>
    </header>

    <main id="main"></main>

    <button id="addButton" class="floating-button" type="button" hidden>
      +
    </button>

    <nav id="tabbar" aria-label="Sezioni app"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script>
    /* ================================================================
       1. Stato e configurazione
       ================================================================ */

    const DATA_KEY = "giappone-data";
    const SETTINGS_KEY = "giappone-settings";

    const STATUSES = [
      "Da preparare",
      "Da comprare",
      "In valigia",
      "Fatto"
    ];

    const URGENCY_ORDER = {
      Alta: 0,
      Media: 1,
      Bassa: 2
    };

    const MONTHS = [
      "gen", "feb", "mar", "apr", "mag", "giu",
      "lug", "ago", "set", "ott", "nov", "dic"
    ];

    const WEEKDAYS = [
      "dom", "lun", "mar", "mer", "gio", "ven", "sab"
    ];

    const SHEETS = [
      "1. Itinerario",
      "2. Hotel e Alloggi",
      "3. Trasporti",
      "4. App",
      "5. Valigia",
      "6. Attrazioni",
      "7. Guida",
      "8. Cibo e Ristoranti",
      "9. Shopping",
      "10. Emergenze",
      "11. Budget"
    ];

    const TABS = [
      "1. Itinerario",
      "mappa",
      "6. Attrazioni",
      "8. Cibo e Ristoranti",
      "2. Hotel e Alloggi",
      "3. Trasporti",
      "9. Shopping",
      "4. App",
      "5. Valigia",
      "7. Guida",
      "10. Emergenze",
      "11. Budget",
      "settings"
    ];

    const ICONS = {
      "1. Itinerario": "🗺️",
      "2. Hotel e Alloggi": "🏨",
      "3. Trasporti": "🚄",
      "4. App": "📱",
      "5. Valigia": "🧳",
      "6. Attrazioni": "⛩️",
      "7. Guida": "📖",
      "8. Cibo e Ristoranti": "🍜",
      "9. Shopping": "🛍️",
      "10. Emergenze": "🚨",
      "11. Budget": "💴"
    };

    const FIELD_ICONS = {
      "Città": "📍",
      "Categoria": "🏷️",
      "Note": "📝",
      "Note e Suggerimenti": "📝",
      "Note per il Giappone": "🎒",
      "Note / Categoria": "📝",
      "Note / Conferma": "📝",
      "Costo Stimato": "💰",
      "Durata": "⏱️",
      "Mezzo / Vettore": "🚆",
      "Nome Hotel / Ryokan": "🏨",
      "Quartiere": "🧭",
      "Articolo Mirato / Note": "🛍️",
      "Dettagli Operativi": "📋",
      "Numero / Riferimento": "☎️",
      "Funzione Principale": "⚙️",
      "Urgenza Configurazione": "⏳",
      "Urgenza": "⏳",
      "Spesa Effettiva Revolut": "💸",
      "Differenza": "📊",
      "Budget Previsto (Yen)": "💴",
      "Pernottamento": "🏨",
      "Spostamento": "🚉",
      "App": "📱",
      "Contatto / Servizio": "🚨"
    };

    const META = {
      "1. Itinerario": {
        label: "Itinerario",
        title: "Attività Principali",
        search: ["Città", "Attività Principali", "Spostamento"]
      },
      "2. Hotel e Alloggi": {
        label: "Alloggi",
        title: "Nome Hotel / Ryokan",
        fallback: "Città",
        sub: ["Città", "Notte"],
        notes: ["Note / Conferma"],
        maps: [{ field: "Link Google Maps", label: "Maps" }],
        search: ["Città", "Nome Hotel / Ryokan"],
        city: "Città"
      },
      "3. Trasporti": {
        label: "Trasporti",
        title: "Tratta / Servizio",
        sub: ["Mezzo / Vettore"],
        badge: "Costo Stimato",
        extra: ["Durata"],
        maps: [
          { field: "Link Maps Partenza", label: "Partenza" },
          { field: "Link Maps Arrivo", label: "Arrivo" }
        ],
        search: ["Tratta / Servizio", "Mezzo / Vettore"]
      },
      "4. App": {
        label: "App",
        title: "App",
        sub: ["Categoria"],
        badge: "Urgenza Configurazione",
        notes: ["Funzione Principale", "Note"],
        search: ["App", "Categoria"]
      },
      "5. Valigia": {
        label: "Valigia",
        title: "Articolo",
        sub: ["Categoria"],
        status: "Messo in Valigia?",
        notes: ["Note per il Giappone"],
        extra: ["Urgenza"],
        search: ["Articolo", "Categoria"]
      },
      "6. Attrazioni": {
        label: "Attrazioni",
        title: "Attrazione",
        fallback: "Città",
        sub: ["Città", "Categoria"],
        badge: "Urgenza",
        notes: ["Note"],
        maps: [{ field: "Link Google Maps", label: "Maps" }],
        search: ["Città", "Attrazione", "Categoria"],
        city: "Città"
      },
      "7. Guida": {
        label: "Guida",
        title: "Argomento",
        notes: ["Dettagli Operativi"],
        search: ["Argomento"]
      },
      "8. Cibo e Ristoranti": {
        label: "Cibo",
        title: "Specialità / Piatto",
        fallback: "Città",
        sub: ["Città", "Categoria"],
        notes: ["Note e Suggerimenti"],
        maps: [{ field: "Link Google Maps", label: "Maps" }],
        search: ["Città", "Specialità / Piatto", "Categoria"],
        city: "Città"
      },
      "9. Shopping": {
        label: "Shopping",
        title: "Brand / Negozio",
        fallback: "Quartiere",
        sub: ["Città", "Quartiere", "Categoria"],
        notes: ["Articolo Mirato / Note"],
        maps: [{ field: "Link Google Maps", label: "Maps" }],
        search: ["Città", "Quartiere", "Brand / Negozio"],
        city: "Città"
      },
      "10. Emergenze": {
        label: "Emergenze",
        title: "Contatto / Servizio",
        sub: ["Numero / Riferimento"],
        notes: ["Dettagli Operativi"],
        search: ["Contatto / Servizio"]
      },
      "11. Budget": {
        label: "Budget",
        title: "Data",
        sub: ["Giorno"],
        badge: "Budget Previsto (Yen)",
        notes: ["Note / Categoria"],
        extra: ["Spesa Effettiva Revolut", "Differenza"],
        search: ["Data", "Giorno"]
      }
    };

    const state = {
      data: JSON.parse(localStorage.getItem(DATA_KEY) || "{}"),
      settings: JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}"),
      view: "1. Itinerario",
      search: "",
      city: "",
      sort: "default"
    };

    state.settings.theme ||= "auto";
    state.settings.accent ||= "torii";
    state.settings.exchangeRate ||= 160;

    /* ================================================================
       2. Utility
       ================================================================ */

    function saveData() {
      localStorage.setItem(DATA_KEY, JSON.stringify(state.data));
    }

    function saveSettings() {
      localStorage.setItem(
        SETTINGS_KEY,
        JSON.stringify(state.settings)
      );
    }

    function iconFor(field) {
      return FIELD_ICONS[field] || "•";
    }

    function isUrl(value) {
      return /^https?:\/\//i.test(String(value || "").trim());
    }

    function isPhone(value) {
      return /^[\d+\-\s()]{3,}$/.test(String(value || "").trim());
    }

    function applyTheme() {
      let theme = state.settings.theme;

      if (theme === "auto") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.accent = state.settings.accent;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function parseDate(value) {
      const match = String(value || "")
        .match(/^(\d{4})-(\d{2})-(\d{2})/);

      return match
        ? new Date(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3])
        )
        : null;
    }

    function todayString() {
      const date = new Date();
      return `${date.getFullYear()}-${String(
        date.getMonth() + 1
      ).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function shortDate(value) {
      const date = parseDate(value);
      return date
        ? `${WEEKDAYS[date.getDay()]} ${date.getDate()} ${MONTHS[date.getMonth()]}`
        : String(value || "");
    }

    function monthDay(value) {
      const date = parseDate(value);
      return date
        ? `${date.getDate()} ${MONTHS[date.getMonth()]}`
        : String(value || "");
    }

    function cityClass(value) {
      const city = String(value || "")
        .split("/")[0]
        .trim()
        .toLowerCase();

      const classes = {
        osaka: "city-osaka",
        kyoto: "city-kyoto",
        tokyo: "city-tokyo",
        takayama: "city-takayama",
        hiroshima: "city-hiroshima",
        kamakura: "city-kamakura",
        kawaguchiko: "city-kawaguchiko",
        partenza: "city-partenza"
      };

      return classes[city] || "city-default";
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("visible");
      setTimeout(() => toast.classList.remove("visible"), 2300);
    }

    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    /* ================================================================
       3. Sfondo e navigazione
       ================================================================ */

    function renderBackground() {
      const svg = document.getElementById("backgroundPattern");
      const radius = 46;
      let paths = "";

      for (let row = 0; row < 11; row += 1) {
        for (let column = 0; column < 14; column += 1) {
          const offset = row % 2 ? radius * 0.52 : 0;
          const x = column * radius * 1.05 + offset;
          const y = row * radius * 0.55;

          paths += `
            <path
              d="M${x - radius} ${y}
                 a${radius} ${radius} 0 0 1 ${radius * 2} 0"
              fill="none"
              stroke="var(--accent)"
              stroke-width="1.6"
            />
          `;
        }
      }

      svg.innerHTML = paths;
    }

    function renderTabs() {
      const tabbar = document.getElementById("tabbar");
      tabbar.innerHTML = "";

      TABS.forEach((key) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.dataset.tab = key;

        const icon = key === "mappa"
          ? "🗺️📍"
          : key === "settings"
            ? "⚙️"
            : ICONS[key];

        const label = key === "mappa"
          ? "Mappa"
          : key === "settings"
            ? "Impostazioni"
            : META[key].label;

        button.innerHTML = `
          <span class="tab-button-icon">${icon}</span>
          ${label}
        `;

        button.onclick = () => {
          state.view = key;
          state.search = "";
          state.city = "";
          state.sort = "default";
          renderApp();
        };

        tabbar.appendChild(button);
      });
    }

    function renderBanner() {
      const banner = document.getElementById("tripBanner");
      const rows = state.data["1. Itinerario"]?.rows || [];

      if (!rows.length) {
        banner.hidden = true;
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const first = parseDate(rows[0].Data);
      const last = parseDate(rows[rows.length - 1].Data);

      if (!first || !last) {
        banner.hidden = true;
        return;
      }

      banner.hidden = false;

      if (today < first) {
        banner.textContent = `🛫 Mancano ${Math.ceil(
          (first - today) / 86400000
        )} giorni alla partenza`;
      } else if (today <= last) {
        const index = Math.max(
          rows.findIndex((row) => row.Data === todayString()) + 1,
          1
        );
        banner.textContent = `📍 Sei in viaggio · Giorno ${index} di ${rows.length}`;
      } else {
        banner.textContent = "✅ Viaggio concluso · che ricordi! 🎌";
      }
    }

    /* ================================================================
       4. Dashboard e liste
       ================================================================ */

    function countMapLinks() {
      let count = 0;

      SHEETS.forEach((key) => {
        (META[key].maps || []).forEach((map) => {
          count += (state.data[key]?.rows || [])
            .filter((row) => isUrl(row[map.field]))
            .length;
        });
      });

      return count;
    }

    function renderDashboard() {
      const itinerary = state.data["1. Itinerario"]?.rows || [];
      const packing = state.data["5. Valigia"]?.rows || [];
      const budget = state.data["11. Budget"]?.rows || [];
      const planned = budget.reduce((sum, row) => {
        return sum + (Number(row["Budget Previsto (Yen)"]) || 0);
      }, 0);
      const done = packing.filter((row) => {
        return row["Messo in Valigia?"] === "Fatto";
      }).length;
      const first = itinerary[0];

      const element = document.createElement("section");
      element.className = "dashboard-card";
      element.innerHTML = `
        <div class="dashboard-kicker">🎌 Travel planner</div>
        <h2 class="dashboard-title">Giappone 2026/27</h2>
        <div class="dashboard-subtitle">
          Panoramica rapida del viaggio
        </div>
        <div class="dashboard-grid">
          <div class="dashboard-metric">
            <div class="dashboard-metric-label">📍 Prima tappa</div>
            <div class="dashboard-metric-value">
              ${escapeHtml(first?.Città || "—")}
            </div>
          </div>
          <div class="dashboard-metric">
            <div class="dashboard-metric-label">🧳 Valigia</div>
            <div class="dashboard-metric-value">
              ${done}/${packing.length} pronta
            </div>
          </div>
          <div class="dashboard-metric">
            <div class="dashboard-metric-label">💴 Budget</div>
            <div class="dashboard-metric-value">
              ${planned.toLocaleString("it-IT")} ¥
            </div>
          </div>
          <div class="dashboard-metric">
            <div class="dashboard-metric-label">📍 Luoghi Maps</div>
            <div class="dashboard-metric-value">
              ${countMapLinks()}
            </div>
          </div>
        </div>
      `;

      return element;
    }

    function renderStats() {
      const rows = state.data["1. Itinerario"]?.rows || [];
      const cities = new Set();

      rows.forEach((row) => {
        String(row["Città"] || "").split("/").forEach((city) => {
          const clean = city.trim();
          if (clean && clean !== "Partenza") cities.add(clean);
        });
      });

      const first = rows[0]?.Data || "";
      const last = rows[rows.length - 1]?.Data || "";
      document.getElementById("pageSubtitle").textContent =
        `Giappone ${monthDay(first)} – ${monthDay(last)}`;

      const element = document.createElement("div");
      element.className = "stats-row";
      element.innerHTML = `
        <div class="stat-box">
          <div class="stat-label">Durata</div>
          <div class="stat-value">${rows.length} giorni</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Tappe</div>
          <div class="stat-value">${cities.size} città</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Periodo</div>
          <div class="stat-value">
            ${monthDay(first)} – ${monthDay(last)}
          </div>
        </div>
      `;

      return element;
    }

    function renderPackingProgress() {
      const rows = state.data["5. Valigia"]?.rows || [];
      const done = rows.filter((row) => {
        return row["Messo in Valigia?"] === "Fatto";
      }).length;
      const percent = rows.length
        ? Math.round(done / rows.length * 100)
        : 0;
      const radius = 30;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - percent / 100 * circumference;

      const element = document.createElement("div");
      element.className = "progress-card";
      element.innerHTML = `
        <svg class="progress-ring" width="72" height="72" viewBox="0 0 72 72">
          <circle
            class="progress-ring-background"
            cx="36"
            cy="36"
            r="${radius}"
          ></circle>
          <circle
            class="progress-ring-value"
            cx="36"
            cy="36"
            r="${radius}"
            stroke-dasharray="${circumference}"
            stroke-dashoffset="${offset}"
          ></circle>
          <text
            class="progress-ring-label"
            x="36"
            y="41"
            text-anchor="middle"
            transform="rotate(90 36 36)"
          >${percent}%</text>
        </svg>
        <div>
          <div class="progress-title">🧳 Preparazione valigia</div>
          <div class="progress-subtitle">
            ${done} di ${rows.length} oggetti pronti
          </div>
        </div>
      `;

      return element;
    }

    function renderCityFilters(key, meta) {
      if (!meta.city) return null;

      const cities = [
        "",
        ...new Set(
          (state.data[key]?.rows || [])
            .map((row) => row[meta.city])
            .filter(Boolean)
        )
      ];

      const row = document.createElement("div");
      row.className = "filter-row";

      cities.forEach((city) => {
        const button = document.createElement("button");
        button.className = `filter-chip${
          state.city === city ? " active" : ""
        }`;
        button.type = "button";
        button.textContent = city || "🌆 Tutte";
        button.onclick = () => {
          state.city = city;
          renderApp();
        };
        row.appendChild(button);
      });

      return row;
    }

    function renderToolbar(key, meta) {
      const toolbar = document.createElement("div");
      toolbar.className = "toolbar";

      const input = document.createElement("input");
      input.type = "search";
      input.placeholder = `🔎 Cerca in ${meta.label}...`;
      input.value = state.search;
      input.oninput = () => {
        state.search = input.value;
        renderList(key, toolbar.nextElementSibling);
      };
      toolbar.appendChild(input);

      if (key !== "1. Itinerario" && key !== "11. Budget") {
        const options = [
          { value: "default", label: "↕️ Originale" },
          { value: "alpha", label: "🔤 A-Z" }
        ];

        if (state.data[key].headers.includes("Urgenza")) {
          options.push({ value: "urgency", label: "⏳ Urgenza" });
        }

        toolbar.appendChild(
          createSelect(options, state.sort, (value) => {
            state.sort = value;
            renderList(key, toolbar.nextElementSibling);
          })
        );
      }

      return toolbar;
    }

    function createSelect(options, selected, onChange) {
      const wrapper = document.createElement("div");
      wrapper.className = "dropdown";
      const select = document.createElement("select");

      options.forEach((option) => {
        const element = document.createElement("option");
        element.value = option.value;
        element.textContent = option.label;
        element.selected = option.value === selected;
        select.appendChild(element);
      });

      select.onchange = () => onChange(select.value);
      wrapper.appendChild(select);
      return wrapper;
    }

    function renderList(key, container) {
      if (!container) return;

      const meta = META[key];
      const query = state.search.toLowerCase().trim();
      let items = (state.data[key]?.rows || [])
        .map((row, index) => ({ row, index }));

      items = items.filter(({ row }) => {
        const matchesQuery = !query || meta.search.some((field) => {
          return String(row[field] || "")
            .toLowerCase()
            .includes(query);
        });

        const matchesCity = !meta.city || !state.city ||
          row[meta.city] === state.city;

        return matchesQuery && matchesCity;
      });

      if (state.sort === "alpha") {
        items.sort((a, b) => {
          const aValue = String(
            a.row[meta.title] || a.row[meta.fallback] || ""
          );
          const bValue = String(
            b.row[meta.title] || b.row[meta.fallback] || ""
          );
          return aValue.localeCompare(bValue);
        });
      }

      if (state.sort === "urgency") {
        items.sort((a, b) => {
          return (URGENCY_ORDER[a.row.Urgenza] ?? 99) -
            (URGENCY_ORDER[b.row.Urgenza] ?? 99);
        });
      }

      container.innerHTML = "";

      if (!items.length) {
        container.innerHTML = `
          <div class="empty-state">
            🔍 Nessun elemento trovato.<br>
            Tocca + per aggiungerne uno.
          </div>
        `;
        return;
      }

      items.forEach(({ row, index }) => {
        const card = key === "1. Itinerario"
          ? renderItineraryCard(row, index)
          : renderDataCard(key, meta, row, index);
        container.appendChild(card);
      });
    }

    function renderApp() {
      const main = document.getElementById("main");
      const title = document.getElementById("pageTitle");
      const subtitle = document.getElementById("pageSubtitle");
      const addButton = document.getElementById("addButton");

      document.querySelectorAll(".tab-button").forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.tab === state.view
        );
      });

      main.innerHTML = "";
      main.classList.remove("view-fade");
      void main.offsetWidth;
      main.classList.add("view-fade");
      addButton.hidden = true;
      subtitle.textContent = "";
      renderBanner();

      if (state.view === "settings") {
        title.textContent = "⚙️ Impostazioni";
        main.appendChild(renderSettings());
        return;
      }

      if (state.view === "mappa") {
        title.textContent = "🗺️ Mappa rapida";
        subtitle.textContent = "Luoghi con link Google Maps";
        main.appendChild(renderMap());
        return;
      }

      const meta = META[state.view];
      title.textContent = `${ICONS[state.view]} ${meta.label}`;

      if (state.view === "1. Itinerario") {
        main.appendChild(renderDashboard());
        main.appendChild(renderStats());
      }

      if (state.view === "5. Valigia") {
        main.appendChild(renderPackingProgress());
      }

      const filters = renderCityFilters(state.view, meta);
      if (filters) main.appendChild(filters);

      addButton.hidden = false;
      addButton.onclick = () => openEditModal(state.view, null);

      const toolbar = renderToolbar(state.view, meta);
      const list = document.createElement("div");

      if (state.view === "1. Itinerario") {
        list.className = "timeline-list";
      }

      main.append(toolbar, list);
      renderList(state.view, list);
    }

    function renderItineraryCard(row, index) {

      const today = row.Data === todayString();

      card.className = `card city-card ${cityClass(row["Città"])}${
        today ? " today" : ""

        if (!event.target.closest("button, a")) {
          openEditModal("1. Itinerario", index);
        }

        .split(/,|;/)
        .map((value) => value.trim())
        .filter(Boolean)
        .slice(0, 4);

      const activityIcons = ["☀️", "🏙️", "🌙", "✨"];

          <span class="bullet-icon">

          </span>
          <span>${escapeHtml(value)}</span>

      const transferHtml = row["Spostamento"] && row["Spostamento"] !== "-"

            <span class="bullet-icon">🚉</span>
            <span>${escapeHtml(row["Spostamento"])}</span>
          </div>
        `
        : "";

      const hotel = state.data["2. Hotel e Alloggi"]?.rows
        .find((item) => item.Data === row.Data);

      const hotelName = hotel?.["Nome Hotel / Ryokan"] ||
        (row["Pernottamento"] !== "-" ? row["Pernottamento"] : "");

      const hotelHtml = hotelName
        ? `
          <div class="hotel-pill">
            <span class="hotel-name">
              🏨 ${escapeHtml(hotelName)}
            </span>
            ${isUrl(hotel?.["Link Google Maps"])
              ? `<a
                   class="action-button small"
                   href="${hotel["Link Google Maps"]}"
                   target="_blank"
                   rel="noopener"
                   onclick="event.stopPropagation()"
                 >📍 Maps</a>`
              : ""}

        : "";

      card.innerHTML = `
        <div class="card-top">
          <div class="card-top-left">
            <span class="day-chip${today ? " today-chip" : ""}">
              ${today ? "OGGI" : `G${index + 1}`}
            </span>
            <div class="card-title-wrap">
              <h3 class="card-title">
                ${escapeHtml(row["Città"] || "—")}
              </h3>
            </div>
          </div>
          <div class="date-chevron">
            ${escapeHtml(shortDate(row.Data))}
            <span class="chevron">›</span>
          </div>
        </div>

        <div class="bullet-list">
          ${activityHtml}
          ${transferHtml}
        </div>

        ${hotelHtml}

        <div class="button-row">

            📅 Calendario

          <button class="action-button small secondary" data-share>
            📤 Condividi
          </button>

        event.stopPropagation();

      card.querySelector("[data-share]").onclick = (event) => {
        event.stopPropagation();
        shareText(
          `Giappone · ${row.Città}`,
          `${shortDate(row.Data)}: ${row["Attività Principali"] || ""}`

        meta.city && row[meta.city]

        if (!event.target.closest("button, a, select")) {

        }
      };

      const right = meta.status
        ? renderStatus(row, meta.status)
        : meta.badge && row[meta.badge]
          ? `<span class="badge">
               ${iconFor(meta.badge)} ${escapeHtml(row[meta.badge])}
             </span>`

            <span class="bullet-icon">${iconFor(field)}</span>
            <span>${escapeHtml(row[field])}</span>
          </div>
        `
        : "").join("");

      const extra = (meta.extra || []).map((field) => row[field]
        ? `
          <div class="bullet muted">
            <span class="bullet-icon">${iconFor(field)}</span>
            <span>
              ${escapeHtml(field)}: ${escapeHtml(row[field])}
            </span>

          <a

            target="_blank"
            rel="noopener"
          >

      }).join("");

      const emergency = key === "10. Emergenze" &&
        isPhone(row["Numero / Riferimento"])

        `
        : "";

      card.innerHTML = `
        <div class="card-top">
          <div class="card-title-wrap">

            ${subtitle

                   ${escapeHtml(subtitle)}
                 </div>`

               ${notes}

    function renderStatus(row, field) {
      const current = row[field] || STATUSES[0];
      const className = current === "Fatto"
        ? "state-ready"
        : current === "Da comprare"
          ? "state-buy"
          : current === "In valigia"
            ? "state-booked"
            : "state-preparing";

      return `
        <select class="status-select ${className}" data-status>
          ${STATUSES.map((option) => `
            <option
              value="${option}"
              ${option === current ? "selected" : ""}
            >
              ${option}
            </option>
          `).join("")}
        </select>
      `;
    }

    function renderEuro(row) {
      const value = Number(row["Budget Previsto (Yen)"]);
      if (Number.isNaN(value)) return "";

      return `
        <div class="bullet muted">
          <span class="bullet-icon">💶</span>
          <span>
            Previsto: ≈ €${(
              value / (state.settings.exchangeRate || 160)
            ).toFixed(2)}
          </span>
        </div>
      `;
    }

    /* ================================================================
       6. Mappa e calendario
       ================================================================ */

    function renderMap() {
      const wrapper = document.createElement("div");
      let found = false;

      SHEETS.forEach((key) => {
        const meta = META[key];
        if (!meta.maps) return;

        const links = [];

        (state.data[key]?.rows || []).forEach((row) => {
          meta.maps.forEach((map) => {
            if (!isUrl(row[map.field])) return;
            found = true;
            links.push({
              title: row[meta.title] || row[meta.fallback] || "—",
              subtitle: (meta.sub || [])
                .map((field) => row[field])
                .filter(Boolean)
                .join(" · "),
              url: row[map.field],
              city: meta.city ? row[meta.city] : ""
            });
          });
        });

        if (!links.length) return;

        const heading = document.createElement("div");
        heading.className = "group-title";
        heading.innerHTML = `${ICONS[key]} ${meta.label}`;
        wrapper.appendChild(heading);

        links.forEach((item) => {
          const card = document.createElement("article");
          card.className = `card${item.city
            ? ` city-card ${cityClass(item.city)}`
            : ""}`;
          card.innerHTML = `
            <h3 class="card-title">${escapeHtml(item.title)}</h3>
            ${item.subtitle
              ? `<div class="card-subtitle">
                   ${escapeHtml(item.subtitle)}
                 </div>`
              : ""}
            <div class="button-row">
              <a
                class="action-button"
                href="${item.url}"
                target="_blank"
                rel="noopener"
              >📍 Apri in Maps</a>
            </div>
          `;
          wrapper.appendChild(card);
        });
      });

      if (!found) {
        wrapper.innerHTML = `
          <div class="empty-state">
            📍 Nessun link Google Maps inserito.
          </div>
        `;
      }

      return wrapper;
    }

    function addCalendar(row) {
      const date = parseDate(row.Data);
      if (!date) {
        showToast("Data non valida");
        return;
      }

      const start = row.Data.replace(/-/g, "");
      const next = new Date(date.getTime() + 86400000);
      const end = `${next.getFullYear()}${String(
        next.getMonth() + 1
      ).padStart(2, "0")}${String(next.getDate()).padStart(2, "0")}`;

      const content = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "BEGIN:VEVENT",
        `UID:giappone-${start}@local`,
        `DTSTART;VALUE=DATE:${start}`,
        `DTEND;VALUE=DATE:${end}`,
        `SUMMARY:${row.Città}: ${row["Attività Principali"]}`,
        `DESCRIPTION:${row.Spostamento || ""}`,
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");

      downloadFile(
        content,
        `giorno-${row.Data}.ics`,
        "text/calendar;charset=utf-8"
      );
      showToast("📅 File calendario creato");
    }

    function shareText(title, text) {
      if (navigator.share) {
        navigator.share({ title, text }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard
          .writeText(text)
          .then(() => showToast("📋 Copiato"));
      } else {
        showToast("Condivisione non supportata");
      }
    }

    /* ================================================================
       7. Modali e impostazioni
       ================================================================ */

    function openEditModal(key, index) {
      const sheet = state.data[key];
      const row = index === null ? {} : sheet.rows[index];
      const meta = META[key];
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.onclick = (event) => {
        if (event.target === overlay) closeModal();
      };

      const modal = document.createElement("div");
      modal.className = "modal";
      modal.innerHTML = `
        <h2 class="modal-title">
          ${index === null ? "➕ Nuovo" : "✎ Modifica"}
          · ${ICONS[key]} ${meta.label}
        </h2>
        ${sheet.headers.map((field) => renderField(
          field,
          row[field],
          meta
        )).join("")}
        <div class="modal-actions">
          <button class="cancel-button" data-cancel>
            Annulla
          </button>
          <button class="save-button" data-save>
            Salva
          </button>
        </div>
        ${index === null
          ? ""
          : `<div class="modal-actions">
               <button class="delete-button" data-delete>
                 🗑️ Elimina
               </button>
             </div>`}
      `;

      overlay.appendChild(modal);
      document.getElementById("modalRoot").appendChild(overlay);
      modal.querySelector("[data-cancel]").onclick = closeModal;

      modal.querySelector("[data-save]").onclick = () => {
        const updated = {};
        modal.querySelectorAll("[data-field]").forEach((field) => {
          updated[field.dataset.field] = field.value;
        });

        if (index === null) sheet.rows.push(updated);
        else sheet.rows[index] = updated;

        saveData();
        closeModal();
        renderApp();
        showToast("✅ Salvato");
      };

      const remove = modal.querySelector("[data-delete]");
      if (remove) {
        remove.onclick = () => {
          sheet.rows.splice(index, 1);
          saveData();
          closeModal();
          renderApp();
          showToast("🗑️ Eliminato");
        };
      }
    }

    function renderField(field, value, meta) {
      const current = value || "";
      const label = `${iconFor(field)} ${field}`;

      if (meta.status === field) {
        return `
          <div class="field">
            <label class="field-label">
              ${escapeHtml(label)}
            </label>
            <select data-field="${escapeHtml(field)}">
              ${STATUSES.map((option) => `
                <option
                  value="${option}"
                  ${option === current ? "selected" : ""}
                >${option}</option>
              `).join("")}
            </select>
          </div>
        `;
      }

      if (field === "Urgenza" || field === "Urgenza Configurazione") {
        return `
          <div class="field">
            <label class="field-label">
              ${escapeHtml(label)}
            </label>
            <select data-field="${escapeHtml(field)}">
              <option>Alta</option>
              <option>Media</option>
              <option>Bassa</option>
            </select>
          </div>
        `;
      }

      const type = /^data$/i.test(field)
        ? "date"
        : /link|maps/i.test(field)
          ? "url"
          : "text";

      const isLong = /note|dettagli|articolo mirato|attività/i.test(field);

      if (isLong) {
        return `
          <div class="field">
            <label class="field-label">
              ${escapeHtml(label)}
            </label>
            <textarea data-field="${escapeHtml(field)}">${escapeHtml(current)}</textarea>
          </div>
        `;
      }

      return `
        <div class="field">
          <label class="field-label">
            ${escapeHtml(label)}
          </label>
          <input
            type="${type}"
            data-field="${escapeHtml(field)}"
            value="${escapeHtml(current)}"
            ${type === "url"
              ? "placeholder=\"https://maps.app.goo.gl/...\""
              : ""}
          >
        </div>
      `;
    }

    function closeModal() {
      document.getElementById("modalRoot").innerHTML = "";
    }

        <section class="settings-section">

          <div class="theme-options">
            <button class="pill-button" data-theme="light">
              ☀️ Chiaro
            </button>
            <button class="pill-button" data-theme="dark">
              🌙 Scuro
            </button>
            <button class="pill-button" data-theme="auto">
              🔄 Automatico
            </button>
          </div>
        </section>

        <section class="settings-section">
          <h2 class="settings-heading">🖌️ Colore accento</h2>
          <div class="accent-options">
            <button class="color-swatch" data-accent="torii" style="background:#c94a5a"></button>
            <button class="color-swatch" data-accent="ao" style="background:#3f6ea8"></button>
            <button class="color-swatch" data-accent="matcha" style="background:#4f8a5e"></button>
            <button class="color-swatch" data-accent="sakura" style="background:#d97ea0"></button>
          </div>
        </section>

        <section class="settings-section">
          <h2 class="settings-heading">💴 Cambio Yen / Euro</h2>
          <label class="rate-box">
            <span>1 € =</span>
            <input
              id="exchangeRate"
              type="number"

            >
            <span>¥</span>
          </label>
        </section>

        <section class="settings-section">
          <h2 class="settings-heading">💾 Backup</h2>

            💾 Esporta JSON <span>›</span>
          </button>
          <button class="settings-button" data-action="import-json">
            📥 Importa JSON <span>›</span>
          </button>
          <button class="settings-button" data-action="export-xlsx">

          <button class="settings-button" data-action="import-xlsx">

      wrapper.querySelectorAll("[data-theme]").forEach((button) => {

          saveSettings();

        };
      });

      wrapper.querySelectorAll("[data-accent]").forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.accent === state.settings.accent
        );
        button.onclick = () => {
          state.settings.accent = button.dataset.accent;
          saveSettings();
          applyTheme();
          renderApp();
        };
      });

      wrapper.querySelector("#exchangeRate").onchange = (event) => {
        const value = Number(event.target.value);
        if (value > 0) {
          state.settings.exchangeRate = value;
          saveSettings();
          showToast("💴 Cambio aggiornato");
        }
      };

      wrapper.querySelector('[data-action="export-json"]').onclick = () => {
        downloadFile(
          JSON.stringify({
            data: state.data,
            settings: state.settings
          }, null, 2),
          "giappone-backup.json",
          "application/json"
        );
        showToast("💾 Backup esportato");
      };

      wrapper.querySelector('[data-action="import-json"]').onclick = () => {
        wrapper.querySelector("#jsonInput").click();
      };

      wrapper.querySelector("#jsonInput").onchange = importJson;
      wrapper.querySelector('[data-action="export-xlsx"]').onclick = exportXlsx;
      wrapper.querySelector('[data-action="import-xlsx"]').onclick = () => {
        wrapper.querySelector("#xlsxInput").click();
      };
      wrapper.querySelector("#xlsxInput").onchange = importXlsx;

      return wrapper;
    }

    function importJson(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const payload = JSON.parse(reader.result);
          if (payload.data) state.data = payload.data;
          if (payload.settings) state.settings = payload.settings;
          saveData();
          saveSettings();
          applyTheme();
          renderApp();
          showToast("✅ Backup importato");
        } catch (error) {
          alert(`Backup non valido: ${error.message}`);
        }
      };
      reader.readAsText(file);
    }

    function exportXlsx() {
      if (!window.XLSX) {
        alert("Libreria Excel non disponibile.");
        return;
      }

      const workbook = XLSX.utils.book_new();

      SHEETS.forEach((key) => {
        const sheet = state.data[key];
        if (!sheet) return;

        const values = [
          sheet.headers,
          ...sheet.rows.map((row) => {
            return sheet.headers.map((header) => row[header] || "");
          })
        ];

        XLSX.utils.book_append_sheet(
          workbook,
          XLSX.utils.aoa_to_sheet(values),
          key.slice(0, 31)
        );
      });

      XLSX.writeFile(workbook, "Giappone_Backup.xlsx");
      showToast("📤 Excel esportato");
    }

    function importXlsx(event) {
      const file = event.target.files?.[0];
      if (!file || !window.XLSX) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const workbook = XLSX.read(
            new Uint8Array(reader.result),
            { type: "array", cellDates: false }
          );

          const imported = {};
          const missing = [];
          let total = 0;

          SHEETS.forEach((key) => {
            const name = workbook.SheetNames.find((item) => {
              return item.trim() === key.trim();
            }) || workbook.SheetNames.find((item) => {
              return item.replace(/^\d+\.\s*/, "").trim() ===
                key.replace(/^\d+\.\s*/, "").trim();
            });

            if (!name) {
              missing.push(key);
              return;
            }

            const values = XLSX.utils.sheet_to_json(
              workbook.Sheets[name],
              { header: 1, defval: "", raw: false }
            );

            if (!values.length) {
              missing.push(key);
              return;
            }

            const headers = values[0].map((header) => {
              return String(header).trim();
            });

            const rows = values.slice(1)
              .filter((row) => {
                return row.some((value) => {
                  return value !== "" &&
                    value !== null &&
                    value !== undefined;
                });
              })
              .map((row) => {
                const result = {};
                headers.forEach((header, index) => {
                  result[header] = String(row[index] ?? "");
                });
                return result;
              });

            imported[key] = { headers, rows };
            total += rows.length;
          });

          if (missing.length) {
            alert(
              "Importazione annullata per sicurezza. " +
              "Fogli mancanti o vuoti:\n\n" +
              missing.join("\n")
            );
            return;
          }

          state.data = imported;
          saveData();
          state.view = "1. Itinerario";
          renderApp();
          showToast(`✅ Importati ${total} elementi`);
        } catch (error) {
          alert(`Errore Excel: ${error.message}`);
        }
      };

      reader.readAsArrayBuffer(file);
    }

    /* ================================================================
       8. Avvio
       ================================================================ */

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("sw.js")
          .catch(() => {});
      });
    }

    window.addEventListener("scroll", () => {
      document.getElementById("topbar").classList.toggle(
        "scrolled",
        window.scrollY > 30
      );
    }, { passive: true });

    matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", () => {
        if (state.settings.theme === "auto") applyTheme();
      });

    applyTheme();
    renderBackground();
    renderTabs();
    renderApp();
  </script>
</body>
</html>
