<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Giappone">

  <title>Giappone 2026/27</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    /* ================================================================
       1. Variabili tema
       ================================================================ */

    :root {
      --bg: #f3f1ec;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-solid: #ffffff;
      --surface-soft: rgba(250, 248, 244, 0.86);
      --text: #1c1a18;
      --text-muted: #77716a;
      --border: rgba(230, 224, 214, 0.88);
      --accent: #c94a5a;
      --accent-soft: #fae9eb;
      --gold: #c9a24a;
      --nav-bg: rgba(255, 255, 255, 0.72);
      --header-bg: rgba(243, 241, 236, 0.72);
      --shadow-small: 0 1px 3px rgba(28, 20, 10, 0.08);
      --shadow-card: 0 1px 2px rgba(28, 20, 10, 0.06), 0 12px 24px -12px rgba(28, 20, 10, 0.24);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius-large: 26px;
      --radius-medium: 20px;
      --radius-small: 12px;
    }

    html[data-theme="dark"] {
      --bg: #111318;
      --surface: rgba(27, 30, 38, 0.86);
      --surface-solid: #1b1e26;
      --surface-soft: rgba(34, 37, 46, 0.86);
      --text: #f2f0ec;
      --text-muted: #96939a;
      --border: rgba(44, 47, 57, 0.92);
      --accent-soft: #35232a;
      --nav-bg: rgba(17, 19, 24, 0.74);
      --header-bg: rgba(17, 19, 24, 0.74);
      --shadow-small: 0 1px 3px rgba(0, 0, 0, 0.36);
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.44), 0 12px 26px -12px rgba(0, 0, 0, 0.7);
    }

    html[data-accent="ao"] {
      --accent: #3f6ea8;
      --accent-soft: #e8eef8;
    }

    html[data-accent="torii"] {
      --accent: #c94a5a;
      --accent-soft: #fae9eb;
    }

    html[data-accent="matcha"] {
      --accent: #4f8a5e;
      --accent-soft: #e8f2e9;
    }

    html[data-accent="sakura"] {
      --accent: #d97ea0;
      --accent-soft: #f9e9f0;
    }

    html[data-theme="dark"][data-accent="ao"] {
      --accent-soft: #1a293b;
    }

    html[data-theme="dark"][data-accent="matcha"] {
      --accent-soft: #192d1e;
    }

    html[data-theme="dark"][data-accent="sakura"] {
      --accent-soft: #30212a;
    }

    .city-osaka { --city-color: #e08a3c; }
    .city-kyoto { --city-color: #4f8a5e; }
    .city-tokyo { --city-color: #2c4a6e; }
    .city-takayama { --city-color: #b5623f; }
    .city-hiroshima { --city-color: #7a6bb0; }
    .city-kamakura { --city-color: #3f9b9b; }
    .city-kawaguchiko { --city-color: #4f8fc9; }
    .city-partenza { --city-color: #8a8478; }
    .city-default { --city-color: var(--accent); }

    /* ================================================================
       2. Reset e struttura
       ================================================================ */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior-y: none;
      -webkit-text-size-adjust: 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    select {
      cursor: pointer;
    }

    a {
      color: var(--accent);
    }

    #app {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      isolation: isolate;
    }

    main {
      position: relative;
      z-index: 2;
      flex: 1;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 12px 16px calc(116px + var(--safe-bottom));
    }

    .view-fade {
      animation: viewFade 0.25s ease;
    }

    @keyframes viewFade {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ================================================================
       3. Sfondo: pattern sempre visibile
       ================================================================ */

    .background-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 88% 8%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 30%),
        radial-gradient(circle at 8% 38%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 27%);
    }

    .background-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, color-mix(in srgb, var(--bg) 12%, transparent) 100%);
    }

    .background-pattern {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.24;
    }

    html[data-theme="dark"] .background-pattern {
      opacity: 0.36;
    }

    /* ================================================================
       4. Header glassmorphism
       ================================================================ */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: max(14px, calc(var(--safe-top) + 10px)) 18px 10px;
      border-bottom: 1px solid transparent;
      background: var(--header-bg);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      backdrop-filter: blur(22px) saturate(160%);
      transition: padding 0.25s ease, border-color 0.25s ease;
    }

    .topbar.scrolled {
      padding-bottom: 6px;
      border-bottom-color: var(--border);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 9px;
      background: var(--accent);
      box-shadow: var(--shadow-small);
      transition: width 0.25s ease, height 0.25s ease;
    }

    .logo-mark svg {
      width: 62%;
      height: 62%;
    }

    .topbar.scrolled .logo-mark {
      width: 24px;
      height: 24px;
    }

    .page-title {
      flex: 1;
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.03em;
      transition: font-size 0.25s ease;
    }

    .topbar.scrolled .page-title {
      font-size: 19px;
    }

    .page-subtitle {
      max-height: 24px;
      padding-left: 40px;
      margin-top: 3px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 13.5px;
      transition: opacity 0.2s ease, max-height 0.25s ease, margin 0.25s ease;
    }

    .topbar.scrolled .page-subtitle {
      max-height: 0;
      margin-top: 0;
      opacity: 0;
    }

    .trip-banner {
      margin-top: 10px;
      padding: 11px 15px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-soft), transparent);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      box-shadow: var(--shadow-small);
    }

    /* ================================================================
       5. Superfici trasparenti
       ================================================================ */

    .card,
    .stat-box,
    .progress-card,
    .toolbar input,
    .dropdown select,
    .settings-button,
    .rate-box,
    .field input,
    .field select,
    .field textarea {
      background: var(--surface);
      -webkit-backdrop-filter: blur(14px) saturate(135%);
      backdrop-filter: blur(14px) saturate(135%);
    }

    /* ================================================================
       6. Statistiche e valigia
       ================================================================ */

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0 6px;
    }

    .stat-box {
      padding: 15px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-medium);
      text-align: center;
      box-shadow: var(--shadow-small);
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
    }

    .progress-card {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 14px 0 6px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-medium);
      box-shadow: var(--shadow-small);
    }

    .progress-ring {
      flex: 0 0 auto;
      transform: rotate(-90deg);
    }

    .progress-ring-background {
      fill: none;
      stroke: var(--border);
      stroke-width: 8;
    }

    .progress-ring-value {
      fill: none;
      stroke: var(--accent);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.4s ease;
    }

    .progress-ring-label {
      fill: var(--text);
      font-size: 13px;
      font-weight: 800;
    }

    .progress-title {
      font-size: 14px;
      font-weight: 800;
    }

    .progress-subtitle {
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
    }

    /* ================================================================
       7. Toolbar
       ================================================================ */

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 12px;
    }

    .toolbar input[type="search"] {
      flex: 1 1 140px;
      min-width: 0;
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      outline: none;
      color: var(--text);
      font-size: 15px;
      box-shadow: var(--shadow-small);
    }

    .dropdown select {
      max-width: 155px;
      padding: 12px 30px 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow-small);
    }

    .toolbar input:focus,
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* ================================================================
       8. Card
       ================================================================ */

    .card {
      position: relative;
      overflow: hidden;
      margin-bottom: 12px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-medium);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:active {
      transform: scale(0.985);
    }

    .card.city-card {
      border-left: 4px solid var(--city-color, var(--accent));
    }

    .card.today {
      box-shadow: 0 0 0 2px var(--accent), var(--shadow-card);
    }

    .card-top,
    .card-top-left {
      display: flex;
      align-items: center;
    }

    .card-top {
      justify-content: space-between;
      gap: 10px;
    }

    .card-top-left {
      min-width: 0;
      gap: 10px;
    }

    .card-title-wrap {
      min-width: 0;
    }

    .card-title {
      margin: 0;
      font-size: 17.5px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.015em;
      overflow-wrap: anywhere;
    }

    .card-subtitle {
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .day-chip {
      flex: 0 0 auto;
      padding: 5px 11px;
      border-radius: 9px;
      background: var(--city-color, var(--accent));
      color: #fff;
      font-size: 11.5px;
      font-weight: 800;
    }

    .day-chip.today-chip {
      background: #2ea86b;
    }

    .date-chevron {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 4px;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chevron {
      color: var(--text-muted);
      font-size: 17px;
      opacity: 0.55;
    }

    .badge {
      flex: 0 0 auto;
      padding: 5px 11px;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .bullet {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.45;
    }

    .bullet-icon {
      width: 20px;
      flex: 0 0 auto;
      margin-top: 1px;
      text-align: center;
    }

    .bullet.muted {
      color: var(--text-muted);
      font-size: 13.5px;
    }

    .hotel-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      background: var(--surface-soft);
    }

    .hotel-name {
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 11px;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      padding: 10px 15px;
      border: 0;
      border-radius: var(--radius-small);
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: var(--shadow-small);
    }

    .action-button.small {
      padding: 8px 13px;
      font-size: 12.5px;
    }

    .action-button.secondary {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: none;
    }

    .status-select {
      max-width: 135px;
      padding: 8px 27px 8px 13px;
      border: 0;
      border-radius: 20px;
      outline: none;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12.5px;
      font-weight: 800;
    }

    .empty-state {
      padding: 56px 20px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 4px 10px;
      font-size: 14px;
      font-weight: 800;
    }

    /* ================================================================
       9. Tabbar e pulsante aggiunta
       ================================================================ */

    .floating-button {
      position: fixed;
      right: 18px;
      bottom: calc(84px + var(--safe-bottom));
      z-index: 15;
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 18px;
      background: var(--accent);
      color: #fff;
      font-size: 26px;
      box-shadow: 0 8px 20px -4px var(--accent);
    }

    .tabbar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 25;
      display: flex;
      overflow-x: auto;
      padding: 9px 0 calc(6px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: var(--nav-bg);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      scrollbar-width: none;
    }

    .tabbar::-webkit-scrollbar {
      display: none;
    }

    .tab-button {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 66px;
      padding: 5px 8px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 700;
    }

    .tab-button-icon {
      font-size: 21px;
    }

    .tab-button.active {
      color: var(--accent);
    }

    /* ================================================================
       10. Impostazioni, modali e toast
       ================================================================ */

    .settings-section {
      margin-bottom: 26px;
    }

    .settings-heading {
      margin: 0 0 6px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .theme-options,
    .accent-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill-button {
      padding: 11px 17px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow-small);
    }

    .pill-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .color-swatch {
      width: 42px;
      height: 42px;
      border: 3px solid transparent;
      border-radius: 50%;
      box-shadow: var(--shadow-small);
    }

    .color-swatch.active {
      border-color: var(--text);
    }

    .settings-button,
    .rate-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 10px;
      margin-top: 8px;
      padding: 15px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      box-shadow: var(--shadow-small);
    }

    .settings-button.danger {
      color: var(--accent);
    }

    .rate-box input {
      width: 90px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 15px;
      text-align: right;
    }

    input[type="file"] {
      display: none;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: flex-end;
      background: rgba(20, 15, 10, 0.5);
    }

    .modal {
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 22px 20px calc(26px + var(--safe-bottom));
      border-radius: 28px 28px 0 0;
      background: var(--surface-solid);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.25);
    }

    .modal-title {
      margin: 0 0 16px;
      font-size: 19px;
      font-weight: 800;
    }

    .field {
      margin-bottom: 13px;
    }

    .field-label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      outline: none;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 16px;
    }

    .field textarea {
      min-height: 64px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-actions button {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
    }

    .save-button { background: var(--accent); color: #fff; }
    .cancel-button { border: 1px solid var(--border) !important; background: var(--surface-soft); color: var(--text); }
    .delete-button { background: #c94a5a; color: #fff; }

    .toast {
      position: fixed;
      bottom: calc(100px + var(--safe-bottom));
      left: 50%;
      z-index: 50;
      max-width: 90vw;
      padding: 12px 18px;
      border-radius: 20px;
      background: var(--text);
      color: var(--bg);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity 0.3s ease;
    }

    .toast.visible {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="backgroundLayer" class="background-layer">
      <svg id="backgroundPattern" class="background-pattern" viewBox="0 0 520 520" preserveAspectRatio="xMidYMid slice"></svg>
    </div>

    <header id="topbar" class="topbar">
      <div class="topbar-row">
        <div class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
            <path d="M3 9h18M6 9V6c0-1 1-2 2-2h8c1 0 2 1 2 2v3M6 9v11M18 9v11" />
          </svg>
        </div>
        <h1 id="pageTitle" class="page-title">Itinerario</h1>
      </div>
      <div id="pageSubtitle" class="page-subtitle"></div>
      <div id="tripBanner" class="trip-banner" hidden></div>
    </header>

    <main id="main"></main>
    <button id="addButton" class="floating-button" type="button" hidden>+</button>
    <nav id="tabbar" class="tabbar" aria-label="Sezioni app"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script>
    /* ================================================================
       1. Costanti e configurazione
       ================================================================ */

    const DATA_KEY = "giappone-data";
    const SETTINGS_KEY = "giappone-settings";

    const SHEETS = [
      "1. Itinerario",
      "2. Hotel e Alloggi",
      "3. Trasporti",
      "4. App",
      "5. Valigia",
      "6. Attrazioni",
      "7. Guida",
      "8. Cibo e Ristoranti",
      "9. Shopping",
      "10. Emergenze",
      "11. Budget"
    ];

    const STATUSES = ["Da preparare", "Da comprare", "In valigia", "Fatto"];
    const URGENCY_ORDER = { Alta: 0, Media: 1, Bassa: 2 };
    const MONTHS = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
    const WEEKDAYS = ["dom", "lun", "mar", "mer", "gio", "ven", "sab"];

    const SECTION_ICONS = {
      "1. Itinerario": "🗺️",
      "2. Hotel e Alloggi": "🏨",
      "3. Trasporti": "🚄",
      "4. App": "📱",
      "5. Valigia": "🧳",
      "6. Attrazioni": "⛩️",
      "7. Guida": "📖",
      "8. Cibo e Ristoranti": "🍜",
      "9. Shopping": "🛍️",
      "10. Emergenze": "🚨",
      "11. Budget": "💴"
    };

    const FIELD_ICONS = {
      "Città": "📍",
      "Categoria": "🏷️",
      "Note": "📝",
      "Note e Suggerimenti": "📝",
      "Note per il Giappone": "🎒",
      "Note / Categoria": "📝",
      "Note / Conferma": "📝",
      "Costo Stimato": "💰",
      "Durata": "⏱️",
      "Mezzo / Vettore": "🚆",
      "Nome Hotel / Ryokan": "🏨",
      "Quartiere": "🧭",
      "Articolo Mirato / Note": "🛍️",
      "Dettagli Operativi": "📋",
      "Numero / Riferimento": "☎️",
      "Funzione Principale": "⚙️",
      "Urgenza Configurazione": "⏳",
      "Urgenza": "⏳",
      "Spesa Effettiva Revolut": "💸",
      "Differenza": "📊",
      "Budget Previsto (Yen)": "💴",
      "Pernottamento": "🏨",
      "Spostamento": "🚉",
      "App": "📱",
      "Contatto / Servizio": "🚨"
    };

    const META = {
      "1. Itinerario": { label: "Itinerario", title: "Attività Principali", search: ["Città", "Attività Principali", "Spostamento"] },
      "2. Hotel e Alloggi": { label: "Alloggi", title: "Nome Hotel / Ryokan", fallback: "Città", sub: ["Città", "Notte"], notes: ["Note / Conferma"], maps: [{ field: "Link Google Maps", label: "Maps" }], search: ["Città", "Nome Hotel / Ryokan"], city: "Città" },
      "3. Trasporti": { label: "Trasporti", title: "Tratta / Servizio", sub: ["Mezzo / Vettore"], badge: "Costo Stimato", extra: ["Durata"], maps: [{ field: "Link Maps Partenza", label: "Partenza" }, { field: "Link Maps Arrivo", label: "Arrivo" }], search: ["Tratta / Servizio", "Mezzo / Vettore"] },
      "4. App": { label: "App", title: "App", sub: ["Categoria"], badge: "Urgenza Configurazione", notes: ["Funzione Principale", "Note"], search: ["App", "Categoria"] },
      "5. Valigia": { label: "Valigia", title: "Articolo", sub: ["Categoria"], status: "Messo in Valigia?", notes: ["Note per il Giappone"], extra: ["Urgenza"], search: ["Articolo", "Categoria"] },
      "6. Attrazioni": { label: "Attrazioni", title: "Attrazione", fallback: "Città", sub: ["Città", "Categoria"], badge: "Urgenza", notes: ["Note"], maps: [{ field: "Link Google Maps", label: "Maps" }], search: ["Città", "Attrazione", "Categoria"], city: "Città" },
      "7. Guida": { label: "Guida", title: "Argomento", notes: ["Dettagli Operativi"], search: ["Argomento"] },
      "8. Cibo e Ristoranti": { label: "Cibo", title: "Specialità / Piatto", fallback: "Città", sub: ["Città", "Categoria"], notes: ["Note e Suggerimenti"], maps: [{ field: "Link Google Maps", label: "Maps" }], search: ["Città", "Specialità / Piatto", "Categoria"], city: "Città" },
      "9. Shopping": { label: "Shopping", title: "Brand / Negozio", fallback: "Quartiere", sub: ["Città", "Quartiere", "Categoria"], notes: ["Articolo Mirato / Note"], maps: [{ field: "Link Google Maps", label: "Maps" }], search: ["Città", "Quartiere", "Brand / Negozio"], city: "Città" },
      "10. Emergenze": { label: "Emergenze", title: "Contatto / Servizio", sub: ["Numero / Riferimento"], notes: ["Dettagli Operativi"], search: ["Contatto / Servizio"] },
      "11. Budget": { label: "Budget", title: "Data", sub: ["Giorno"], badge: "Budget Previsto (Yen)", notes: ["Note / Categoria"], extra: ["Spesa Effettiva Revolut", "Differenza"], search: ["Data", "Giorno"] }
    };

    const TABS = ["1. Itinerario", "mappa", "6. Attrazioni", "8. Cibo e Ristoranti", "2. Hotel e Alloggi", "3. Trasporti", "9. Shopping", "4. App", "5. Valigia", "7. Guida", "10. Emergenze", "11. Budget", "settings"];

    /* ================================================================
       2. Stato applicazione
       ================================================================ */

    const appState = {
      data: JSON.parse(localStorage.getItem(DATA_KEY) || "{}"),
      settings: JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}"),
      view: "1. Itinerario",
      search: "",
      city: "",
      sort: "default"
    };

    if (!appState.settings.theme) appState.settings.theme = "auto";
    if (!appState.settings.accent) appState.settings.accent = "torii";
    if (!appState.settings.exchangeRate) appState.settings.exchangeRate = 160;

    function saveData() {
      localStorage.setItem(DATA_KEY, JSON.stringify(appState.data));
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(appState.settings));
    }

    function applyTheme() {
      let theme = appState.settings.theme;
      if (theme === "auto") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.accent = appState.settings.accent;
    }

    /* ================================================================
       3. Utility
       ================================================================ */

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function iconFor(field) {
      return FIELD_ICONS[field] || "•";
    }

    function isUrl(value) {
      return /^https?:\/\//i.test(String(value || "").trim());
    }

    function isPhone(value) {
      return /^[\d+\-\s()]{3,}$/.test(String(value || "").trim());
    }

    function parseDate(value) {
      const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
      return match ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : null;
    }

    function todayString() {
      const date = new Date();
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function shortDate(value) {
      const date = parseDate(value);
      return date ? `${WEEKDAYS[date.getDay()]} ${date.getDate()} ${MONTHS[date.getMonth()]}` : String(value || "");
    }

    function monthDay(value) {
      const date = parseDate(value);
      return date ? `${date.getDate()} ${MONTHS[date.getMonth()]}` : String(value || "");
    }

    function cityClass(value) {
      const city = String(value || "").split("/")[0].trim().toLowerCase();
      const classes = { osaka: "city-osaka", kyoto: "city-kyoto", tokyo: "city-tokyo", takayama: "city-takayama", hiroshima: "city-hiroshima", kamakura: "city-kamakura", kawaguchiko: "city-kawaguchiko", partenza: "city-partenza" };
      return classes[city] || "city-default";
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("visible");
      setTimeout(() => toast.classList.remove("visible"), 2300);
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    /* ================================================================
       4. Sfondo visibile
       ================================================================ */

    function renderBackground() {
      const svg = document.getElementById("backgroundPattern");
      const radius = 46;
      let paths = "";

      for (let row = 0; row < 11; row += 1) {
        for (let column = 0; column < 14; column += 1) {
          const offset = row % 2 ? radius * 0.52 : 0;
          const x = column * radius * 1.05 + offset;
          const y = row * radius * 0.55;
          paths += `<path d="M${x - radius} ${y}a${radius} ${radius} 0 0 1 ${radius * 2} 0" fill="none" stroke="var(--accent)" stroke-width="1.6"/>`;
        }
      }

      svg.innerHTML = paths;
    }

    /* ================================================================
       5. Navigazione e header
       ================================================================ */

    function renderTabs() {
      const tabbar = document.getElementById("tabbar");
      tabbar.innerHTML = "";

      TABS.forEach((key) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.dataset.tab = key;

        const icon = key === "mappa" ? "🗺️📍" : key === "settings" ? "⚙️" : SECTION_ICONS[key];
        const label = key === "mappa" ? "Mappa" : key === "settings" ? "Impostazioni" : META[key].label;

        button.innerHTML = `<span class="tab-button-icon">${icon}</span>${label}`;
        button.onclick = () => {
          appState.view = key;
          appState.search = "";
          appState.city = "";
          appState.sort = "default";
          renderApp();
        };

        tabbar.appendChild(button);
      });
    }

    function renderTripBanner() {
      const banner = document.getElementById("tripBanner");
      const rows = appState.data["1. Itinerario"]?.rows || [];

      if (!rows.length) {
        banner.hidden = true;
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const first = parseDate(rows[0].Data);
      const last = parseDate(rows[rows.length - 1].Data);

      if (!first || !last) {
        banner.hidden = true;
        return;
      }

      banner.hidden = false;
      if (today < first) {
        banner.textContent = `🛫 Mancano ${Math.ceil((first - today) / 86400000)} giorni alla partenza`;
      } else if (today <= last) {
        const index = Math.max(0, rows.findIndex((row) => row.Data === todayString()));
        banner.textContent = `📍 Sei in viaggio · Giorno ${index + 1} di ${rows.length}`;
      } else {
        banner.textContent = "✅ Viaggio concluso · che ricordi! 🎌";
      }
    }

    /* ================================================================
       6. Rendering principale
       ================================================================ */

    function renderApp() {
      const main = document.getElementById("main");
      const title = document.getElementById("pageTitle");
      const subtitle = document.getElementById("pageSubtitle");
      const addButton = document.getElementById("addButton");

      document.querySelectorAll(".tab-button").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === appState.view);
      });

      main.innerHTML = "";
      main.classList.remove("view-fade");
      void main.offsetWidth;
      main.classList.add("view-fade");
      addButton.hidden = true;
      subtitle.textContent = "";
      renderTripBanner();

      if (appState.view === "settings") {
        title.textContent = "⚙️ Impostazioni";
        main.appendChild(renderSettings());
        return;
      }

      if (appState.view === "mappa") {
        title.textContent = "🗺️ Mappa rapida";
        subtitle.textContent = "Luoghi con link Google Maps";
        main.appendChild(renderMap());
        return;
      }

      const meta = META[appState.view];
      title.textContent = `${SECTION_ICONS[appState.view]} ${meta.label}`;

      if (appState.view === "1. Itinerario") main.appendChild(renderStats());
      if (appState.view === "5. Valigia") main.appendChild(renderPackingProgress());

      addButton.hidden = false;
      addButton.onclick = () => openEditModal(appState.view, null);

      const toolbar = renderToolbar(appState.view, meta);
      const list = document.createElement("div");
      main.append(toolbar, list);
      renderList(appState.view, list);
    }

    function renderStats() {
      const rows = appState.data["1. Itinerario"]?.rows || [];
      const cities = new Set();

      rows.forEach((row) => {
        String(row["Città"] || "").split("/").forEach((city) => {
          const clean = city.trim();
          if (clean && clean !== "Partenza" && clean !== "-") cities.add(clean);
        });
      });

      const first = rows[0]?.Data || "";
      const last = rows[rows.length - 1]?.Data || "";
      document.getElementById("pageSubtitle").textContent = `Giappone ${monthDay(first)} – ${monthDay(last)}`;

      const element = document.createElement("div");
      element.className = "stats-row";
      element.innerHTML = `
        <div class="stat-box"><div class="stat-label">Durata</div><div class="stat-value">${rows.length} giorni</div></div>
        <div class="stat-box"><div class="stat-label">Tappe</div><div class="stat-value">${cities.size} città</div></div>
        <div class="stat-box"><div class="stat-label">Periodo</div><div class="stat-value">${monthDay(first)} – ${monthDay(last)}</div></div>
      `;
      return element;
    }

    function renderPackingProgress() {
      const rows = appState.data["5. Valigia"]?.rows || [];
      const completed = rows.filter((row) => row["Messo in Valigia?"] === "Fatto").length;
      const percent = rows.length ? Math.round((completed / rows.length) * 100) : 0;
      const radius = 30;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (percent / 100) * circumference;

      const element = document.createElement("div");
      element.className = "progress-card";
      element.innerHTML = `
        <svg class="progress-ring" width="72" height="72" viewBox="0 0 72 72">
          <circle class="progress-ring-background" cx="36" cy="36" r="${radius}"></circle>
          <circle class="progress-ring-value" cx="36" cy="36" r="${radius}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
          <text class="progress-ring-label" x="36" y="41" text-anchor="middle" transform="rotate(90 36 36)">${percent}%</text>
        </svg>
        <div><div class="progress-title">🧳 Preparazione valigia</div><div class="progress-subtitle">${completed} di ${rows.length} oggetti pronti</div></div>
      `;
      return element;
    }

    function renderToolbar(key, meta) {
      const toolbar = document.createElement("div");
      toolbar.className = "toolbar";

      const search = document.createElement("input");
      search.type = "search";
      search.placeholder = `🔎 Cerca in ${meta.label}...`;
      search.value = appState.search;
      search.oninput = () => {
        appState.search = search.value;
        renderList(key, toolbar.nextElementSibling);
      };
      toolbar.appendChild(search);

      if (meta.city) {
        const cities = [...new Set(appState.data[key].rows.map((row) => row[meta.city]).filter(Boolean))].sort();
        toolbar.appendChild(createSelect("🌆 Tutte le città", cities.map((city) => ({ value: city, label: city })), appState.city, (value) => {
          appState.city = value;
          renderList(key, toolbar.nextElementSibling);
        }));
      }

      if (key !== "1. Itinerario" && key !== "11. Budget") {
        const options = [{ value: "default", label: "↕️ Originale" }, { value: "alpha", label: "🔤 A-Z" }];
        if (appState.data[key].headers.includes("Urgenza")) options.push({ value: "urgency", label: "⏳ Urgenza" });
        toolbar.appendChild(createSelect("↕️ Originale", options, appState.sort, (value) => {
          appState.sort = value;
          renderList(key, toolbar.nextElementSibling);
        }, true));
      }

      return toolbar;
    }

    function createSelect(firstLabel, options, selected, onChange, custom = false) {
      const wrapper = document.createElement("div");
      wrapper.className = "dropdown";
      const select = document.createElement("select");

      if (!custom) {
        const first = document.createElement("option");
        first.value = "";
        first.textContent = firstLabel;
        select.appendChild(first);
      }

      options.forEach((option) => {
        const element = document.createElement("option");
        element.value = option.value;
        element.textContent = option.label;
        element.selected = option.value === selected;
        select.appendChild(element);
      });

      select.onchange = () => onChange(select.value);
      wrapper.appendChild(select);
      return wrapper;
    }

    function renderList(key, container) {
      if (!container) return;
      const meta = META[key];
      const query = appState.search.toLowerCase().trim();
      let items = (appState.data[key]?.rows || []).map((row, index) => ({ row, index }));

      items = items.filter(({ row }) => {
        const matchesQuery = !query || meta.search.some((field) => String(row[field] || "").toLowerCase().includes(query));
        const matchesCity = !meta.city || !appState.city || row[meta.city] === appState.city;
        return matchesQuery && matchesCity;
      });

      if (appState.sort === "alpha") {
        items.sort((a, b) => String(a.row[meta.title] || a.row[meta.fallback] || "").localeCompare(String(b.row[meta.title] || b.row[meta.fallback] || "")));
      }

      if (appState.sort === "urgency") {
        items.sort((a, b) => (URGENCY_ORDER[a.row.Urgenza] ?? 99) - (URGENCY_ORDER[b.row.Urgenza] ?? 99));
      }

      container.innerHTML = "";

      if (!items.length) {
        container.innerHTML = `<div class="empty-state">🔍 Nessun elemento trovato.<br>Tocca + per aggiungerne uno.</div>`;
        return;
      }

      items.forEach(({ row, index }) => {
        container.appendChild(key === "1. Itinerario" ? renderItineraryCard(row, index) : renderDataCard(key, meta, row, index));
      });
    }

    /* ================================================================
       7. Card
       ================================================================ */

    function renderItineraryCard(row, index) {
      const card = document.createElement("article");
      const today = row.Data === todayString();
      card.className = `card city-card ${cityClass(row["Città"])}${today ? " today" : ""}`;
      card.onclick = (event) => {
        if (!event.target.closest("button, a")) openEditModal("1. Itinerario", index);
      };

      const activities = String(row["Attività Principali"] || "").split(/,|;/).map((value) => value.trim()).filter(Boolean).slice(0, 4);
      const icons = ["☀️", "🏙️", "🌙", "✨"];
      const activitiesHtml = activities.map((value, activityIndex) => `<div class="bullet"><span class="bullet-icon">${icons[activityIndex % icons.length]}</span><span>${escapeHtml(value)}</span></div>`).join("");
      const transferHtml = row["Spostamento"] && row["Spostamento"] !== "-" ? `<div class="bullet muted"><span class="bullet-icon">🚉</span><span>${escapeHtml(row["Spostamento"])}</span></div>` : "";
      const hotel = appState.data["2. Hotel e Alloggi"]?.rows.find((item) => item.Data === row.Data);
      const hotelName = hotel?.["Nome Hotel / Ryokan"] || (row["Pernottamento"] !== "-" ? row["Pernottamento"] : "");
      const hotelHtml = hotelName ? `<div class="hotel-pill"><span class="hotel-name">🏨 ${escapeHtml(hotelName)}</span>${isUrl(hotel?.["Link Google Maps"]) ? `<a class="action-button small" href="${hotel["Link Google Maps"]}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 Maps</a>` : ""}</div>` : "";

      card.innerHTML = `
        <div class="card-top">
          <div class="card-top-left">
            <span class="day-chip${today ? " today-chip" : ""}">${today ? "OGGI" : `G${index + 1}`}</span>
            <div class="card-title-wrap"><h3 class="card-title">${escapeHtml(row["Città"] || "—")}</h3></div>
          </div>
          <div class="date-chevron">${escapeHtml(shortDate(row.Data))}<span class="chevron">›</span></div>
        </div>
        <div class="bullet-list">${activitiesHtml}${transferHtml}</div>
        ${hotelHtml}
        <div class="button-row"><button class="action-button small secondary" data-calendar type="button">📅 Calendario</button><button class="action-button small secondary" data-share type="button">📤 Condividi</button></div>
      `;

      card.querySelector("[data-calendar]").onclick = (event) => {
        event.stopPropagation();
        addCalendar(row);
      };

      card.querySelector("[data-share]").onclick = (event) => {
        event.stopPropagation();
        shareText(`Giappone · ${row.Città}`, `${shortDate(row.Data)}: ${row["Attività Principali"] || ""}`);
      };

      return card;
    }

    function renderDataCard(key, meta, row, index) {
      const title = row[meta.title] || row[meta.fallback] || "(senza titolo)";
      const subtitle = (meta.sub || []).map((field) => row[field]).filter(Boolean).join(" · ");
      const city = meta.city ? row[meta.city] : "";
      const card = document.createElement("article");
      card.className = `card${city ? ` city-card ${cityClass(city)}` : ""}`;
      card.onclick = (event) => {
        if (!event.target.closest("button, a, select")) openEditModal(key, index);
      };

      const topRight = meta.status ? renderStatus(row, meta.status) : meta.badge && row[meta.badge] ? `<span class="badge">${iconFor(meta.badge)} ${escapeHtml(row[meta.badge])}</span>` : `<span class="chevron">›</span>`;
      const notes = (meta.notes || []).map((field) => row[field] ? `<div class="bullet"><span class="bullet-icon">${iconFor(field)}</span><span>${escapeHtml(row[field])}</span></div>` : "").join("");
      const extra = (meta.extra || []).map((field) => row[field] ? `<div class="bullet muted"><span class="bullet-icon">${iconFor(field)}</span><span>${escapeHtml(field)}: ${escapeHtml(row[field])}</span></div>` : "").join("");
      const maps = (meta.maps || []).map((map) => isUrl(row[map.field]) ? `<a class="action-button" href="${row[map.field]}" target="_blank" rel="noopener">📍 ${map.label === "Maps" ? "Apri in Maps" : map.label}</a>` : "").join("");
      const emergency = key === "10. Emergenze" && isPhone(row["Numero / Riferimento"]) ? `<a class="action-button" href="tel:${row["Numero / Riferimento"].replace(/\s/g, "")}">📞 Chiama</a>` : "";

      card.innerHTML = `
        <div class="card-top"><div class="card-title-wrap"><h3 class="card-title">${escapeHtml(title)}</h3>${subtitle ? `<div class="card-subtitle">${escapeHtml(subtitle)}</div>` : ""}</div>${topRight}</div>
        ${(notes || extra) ? `<div class="bullet-list">${notes}${extra}${key === "11. Budget" ? renderEuro(row) : ""}</div>` : ""}
        ${(maps || emergency) ? `<div class="button-row">${maps}${emergency}</div>` : ""}
        <div class="button-row"><button class="action-button small secondary" data-share type="button">📤 Condividi</button></div>
      `;

      const select = card.querySelector("[data-status]");
      if (select) {
        select.onchange = () => {
          row[meta.status] = select.value;
          saveData();
          if (key === "5. Valigia") refreshProgress();
        };
        select.onclick = (event) => event.stopPropagation();
      }

      card.querySelector("[data-share]").onclick = (event) => {
        event.stopPropagation();
        shareText(title, `${title}${subtitle ? ` · ${subtitle}` : ""}`);
      };

      return card;
    }

    function renderStatus(row, field) {
      const current = row[field] || STATUSES[0];
      const options = STATUSES.includes(current) ? STATUSES : [current, ...STATUSES];
      return `<select class="status-select" data-status aria-label="Stato">${options.map((option) => `<option value="${escapeHtml(option)}" ${option === current ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}</select>`;
    }

    function renderEuro(row) {
      const rate = appState.settings.exchangeRate || 160;
      const planned = Number(row["Budget Previsto (Yen)"]);
      return Number.isNaN(planned) ? "" : `<div class="bullet muted"><span class="bullet-icon">💶</span><span>Previsto: ≈ €${(planned / rate).toFixed(2)}</span></div>`;
    }

    /* ================================================================
       8. Mappa, calendario e condivisione
       ================================================================ */

    function renderMap() {
      const wrapper = document.createElement("div");
      let found = false;

      SHEETS.forEach((key) => {
        const meta = META[key];
        if (!meta.maps) return;

        const links = [];
        appState.data[key]?.rows.forEach((row) => {
          meta.maps.forEach((map) => {
            if (!isUrl(row[map.field])) return;
            found = true;
            links.push({ title: row[meta.title] || row[meta.fallback] || "—", subtitle: (meta.sub || []).map((field) => row[field]).filter(Boolean).join(" · "), url: row[map.field], city: meta.city ? row[meta.city] : "" });
          });
        });

        if (!links.length) return;
        const heading = document.createElement("div");
        heading.className = "group-title";
        heading.innerHTML = `${SECTION_ICONS[key]} ${meta.label}`;
        wrapper.appendChild(heading);

        links.forEach((item) => {
          const card = document.createElement("article");
          card.className = `card${item.city ? ` city-card ${cityClass(item.city)}` : ""}`;
          card.innerHTML = `<h3 class="card-title">${escapeHtml(item.title)}</h3>${item.subtitle ? `<div class="card-subtitle">${escapeHtml(item.subtitle)}</div>` : ""}<div class="button-row"><a class="action-button" href="${item.url}" target="_blank" rel="noopener">📍 Apri in Maps</a></div>`;
          wrapper.appendChild(card);
        });
      });

      if (!found) wrapper.innerHTML = `<div class="empty-state">📍 Nessun link Google Maps inserito.</div>`;
      return wrapper;
    }

    function addCalendar(row) {
      const date = parseDate(row.Data);
      if (!date) return showToast("Data non valida");

      const start = row.Data.replace(/-/g, "");
      const next = new Date(date.getTime() + 86400000);
      const end = `${next.getFullYear()}${String(next.getMonth() + 1).padStart(2, "0")}${String(next.getDate()).padStart(2, "0")}`;
      const content = ["BEGIN:VCALENDAR", "VERSION:2.0", "BEGIN:VEVENT", `UID:giappone-${start}@local`, `DTSTART;VALUE=DATE:${start}`, `DTEND;VALUE=DATE:${end}`, `SUMMARY:${row.Città}: ${row["Attività Principali"]}`, `DESCRIPTION:${row["Spostamento"] || ""}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");

      downloadFile(content, `giorno-${row.Data}.ics`, "text/calendar;charset=utf-8");
      showToast("📅 File calendario creato");
    }

    function shareText(title, text) {
      if (navigator.share) navigator.share({ title, text }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showToast("📋 Copiato"));
      else showToast("Condivisione non supportata");
    }

    /* ================================================================
       9. Modali, impostazioni e backup
       ================================================================ */

    function openEditModal(key, index) {
      const sheet = appState.data[key];
      const row = index === null ? {} : sheet.rows[index];
      const meta = META[key];
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.onclick = (event) => { if (event.target === overlay) closeModal(); };

      const modal = document.createElement("div");
      modal.className = "modal";
      modal.innerHTML = `<h2 class="modal-title">${index === null ? "➕ Nuovo" : "✎ Modifica"} · ${SECTION_ICONS[key]} ${meta.label}</h2>${sheet.headers.map((field) => renderField(field, row[field], meta)).join("")}<div class="modal-actions"><button class="cancel-button" data-cancel>Annulla</button><button class="save-button" data-save>Salva</button></div>${index === null ? "" : "<div class=\"modal-actions\"><button class=\"delete-button\" data-delete>🗑️ Elimina</button></div>"}`;

      overlay.appendChild(modal);
      document.getElementById("modalRoot").appendChild(overlay);
      modal.querySelector("[data-cancel]").onclick = closeModal;
      modal.querySelector("[data-save]").onclick = () => {
        const updated = {};
        modal.querySelectorAll("[data-field]").forEach((field) => { updated[field.dataset.field] = field.value; });
        if (index === null) sheet.rows.push(updated); else sheet.rows[index] = updated;
        saveData();
        closeModal();
        renderApp();
        showToast("✅ Salvato");
      };

      const remove = modal.querySelector("[data-delete]");
      if (remove) {
        remove.onclick = () => {
          sheet.rows.splice(index, 1);
          saveData();
          closeModal();
          renderApp();
          showToast("🗑️ Eliminato");
        };
      }
    }

    function renderField(field, value, meta) {
      const current = value || "";
      const label = `${iconFor(field)} ${field}`;

      if (meta.status === field) {
        return `<div class="field"><label class="field-label">${escapeHtml(label)}</label><select data-field="${escapeHtml(field)}">${STATUSES.map((option) => `<option value="${option}" ${option === current ? "selected" : ""}>${option}</option>`).join("")}</select></div>`;
      }

      if (field === "Urgenza" || field === "Urgenza Configurazione") {
        return `<div class="field"><label class="field-label">${escapeHtml(label)}</label><select data-field="${escapeHtml(field)}"><option>Alta</option><option>Media</option><option>Bassa</option></select></div>`;
      }

      const type = /^data$/i.test(field) ? "date" : /link|maps/i.test(field) ? "url" : "text";
      const long = /note|dettagli|articolo mirato|attività/i.test(field);

      if (long) return `<div class="field"><label class="field-label">${escapeHtml(label)}</label><textarea data-field="${escapeHtml(field)}">${escapeHtml(current)}</textarea></div>`;
      return `<div class="field"><label class="field-label">${escapeHtml(label)}</label><input type="${type}" data-field="${escapeHtml(field)}" value="${escapeHtml(current)}" ${type === "url" ? "placeholder=\"https://maps.app.goo.gl/...\"" : ""}></div>`;
    }

    function closeModal() {
      document.getElementById("modalRoot").innerHTML = "";
    }

    function refreshProgress() {
      const progress = document.querySelector(".progress-card");
      if (progress) progress.replaceWith(renderPackingProgress());
    }

    function renderSettings() {
      const wrapper = document.createElement("div");
      wrapper.innerHTML = `
        <section class="settings-section"><h2 class="settings-heading">🎨 Tema</h2><div class="theme-options"><button class="pill-button" data-theme="light">☀️ Chiaro</button><button class="pill-button" data-theme="dark">🌙 Scuro</button><button class="pill-button" data-theme="auto">🔄 Automatico</button></div></section>
        <section class="settings-section"><h2 class="settings-heading">🖌️ Colore accento</h2><div class="accent-options"><button class="color-swatch" data-accent="torii" style="background:#c94a5a"></button><button class="color-swatch" data-accent="ao" style="background:#3f6ea8"></button><button class="color-swatch" data-accent="matcha" style="background:#4f8a5e"></button><button class="color-swatch" data-accent="sakura" style="background:#d97ea0"></button></div></section>
        <section class="settings-section"><h2 class="settings-heading">💴 Cambio Yen / Euro</h2><label class="rate-box"><span>1 € =</span><input id="exchangeRate" type="number" value="${appState.settings.exchangeRate}" step="0.5"><span>¥</span></label></section>
        <section class="settings-section"><h2 class="settings-heading">💾 Backup e ripristino</h2><button class="settings-button" data-action="export-json">💾 Esporta JSON <span>›</span></button><button class="settings-button" data-action="import-json">📥 Importa JSON <span>›</span></button><button class="settings-button" data-action="export-xlsx">📤 Esporta Excel <span>›</span></button><button class="settings-button" data-action="import-xlsx">📊 Importa Excel <span>›</span></button><input id="jsonInput" type="file" accept="application/json"><input id="xlsxInput" type="file" accept=".xlsx"></section>
      `;

      wrapper.querySelectorAll("[data-theme]").forEach((button) => {
        button.classList.toggle("active", button.dataset.theme === appState.settings.theme);
        button.onclick = () => { appState.settings.theme = button.dataset.theme; saveSettings(); applyTheme(); renderApp(); };
      });

      wrapper.querySelectorAll("[data-accent]").forEach((button) => {
        button.classList.toggle("active", button.dataset.accent === appState.settings.accent);
        button.onclick = () => { appState.settings.accent = button.dataset.accent; saveSettings(); applyTheme(); renderApp(); };
      });

      wrapper.querySelector("#exchangeRate").onchange = (event) => {
        const rate = Number(event.target.value);
        if (rate > 0) { appState.settings.exchangeRate = rate; saveSettings(); showToast("💴 Cambio aggiornato"); }
      };

      wrapper.querySelector('[data-action="export-json"]').onclick = () => {
        downloadFile(JSON.stringify({ data: appState.data, settings: appState.settings }, null, 2), "giappone-backup.json", "application/json");
        showToast("💾 Backup esportato");
      };

      wrapper.querySelector('[data-action="import-json"]').onclick = () => wrapper.querySelector("#jsonInput").click();
      wrapper.querySelector("#jsonInput").onchange = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const payload = JSON.parse(reader.result);
          if (payload.data) appState.data = payload.data;
          if (payload.settings) appState.settings = payload.settings;
          saveData();
          saveSettings();
          applyTheme();
          renderApp();
          showToast("✅ Backup importato");
        };
        reader.readAsText(file);
      };

      wrapper.querySelector('[data-action="export-xlsx"]').onclick = () => {
        if (!window.XLSX) return alert("Libreria Excel non disponibile.");
        const workbook = XLSX.utils.book_new();
        SHEETS.forEach((key) => {
          const sheet = appState.data[key];
          const values = [sheet.headers, ...sheet.rows.map((row) => sheet.headers.map((header) => row[header] || ""))];
          XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet(values), key.slice(0, 31));
        });
        XLSX.writeFile(workbook, "Giappone_Backup.xlsx");
        showToast("📤 Excel esportato");
      };

      wrapper.querySelector('[data-action="import-xlsx"]').onclick = () => wrapper.querySelector("#xlsxInput").click();
      wrapper.querySelector("#xlsxInput").onchange = (event) => {
        const file = event.target.files?.[0];
        if (!file || !window.XLSX) return;
        const reader = new FileReader();
        reader.onload = () => {
          const workbook = XLSX.read(new Uint8Array(reader.result), { type: "array", cellDates: false });
          SHEETS.forEach((key) => {
            const name = workbook.SheetNames.find((item) => item.trim() === key.trim());
            if (!name) return;
            const values = XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1, defval: "", raw: false });
            if (!values.length) return;
            const headers = values[0].map((header) => String(header).trim());
            const rows = values.slice(1).filter((row) => row.some(Boolean)).map((row) => {
              const result = {};
              headers.forEach((header, index) => { result[header] = String(row[index] ?? ""); });
              return result;
            });
            appState.data[key] = { headers, rows };
          });
          saveData();
          appState.view = "1. Itinerario";
          renderApp();
          showToast("✅ Excel importato");
        };
        reader.readAsArrayBuffer(file);
      };

      return wrapper;
    }

    /* ================================================================
       10. Avvio
       ================================================================ */

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }

    window.addEventListener("scroll", () => {
      document.getElementById("topbar").classList.toggle("scrolled", window.scrollY > 30);
    }, { passive: true });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (appState.settings.theme === "auto") applyTheme();
    });

    applyTheme();
    renderBackground();
    renderTabs();
    renderApp();
  </script>
</body>
</html>
