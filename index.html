<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >
  <meta name="apple-mobile-web-app-title" content="Giappone">
  <title>Giappone 2026/27</title>
  <link rel="manifest" href="manifest.json">
  <script
    src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
  ></script>

  <style>
    /* ================================================================
       1. Tema
       ================================================================ */

    :root {
      --bg: #f3f1ec;
      --surface: rgba(255, 255, 255, 0.95);
      --surface-solid: #ffffff;
      --surface-soft: rgba(250, 248, 244, 0.96);
      --text: #1c1a18;
      --muted: #77716a;
      --border: rgba(222, 216, 205, 0.95);
      --accent: #c94a5a;
      --accent-soft: #fae9eb;
      --gold: #c9a24a;
      --header: rgba(243, 241, 236, 0.96);
      --nav: rgba(255, 255, 255, 0.98);
      --shadow: 0 2px 12px rgba(28, 20, 10, 0.10);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html[data-theme="dark"] {
      --bg: #111318;
      --surface: rgba(27, 30, 38, 0.97);
      --surface-solid: #1b1e26;
      --surface-soft: rgba(34, 37, 46, 0.98);
      --text: #f2f0ec;
      --muted: #96939a;
      --border: rgba(55, 58, 68, 0.96);
      --accent-soft: #35232a;
      --header: rgba(17, 19, 24, 0.98);
      --nav: rgba(17, 19, 24, 0.99);
      --shadow: 0 2px 14px rgba(0, 0, 0, 0.42);
    }

    html[data-accent="ao"] { --accent: #3f6ea8; --accent-soft: #e8eef8; }
    html[data-accent="torii"] { --accent: #c94a5a; --accent-soft: #fae9eb; }
    html[data-accent="matcha"] { --accent: #4f8a5e; --accent-soft: #e8f2e9; }
    html[data-accent="sakura"] { --accent: #d97ea0; --accent-soft: #f9e9f0; }

    html[data-theme="dark"][data-accent="ao"] { --accent-soft: #1a293b; }
    html[data-theme="dark"][data-accent="matcha"] { --accent-soft: #192d1e; }
    html[data-theme="dark"][data-accent="sakura"] { --accent-soft: #30212a; }

    .city-osaka { --city: #e08a3c; }
    .city-kyoto { --city: #4f8a5e; }
    .city-tokyo { --city: #2c4a6e; }
    .city-takayama { --city: #b5623f; }
    .city-hiroshima { --city: #7a6bb0; }
    .city-kamakura { --city: #3f9b9b; }
    .city-kawaguchiko { --city: #4f8fc9; }
    .city-default { --city: var(--accent); }

    /* ================================================================
       2. Stati valigia
       ================================================================ */

    .state-ready {
      --state-color: #2ea86b;
      --state-bg: #dff5e9;
      --state-text: #197342;
    }

    .state-buy {
      --state-color: #e08a3c;
      --state-bg: #fff0dc;
      --state-text: #a95b18;
    }

    .state-preparing {
      --state-color: #8b8f99;
      --state-bg: #e9eaee;
      --state-text: #5e626d;
    }

    .state-booked {
      --state-color: #3f6ea8;
      --state-bg: #e1ecfb;
      --state-text: #285b91;
    }

    html[data-theme="dark"] .state-ready {
      --state-bg: #173b29;
      --state-text: #8ce0ae;
    }

    html[data-theme="dark"] .state-buy {
      --state-bg: #4a2d16;
      --state-text: #ffc078;
    }

    html[data-theme="dark"] .state-preparing {
      --state-bg: #30333c;
      --state-text: #c0c4ce;
    }

    html[data-theme="dark"] .state-booked {
      --state-bg: #1d3552;
      --state-text: #9bc4f5;
    }

    /* ================================================================
       3. Reset e struttura
       ================================================================ */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
      overscroll-behavior-y: none;
      -webkit-text-size-adjust: 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    select {
      cursor: pointer;
    }

    a {
      color: var(--accent);
    }

    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      isolation: isolate;
    }

    #main {
      position: relative;
      z-index: 2;
      flex: 1;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 12px 16px calc(148px + var(--safe-bottom));
    }

    .view-fade {
      animation: viewFade 0.25s ease;
    }

    @keyframes viewFade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================================================================
       4. Sfondo non interattivo
       ================================================================ */

    #backgroundLayer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none !important;
      background:
        radial-gradient(
          circle at 88% 8%,
          color-mix(in srgb, var(--accent) 13%, transparent),
          transparent 30%
        ),
        radial-gradient(
          circle at 8% 38%,
          color-mix(in srgb, var(--gold) 9%, transparent),
          transparent 27%
        );
    }

    #backgroundPattern {
      width: 100%;
      height: 100%;
      opacity: 0.10;
      pointer-events: none !important;
    }

    html[data-theme="dark"] #backgroundPattern {
      opacity: 0.16;
    }

    /* ================================================================
       5. Header
       ================================================================ */

    #topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: max(14px, calc(var(--safe-top) + 10px)) 18px 10px;
      border-bottom: 1px solid transparent;
      background: var(--header);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      transition: 0.25s ease;
    }

    #topbar.scrolled {
      padding-bottom: 6px;
      border-bottom-color: var(--border);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 9px;
      background: var(--accent);
    }

    .logo svg {
      width: 62%;
      height: 62%;
    }

    .page-title {
      flex: 1;
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .page-subtitle {
      max-height: 24px;
      margin-top: 3px;
      padding-left: 40px;
      overflow: hidden;
      color: var(--muted);
      font-size: 13.5px;
      transition: 0.25s ease;
    }

    .topbar.scrolled .page-title {
      font-size: 19px;
    }

    .topbar.scrolled .page-subtitle {
      max-height: 0;
      margin-top: 0;
      opacity: 0;
    }

    .trip-banner {
      margin-top: 10px;
      padding: 11px 15px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-soft), transparent);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    /* ================================================================
       6. Card e liste
       ================================================================ */

    .card,
    .stat-box,
    .progress-card,
    .toolbar input,
    .dropdown select,
    .settings-button,
    .rate-box {
      background: var(--surface);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .card {
      position: relative;
      overflow: hidden;
      margin-bottom: 12px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .card.city-card {
      border-left: 4px solid var(--city, var(--accent));
    }

    .card-top,
    .card-top-left {
      display: flex;
      align-items: center;
    }

    .card-top {
      justify-content: space-between;
      gap: 10px;
    }

    .card-top-left,
    .card-title-wrap {
      min-width: 0;
    }

    .card-title {
      margin: 0;
      font-size: 17.5px;
      font-weight: 800;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .card-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .card-top-left {
      gap: 10px;
    }

    .card .badge {
      flex: 0 0 auto;
      padding: 5px 11px;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 11px;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      padding: 10px 15px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: var(--shadow);
    }

    .action-button.secondary {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: none;
    }

    .empty-state {
      padding: 56px 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 4px 10px;
      font-size: 14px;
      font-weight: 800;
    }

    /* ================================================================
       7. Dashboard, tabbar e pulsante
       ================================================================ */

    .dashboard-card {
      margin-bottom: 14px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .dashboard-kicker {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .dashboard-title {
      margin: 5px 0 0;
      font-size: 25px;
      font-weight: 850;
    }

    .dashboard-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .dashboard-metric {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface-soft);
    }

    .dashboard-metric-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .dashboard-metric-value {
      margin-top: 4px;
      font-size: 16px;
      font-weight: 850;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0 6px;
    }

    .stat-box {
      padding: 15px 8px;
      border: 1px solid var(--border);
      border-radius: 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
    }

    .progress-card {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 14px 0 6px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .progress-ring {
      flex: 0 0 auto;
      transform: rotate(-90deg);
    }

    .progress-ring-background {
      fill: none;
      stroke: var(--border);
      stroke-width: 8;
    }

    .progress-ring-value {
      fill: none;
      stroke: var(--accent);
      stroke-width: 8;
      stroke-linecap: round;
    }

    .progress-ring-label {
      fill: var(--text);
      font-size: 13px;
      font-weight: 800;
    }

    .progress-title {
      font-size: 14px;
      font-weight: 800;
    }

    .progress-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
    }

    #tabbar {
      position: fixed !important;
      right: 14px !important;
      bottom: calc(12px + var(--safe-bottom)) !important;
      left: 14px !important;
      z-index: 9999 !important;
      display: flex !important;
      gap: 6px;
      overflow-x: auto;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 29px;
      background: var(--nav);
      box-shadow: 0 10px 30px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      scrollbar-width: none;
      pointer-events: auto !important;
      transform: translateZ(0);
    }

    #tabbar::-webkit-scrollbar {
      display: none;
    }

    .tab-button {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 76px;
      min-height: 52px;
      padding: 6px 10px;
      border: 0;
      border-radius: 21px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      pointer-events: auto !important;
    }

    .tab-button-icon {
      font-size: 20px;
      line-height: 1;
    }

    .tab-button.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px color-mix(
        in srgb,
        var(--accent) 35%,
        transparent
      );
    }

    .floating-button {
      position: fixed;
      right: 18px;
      bottom: calc(106px + var(--safe-bottom));
      z-index: 9998;
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 18px;
      background: var(--accent);
      color: #fff;
      font-size: 26px;
      box-shadow: 0 8px 20px -4px var(--accent);
    }

    .settings-section { margin-bottom: 26px; }
    .settings-heading { margin: 0 0 6px; color: var(--muted); font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .theme-options, .accent-options { display: flex; flex-wrap: wrap; gap: 10px; }
    .pill-button { padding: 11px 17px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); color: var(--text); font-size: 14px; font-weight: 700; box-shadow: var(--shadow); }
    .pill-button.active { border-color: var(--accent); background: var(--accent); color: #fff; }
    .color-swatch { width: 42px; height: 42px; border: 3px solid transparent; border-radius: 50%; box-shadow: var(--shadow); }
    .color-swatch.active { border-color: var(--text); }
    .settings-button, .rate-box { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px; margin-top: 8px; padding: 15px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); font-size: 15px; font-weight: 700; text-align: left; box-shadow: var(--shadow); }
    .rate-box input { width: 90px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-soft); color: var(--text); font-size: 15px; text-align: right; }
    input[type="file"] { display: none; }
    .modal-overlay { position: fixed; inset: 0; z-index: 100000; display: flex; align-items: flex-end; background: rgba(20,15,10,.5); }
    .modal { width: 100%; max-height: 88vh; overflow-y: auto; padding: 22px 20px calc(26px + var(--safe-bottom)); border-radius: 28px 28px 0 0; background: var(--surface-solid); box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
    .modal-title { margin: 0 0 16px; font-size: 19px; font-weight: 800; }
    .field { margin-bottom: 13px; }
    .field-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; padding: 12px 13px; border: 1px solid var(--border); border-radius: 12px; outline: none; background: var(--surface-soft); color: var(--text); font-size: 16px; }
    .field textarea { min-height: 64px; resize: vertical; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button { flex: 1; padding: 14px; border: 0; border-radius: 16px; font-size: 15px; font-weight: 800; }
    .save-button { background: var(--accent); color: #fff; }
    .cancel-button { border: 1px solid var(--border) !important; background: var(--surface-soft); color: var(--text); }
    .delete-button { background: #c94a5a; color: #fff; }
    .toast { position: fixed; bottom: calc(112px + var(--safe-bottom)); left: 50%; z-index: 100001; max-width: 90vw; padding: 12px 18px; border-radius: 20px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 700; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.3); opacity: 0; transform: translateX(-50%); transition: opacity .3s ease; }
    .toast.visible { opacity: 1; }
  </style>
</head>

<body>
  <div id="app">
    <div id="backgroundLayer" aria-hidden="true">
      <svg id="backgroundPattern" viewBox="0 0 520 520" preserveAspectRatio="xMidYMid slice"></svg>
    </div>

    <header id="topbar">
      <div class="topbar-row">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 9h18M6 9V6c0-1 1-2 2-2h8c1 0 2 1 2 2v3M6 9v11M18 9v11" /></svg>
        </div>
        <h1 id="pageTitle" class="page-title">Itinerario</h1>

    </header>

    <main id="main"></main>
    <button id="addButton" class="floating-button" type="button" hidden>+</button>
    <nav id="tabbar" aria-label="Sezioni app"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script>

    const state = {
      data: JSON.parse(localStorage.getItem(DATA_KEY) || "{}"),
      settings: JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}"),
      view: "1. Itinerario",
      search: "",

    };

    state.settings.theme ||= "auto";
    state.settings.accent ||= "torii";
    state.settings.exchangeRate ||= 160;

    /* ================================================================
       2. Utility
       ================================================================ */

    function saveData() {
      localStorage.setItem(DATA_KEY, JSON.stringify(state.data));
    }

    function saveSettings() {
      localStorage.setItem(
        SETTINGS_KEY,
        JSON.stringify(state.settings)
      );
    }

    function iconFor(field) {
      return FIELD_ICONS[field] || "•";
    }

    function isUrl(value) {
      return /^https?:\/\//i.test(String(value || "").trim());
    }

    function isPhone(value) {
      return /^[\d+\-\s()]{3,}$/.test(String(value || "").trim());
    }

    function applyTheme() {
      let theme = state.settings.theme;

      if (theme === "auto") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.accent = state.settings.accent;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function parseDate(value) {
      const match = String(value || "")
        .match(/^(\d{4})-(\d{2})-(\d{2})/);

      return match
        ? new Date(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3])
        )
        : null;
    }

    function todayString() {
      const date = new Date();
      return `${date.getFullYear()}-${String(
        date.getMonth() + 1
      ).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function shortDate(value) {
      const date = parseDate(value);
      return date
        ? `${WEEKDAYS[date.getDay()]} ${date.getDate()} ${MONTHS[date.getMonth()]}`
        : String(value || "");
    }

    function monthDay(value) {
      const date = parseDate(value);
      return date
        ? `${date.getDate()} ${MONTHS[date.getMonth()]}`
        : String(value || "");
    }

    function cityClass(value) {
      const city = String(value || "")
        .split("/")[0]
        .trim()
        .toLowerCase();

      const classes = {
        osaka: "city-osaka",
        kyoto: "city-kyoto",
        tokyo: "city-tokyo",
        takayama: "city-takayama",
        hiroshima: "city-hiroshima",
        kamakura: "city-kamakura",
        kawaguchiko: "city-kawaguchiko",
        partenza: "city-partenza"
      };

      return classes[city] || "city-default";
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("visible");
      setTimeout(() => toast.classList.remove("visible"), 2300);
    }

    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    /* ================================================================

       ================================================================ */

    function renderBackground() {
      const svg = document.getElementById("backgroundPattern");
      const radius = 46;
      let paths = "";

      for (let row = 0; row < 11; row += 1) {
        for (let column = 0; column < 14; column += 1) {
          const offset = row % 2 ? radius * 0.52 : 0;
          const x = column * radius * 1.05 + offset;
          const y = row * radius * 0.55;

          paths += `
            <path
              d="M${x - radius} ${y}
                 a${radius} ${radius} 0 0 1 ${radius * 2} 0"
              fill="none"
              stroke="var(--accent)"
              stroke-width="1.6"
            />
          `;
        }
      }

      svg.innerHTML = paths;
    }

    function renderTabs() {
      const tabbar = document.getElementById("tabbar");
      tabbar.innerHTML = "";

      TABS.forEach((key) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.dataset.tab = key;

        const icon = key === "mappa"
          ? "🗺️📍"
          : key === "settings"
            ? "⚙️"
            : ICONS[key];

        const label = key === "mappa"
          ? "Mappa"
          : key === "settings"
            ? "Impostazioni"
            : META[key].label;

        button.innerHTML = `
          <span class="tab-button-icon">${icon}</span>
          ${label}
        `;

        button.onclick = () => {
          state.view = key;
          state.search = "";
          state.city = "";
          state.sort = "default";
          renderApp();
        };

        tabbar.appendChild(button);
      });
    }

    function renderBanner() {
      const banner = document.getElementById("tripBanner");
      const rows = state.data["1. Itinerario"]?.rows || [];

      if (!rows.length) {
        banner.hidden = true;
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const first = parseDate(rows[0].Data);
      const last = parseDate(rows[rows.length - 1].Data);

      if (!first || !last) {
        banner.hidden = true;
        return;
      }

      banner.hidden = false;

      if (today < first) {
        banner.textContent = `🛫 Mancano ${Math.ceil(
          (first - today) / 86400000
        )} giorni alla partenza`;
      } else if (today <= last) {
        const index = Math.max(
          rows.findIndex((row) => row.Data === todayString()) + 1,
          1
        );
        banner.textContent = `📍 Sei in viaggio · Giorno ${index} di ${rows.length}`;
      } else {
        banner.textContent = "✅ Viaggio concluso · che ricordi! 🎌";
      }
    }

    /* ================================================================
       4. Mappa avanzata
       ================================================================ */

    function collectMapItems() {
      const items = [];

      SHEETS.forEach((key) => {
        const meta = META[key];
        if (!meta.maps) return;

        (state.data[key]?.rows || []).forEach((row) => {
          const mainTitle = String(
            row[meta.title] || row[meta.fallback] || ""
          ).trim();

          if (!mainTitle) return;

          meta.maps.forEach((map) => {
            if (!isUrl(row[map.field])) return;

            const category = key === "6. Attrazioni"
              ? "Attrazioni"
              : key === "8. Cibo e Ristoranti"
                ? "Cibo"
                : key === "9. Shopping"
                  ? "Shopping"
                  : key === "2. Hotel e Alloggi"
                    ? "Alloggi"
                    : "Trasporti";

            const neighborhood = String(
              row["Quartiere"] || row["Città"] || "Senza zona"
            ).trim();

            items.push({
              key,
              title: mainTitle,
              subtitle: (meta.sub || [])
                .map((field) => row[field])
                .filter(Boolean)
                .join(" · "),
              city: row[meta.city] || row["Città"] || "",
              neighborhood,
              category,
              url: row[map.field]
            });
          });
        });
      });

      return items;
    }

    function renderMap() {
      const wrapper = document.createElement("div");
      const items = collectMapItems();
      const cities = [
        "",
        ...new Set(items.map((item) => item.city).filter(Boolean))
      ];
      const categories = [
        "",
        ...new Set(items.map((item) => item.category))
      ];

      wrapper.innerHTML = `
        <section class="map-hero">
          <div class="map-hero-kicker">📍 Travel map</div>
          <h2 class="map-hero-title">Mappa del viaggio</h2>
          <div class="map-hero-subtitle">

          </div>
          <div class="map-counters" id="mapCounters"></div>
          <div class="map-mode-row">
            <button class="map-mode-button active" data-map-mode="list">
              📋 Elenco
            </button>
            <button class="map-mode-button" data-map-mode="zones">
              🧭 Zone
            </button>
          </div>
          <div class="map-search-row">
            <input
              id="mapSearch"
              type="search"
              placeholder="🔎 Cerca luogo o quartiere..."
            >

              🌐 Maps

          <div class="map-filter-title">Categoria</div>
          <div class="map-filter-row" id="mapCategories"></div>
        </section>
        <section id="mapResults"></section>
      `;

      const filterState = {
        city: "",
        category: "",
        query: "",
        mode: "list"
      };

      const results = wrapper.querySelector("#mapResults");

      function filteredItems() {
        const query = filterState.query.toLowerCase().trim();

        return items.filter((item) => {
          const searchable = [
            item.title,
            item.subtitle,
            item.city,
            item.neighborhood,
            item.category
          ].join(" ").toLowerCase();

          return (!filterState.city || item.city === filterState.city) &&
            (!filterState.category || item.category === filterState.category) &&
            (!query || searchable.includes(query));
        });
      }

      function updateCounters(list) {
        const attractions = list.filter((item) => {
          return item.category === "Attrazioni";
        }).length;
        const food = list.filter((item) => {
          return item.category === "Cibo";
        }).length;
        const shopping = list.filter((item) => {
          return item.category === "Shopping";
        }).length;

        wrapper.querySelector("#mapCounters").innerHTML = `
          <div class="map-counter">
            <div class="map-counter-value">${list.length}</div>
            <div class="map-counter-label">Luoghi</div>
          </div>
          <div class="map-counter">
            <div class="map-counter-value">${attractions}</div>
            <div class="map-counter-label">Attrazioni</div>
          </div>
          <div class="map-counter">
            <div class="map-counter-value">${food + shopping}</div>
            <div class="map-counter-label">Cibo/Shopping</div>
          </div>
        `;
      }

      function renderFilters() {
        const cityBox = wrapper.querySelector("#mapCities");
        const categoryBox = wrapper.querySelector("#mapCategories");
        cityBox.innerHTML = "";
        categoryBox.innerHTML = "";

        cities.forEach((city) => {
          const button = document.createElement("button");
          button.className = `map-filter-chip${
            filterState.city === city ? " active" : ""
          }`;
          button.type = "button";
          button.textContent = city || "🌆 Tutte";
          button.onclick = () => {
            filterState.city = city;
            renderFilters();
            renderResults();
          };
          cityBox.appendChild(button);
        });

        categories.forEach((category) => {
          const button = document.createElement("button");
          button.className = `map-filter-chip${
            filterState.category === category ? " active" : ""
          }`;
          button.type = "button";
          button.textContent = category || "✨ Tutte";
          button.onclick = () => {
            filterState.category = category;
            renderFilters();
            renderResults();
          };
          categoryBox.appendChild(button);
        });
      }

      function renderResults() {
        const list = filteredItems();
        updateCounters(list);
        results.innerHTML = "";

        if (!list.length) {
          results.innerHTML = `
            <div class="empty-state">
              🔍 Nessun luogo corrisponde ai filtri selezionati.
            </div>
          `;
          return;
        }

        if (filterState.mode === "zones") {
          const groups = {};

          list.forEach((item) => {
            const zone = item.neighborhood || "Senza zona";
            if (!groups[zone]) groups[zone] = [];
            groups[zone].push(item);
          });

          Object.entries(groups).forEach(([zone, zoneItems]) => {
            const heading = document.createElement("div");
            heading.className = "group-title";
            heading.textContent = `🧭 ${zone}`;
            results.appendChild(heading);

            zoneItems.forEach((item) => {
              results.appendChild(renderMapCard(item));
            });
          });
        } else {
          list.forEach((item) => {
            results.appendChild(renderMapCard(item));
          });
        }
      }

      function renderMapCard(item) {
        const card = document.createElement("article");
        card.className = `card city-card ${cityClass(item.city)}`;
        card.innerHTML = `
          <div class="card-top">
            <div class="card-title-wrap">
              <h3 class="card-title">
                ${escapeHtml(item.title)}
              </h3>
              <div class="card-subtitle">
                ${escapeHtml(item.city || "")}
                ${item.subtitle ? ` · ${escapeHtml(item.subtitle)}` : ""}
              </div>
            </div>
            <span class="badge">${escapeHtml(item.category)}</span>
          </div>
          <div class="button-row">
            <a
              class="action-button"
              href="${item.url}"
              target="_blank"
              rel="noopener"
            >📍 Apri in Maps</a>
            <button class="action-button secondary" data-share>
              📤 Condividi
            </button>
          </div>
        `;

        card.querySelector("[data-share]").onclick = (event) => {
          event.stopPropagation();
          shareText(
            item.title,
            `${item.title} · ${item.city} · ${item.category}\n${item.url}`
          );
        };

        return card;
      }

      wrapper.querySelector("#mapSearch").oninput = (event) => {
        filterState.query = event.target.value;
        renderResults();
      };

      wrapper.querySelector("#mapOpenSearch").onclick = () => {
        const queryParts = [
          filterState.category,
          filterState.city,
          filterState.query,
          "Giappone"
        ].filter(Boolean);

        const query = encodeURIComponent(queryParts.join(" "));
        window.open(
          `https://www.google.com/maps/search/?api=1&query=${query}`,
          "_blank"
        );
      };

      wrapper.querySelectorAll("[data-map-mode]").forEach((button) => {
        button.onclick = () => {
          filterState.mode = button.dataset.mapMode;
          wrapper.querySelectorAll("[data-map-mode]").forEach((item) => {
            item.classList.toggle(
              "active",
              item.dataset.mapMode === filterState.mode
            );
          });
          renderResults();
        };
      });

      renderFilters();
      renderResults();
      return wrapper;
    }

    function addCalendar(row) {
      const date = parseDate(row.Data);
      if (!date) {
        showToast("Data non valida");
        return;
      }

      const start = row.Data.replace(/-/g, "");
      const next = new Date(date.getTime() + 86400000);
      const end = `${next.getFullYear()}${String(
        next.getMonth() + 1
      ).padStart(2, "0")}${String(next.getDate()).padStart(2, "0")}`;

      const content = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "BEGIN:VEVENT",
        `UID:giappone-${start}@local`,
        `DTSTART;VALUE=DATE:${start}`,
        `DTEND;VALUE=DATE:${end}`,
        `SUMMARY:${row.Città}: ${row["Attività Principali"]}`,
        `DESCRIPTION:${row.Spostamento || ""}`,
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");

      downloadFile(
        content,
        `giorno-${row.Data}.ics`,
        "text/calendar;charset=utf-8"
      );
      showToast("📅 File calendario creato");
    }

    function shareText(title, text) {
      if (navigator.share) {
        navigator.share({ title, text }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard
          .writeText(text)
          .then(() => showToast("📋 Copiato"));
      } else {
        showToast("Condivisione non supportata");
      }
    }

    function openEditModal(key, index) {
      const sheet = state.data[key];
      const row = index === null ? {} : sheet.rows[index];
      const meta = META[key];
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.onclick = (event) => {
        if (event.target === overlay) closeModal();
      };

      const modal = document.createElement("div");
      modal.className = "modal";
      modal.innerHTML = `
        <h2 class="modal-title">
          ${index === null ? "➕ Nuovo" : "✎ Modifica"}
          · ${ICONS[key]} ${meta.label}
        </h2>
        ${sheet.headers.map((field) => renderField(
          field,
          row[field],
          meta
        )).join("")}
        <div class="modal-actions">
          <button class="cancel-button" data-cancel>
            Annulla
          </button>
          <button class="save-button" data-save>
            Salva
          </button>
        </div>
        ${index === null
          ? ""
          : `<div class="modal-actions">
               <button class="delete-button" data-delete>
                 🗑️ Elimina
               </button>
             </div>`}
      `;

      overlay.appendChild(modal);
      document.getElementById("modalRoot").appendChild(overlay);
      modal.querySelector("[data-cancel]").onclick = closeModal;

      modal.querySelector("[data-save]").onclick = () => {
        const updated = {};
        modal.querySelectorAll("[data-field]").forEach((field) => {
          updated[field.dataset.field] = field.value;
        });

        if (index === null) sheet.rows.push(updated);
        else sheet.rows[index] = updated;

        saveData();
        closeModal();
        renderApp();
        showToast("✅ Salvato");
      };

      const remove = modal.querySelector("[data-delete]");
      if (remove) {
        remove.onclick = () => {
          sheet.rows.splice(index, 1);
          saveData();
          closeModal();
          renderApp();
          showToast("🗑️ Eliminato");
        };
      }
    }

    function renderField(field, value, meta) {
      const current = value || "";
      const label = `${iconFor(field)} ${field}`;

      if (meta.status === field) {
        return `
          <div class="field">
            <label class="field-label">
              ${escapeHtml(label)}
            </label>
            <select data-field="${escapeHtml(field)}">
              ${STATUSES.map((option) => `
                <option
                  value="${option}"
                  ${option === current ? "selected" : ""}
                >${option}</option>
              `).join("")}
            </select>
          </div>
        `;
      }

      if (field === "Urgenza" || field === "Urgenza Configurazione") {
        return `
          <div class="field">
            <label class="field-label">
              ${escapeHtml(label)}
            </label>
            <select data-field="${escapeHtml(field)}">
              <option>Alta</option>
              <option>Media</option>
              <option>Bassa</option>
            </select>
          </div>
        `;
      }

      const type = /^data$/i.test(field)
        ? "date"
        : /link|maps/i.test(field)
          ? "url"
          : "text";

      const isLong = /note|dettagli|articolo mirato|attività/i.test(field);

      if (isLong) {
        return `
          <div class="field">
            <label class="field-label">
              ${escapeHtml(label)}
            </label>
            <textarea data-field="${escapeHtml(field)}">${escapeHtml(current)}</textarea>
          </div>
        `;
      }

      return `
        <div class="field">
          <label class="field-label">
            ${escapeHtml(label)}
          </label>
          <input
            type="${type}"
            data-field="${escapeHtml(field)}"
            value="${escapeHtml(current)}"
            ${type === "url"
              ? "placeholder=\"https://maps.app.goo.gl/...\""
              : ""}
          >
        </div>
      `;
    }

            <span>1 € =</span>
            <input id="exchangeRate" type="number" value="${state.settings.exchangeRate}" step="0.5">
            <span>¥</span>
          </label>
        </section>
        <section class="settings-section">
          <h2 class="settings-heading">💾 Backup</h2>
          <button class="settings-button" data-action="export-json">💾 Esporta JSON <span>›</span></button>
          <button class="settings-button" data-action="import-json">📥 Importa JSON <span>›</span></button>
          <button class="settings-button" data-action="export-xlsx">📤 Esporta Excel <span>›</span></button>
          <button class="settings-button" data-action="import-xlsx">📊 Importa Excel <span>›</span></button>
          <input id="jsonInput" type="file" accept="application/json">
          <input id="xlsxInput" type="file" accept=".xlsx">
        </section>
      `;

      wrapper.querySelectorAll("[data-theme]").forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.theme === state.settings.theme
        );
        button.onclick = () => {
          state.settings.theme = button.dataset.theme;
          saveSettings();
          applyTheme();
          renderApp();
        };
      });

      wrapper.querySelectorAll("[data-accent]").forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.accent === state.settings.accent
        );
        button.onclick = () => {
          state.settings.accent = button.dataset.accent;
          saveSettings();
          applyTheme();
          renderApp();
        };
      });

      wrapper.querySelector("#exchangeRate").onchange = (event) => {
        const value = Number(event.target.value);
        if (value > 0) {
          state.settings.exchangeRate = value;
          saveSettings();
          showToast("💴 Cambio aggiornato");
        }
      };

      wrapper.querySelector('[data-action="export-json"]').onclick = () => {
        downloadFile(
          JSON.stringify({ data: state.data, settings: state.settings }, null, 2),
          "giappone-backup.json",
          "application/json"
        );
        showToast("💾 Backup esportato");
      };

      wrapper.querySelector('[data-action="import-json"]').onclick = () => {
        wrapper.querySelector("#jsonInput").click();
      };

      wrapper.querySelector("#jsonInput").onchange = importJson;
      wrapper.querySelector('[data-action="export-xlsx"]').onclick = exportXlsx;
      wrapper.querySelector('[data-action="import-xlsx"]').onclick = () => {
        wrapper.querySelector("#xlsxInput").click();
      };
      wrapper.querySelector("#xlsxInput").onchange = importXlsx;

      return wrapper;
    }

    function importJson(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const payload = JSON.parse(reader.result);
          if (payload.data) state.data = payload.data;
          if (payload.settings) state.settings = payload.settings;
          saveData();
          saveSettings();
          applyTheme();
          renderApp();
          showToast("✅ Backup importato");
        } catch (error) {
          alert(`Backup non valido: ${error.message}`);
        }
      };
      reader.readAsText(file);
    }

    function exportXlsx() {
      if (!window.XLSX) {
        alert("Libreria Excel non disponibile.");
        return;
      }

      const workbook = XLSX.utils.book_new();

      SHEETS.forEach((key) => {
        const sheet = state.data[key];
        if (!sheet) return;
        const values = [
          sheet.headers,
          ...sheet.rows.map((row) => {
            return sheet.headers.map((header) => row[header] || "");
          })
        ];

        XLSX.utils.book_append_sheet(
          workbook,
          XLSX.utils.aoa_to_sheet(values),
          key.slice(0, 31)
        );
      });

      XLSX.writeFile(workbook, "Giappone_Backup.xlsx");
      showToast("📤 Excel esportato");
    }

    function importXlsx(event) {
      const file = event.target.files?.[0];
      if (!file || !window.XLSX) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const workbook = XLSX.read(
            new Uint8Array(reader.result),
            { type: "array", cellDates: false }
          );

          const imported = {};
          const missing = [];
          let total = 0;

          SHEETS.forEach((key) => {
            const name = workbook.SheetNames.find((item) => {
              return item.trim() === key.trim();
            }) || workbook.SheetNames.find((item) => {
              return item.replace(/^\d+\.\s*/, "").trim() ===
                key.replace(/^\d+\.\s*/, "").trim();
            });

            if (!name) {
              missing.push(key);
              return;
            }

            const values = XLSX.utils.sheet_to_json(
              workbook.Sheets[name],
              { header: 1, defval: "", raw: false }
            );

            if (!values.length) {
              missing.push(key);
              return;
            }

            const headers = values[0].map((header) => {
              return String(header).trim();
            });

            const rows = values.slice(1)
              .filter((row) => {
                return row.some((value) => {
                  return value !== "" &&
                    value !== null &&
                    value !== undefined;
                });
              })
              .map((row) => {
                const result = {};
                headers.forEach((header, index) => {
                  result[header] = String(row[index] ?? "");
                });
                return result;
              });

            imported[key] = { headers, rows };
            total += rows.length;
          });

          if (missing.length) {
            alert(
              "Importazione annullata per sicurezza. " +
              "Fogli mancanti o vuoti:\n\n" +
              missing.join("\n")
            );
            return;
          }

          state.data = imported;
          saveData();
          state.view = "1. Itinerario";
          renderApp();
          showToast(`✅ Importati ${total} elementi`);
        } catch (error) {
          alert(`Errore Excel: ${error.message}`);
        }
      };

      reader.readAsArrayBuffer(file);
    }

    /* ================================================================
       8. Avvio
       ================================================================ */

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("sw.js")
          .catch(() => {});
      });
    }

    window.addEventListener("scroll", () => {
      document.getElementById("topbar").classList.toggle(
        "scrolled",
        window.scrollY > 30
      );
    }, { passive: true });

    matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", () => {
        if (state.settings.theme === "auto") applyTheme();
      });

    applyTheme();
    renderBackground();
    renderTabs();
    renderApp();
  </script>
</body>
</html>
