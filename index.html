<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Giappone">
  <title>Giappone 2026/27</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    /* ================================================================
       1. Tema nero
       ================================================================ */

    :root {
      --bg: #090a0d;
      --surface: #12151b;
      --surface-solid: #12151b;
      --surface-soft: #1d2028;
      --text: #f7f7f5;
      --muted: #9498a3;
      --muted-strong: #c5c8cf;
      --border: #2a2e38;
      --accent: #d14e62;
      --accent-dark: #a93649;
      --accent-soft: #321a21;
      --gold: #c9a24a;
      --header: #090a0d;
      --nav: #101217;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html[data-accent="ao"] {
      --accent: #4f83c2;
      --accent-dark: #37689e;
      --accent-soft: #172b45;
    }

    html[data-accent="matcha"] {
      --accent: #5aa66b;
      --accent-dark: #428351;
      --accent-soft: #17301e;
    }

    html[data-accent="sakura"] {
      --accent: #de86a5;
      --accent-dark: #b65f7e;
      --accent-soft: #351d28;
    }

    .city-osaka { --city: #e28a3d; }
    .city-kyoto { --city: #55a466; }
    .city-tokyo { --city: #5489c5; }
    .city-takayama { --city: #c5704b; }
    .city-hiroshima { --city: #8e7bd0; }
    .city-kamakura { --city: #48aaa8; }
    .city-kawaguchiko { --city: #62a4db; }
    .city-default { --city: var(--accent); }

    .state-ready { --state-color: #36c477; --state-bg: #143824; --state-text: #9af0bc; }
    .state-buy { --state-color: #e99a45; --state-bg: #3a2614; --state-text: #ffd08e; }
    .state-preparing { --state-color: #8d939e; --state-bg: #282c34; --state-text: #d1d4db; }
    .state-booked { --state-color: #5b96d9; --state-bg: #172c48; --state-text: #abd0ff; }

    /* ================================================================
       2. Reset e layout
       ================================================================ */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
      overscroll-behavior-y: none;
      -webkit-text-size-adjust: 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    select {
      cursor: pointer;
    }

    a {
      color: var(--accent);
    }

    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      isolation: isolate;
    }

    #main {
      position: relative;
      z-index: 2;
      flex: 1;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 12px 16px calc(148px + var(--safe-bottom));
    }

    .view-fade {
      animation: viewFade 0.22s ease;
    }

    @keyframes viewFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================================================================
       3. Sfondo
       ================================================================ */

    #backgroundLayer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none !important;
      background: var(--bg);
    }

    #backgroundPattern {
      width: 100%;
      height: 100%;
      opacity: 0.025;
      pointer-events: none !important;
    }

    /* ================================================================
       4. Header
       ================================================================ */

    #topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: max(14px, calc(var(--safe-top) + 10px)) 18px 10px;
      border-bottom: 1px solid transparent;
      background: var(--header);
      transition: padding 0.22s ease, border-color 0.22s ease;
    }

    #topbar.scrolled {
      padding-bottom: 6px;
      border-bottom-color: var(--border);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 9px;
      background: var(--accent);
    }

    .logo svg {
      width: 62%;
      height: 62%;
    }

    .page-title {
      flex: 1;
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .page-subtitle {
      max-height: 24px;
      margin-top: 3px;
      padding-left: 40px;
      overflow: hidden;
      color: var(--muted);
      font-size: 13.5px;
      transition: opacity 0.22s ease, max-height 0.22s ease;
    }

    .topbar.scrolled .page-title {
      font-size: 19px;
    }

    .topbar.scrolled .page-subtitle {
      max-height: 0;
      margin-top: 0;
      opacity: 0;
    }

    .trip-banner {
      margin-top: 10px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    /* ================================================================
       5. Dashboard e card
       ================================================================ */

    .dashboard-card,
    .card,
    .stat-box,
    .progress-card,
    .toolbar input,
    .dropdown select,
    .settings-button,
    .rate-box {
      background: var(--surface);
    }

    .dashboard-card {
      margin-bottom: 12px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .dashboard-kicker { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .dashboard-title { margin: 4px 0 0; font-size: 22px; font-weight: 850; }
    .dashboard-subtitle { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 13px; }
    .dashboard-metric { padding: 11px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface-soft); }
    .dashboard-metric-label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .dashboard-metric-value { margin-top: 3px; font-size: 14px; font-weight: 850; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 5px; }
    .stat-box { padding: 12px 6px; border: 1px solid var(--border); border-radius: 16px; text-align: center; box-shadow: var(--shadow); }
    .stat-label { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .stat-value { margin-top: 4px; font-size: 15px; font-weight: 800; line-height: 1.2; }
    .progress-card { display: flex; align-items: center; gap: 14px; margin: 12px 0 5px; padding: 14px; border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
    .progress-ring { flex: 0 0 auto; transform: rotate(-90deg); }
    .progress-ring-background { fill: none; stroke: var(--border); stroke-width: 8; }
    .progress-ring-value { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; }
    .progress-ring-label { fill: var(--text); font-size: 13px; font-weight: 800; }
    .progress-title { font-size: 13px; font-weight: 800; }
    .progress-subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 600; }

    .filter-row { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0 8px; padding: 1px 1px 4px; scrollbar-width: none; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip { flex: 0 0 auto; padding: 7px 11px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); color: var(--muted-strong); font-size: 12px; font-weight: 750; }
    .filter-chip.active { border-color: var(--accent); background: var(--accent); color: #fff; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 11px 0 9px; }
    .toolbar input[type="search"] { flex: 1 1 140px; min-width: 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; outline: none; color: var(--text); font-size: 13px; }
    .dropdown select { max-width: 145px; padding: 10px 26px 10px 11px; border: 1px solid var(--border); border-radius: 10px; outline: none; color: var(--text); font-size: 12px; font-weight: 700; }

    .card { position: relative; overflow: hidden; margin-bottom: 9px; padding: 14px 15px; border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); cursor: pointer; }
    .card.city-card { border-left: 3px solid var(--city, var(--accent)); }
    .card-top, .card-top-left { display: flex; align-items: center; }
    .card-top { justify-content: space-between; gap: 8px; }
    .card-top-left, .card-title-wrap { min-width: 0; }
    .card-top-left { gap: 8px; }
    .card-title { margin: 0; font-size: 16px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
    .card-subtitle { margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .card .badge { flex: 0 0 auto; padding: 4px 8px; border-radius: 15px; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 800; white-space: nowrap; }
    .button-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .action-button { display: inline-flex; align-items: center; gap: 5px; padding: 8px 11px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11.5px; font-weight: 700; text-decoration: none; }
    .action-button.secondary { background: var(--accent-soft); color: var(--accent); }
    .empty-state { padding: 45px 20px; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; }
    .group-title { display: flex; align-items: center; gap: 7px; margin: 17px 4px 8px; font-size: 13px; font-weight: 800; }

    /* ================================================================
       6. Navigazione e modali
       ================================================================ */

    #tabbar { position: fixed !important; right: 10px !important; bottom: calc(9px + var(--safe-bottom)) !important; left: 10px !important; z-index: 9999 !important; display: flex !important; gap: 4px; overflow-x: auto; padding: 5px; border: 1px solid var(--border); border-radius: 22px; background: var(--nav); box-shadow: 0 7px 20px rgba(0,0,0,.30); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); scrollbar-width: none; pointer-events: auto !important; transform: translateZ(0); }
    #tabbar::-webkit-scrollbar { display: none; }
    .tab-button { display: flex; flex: 0 0 auto; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 65px; min-height: 44px; padding: 4px 7px; border: 0; border-radius: 16px; background: transparent; color: var(--muted); font-size: 9px; font-weight: 750; pointer-events: auto !important; }
    .tab-button-icon { font-size: 17px; line-height: 1; }
    .tab-button.active { background: var(--accent); color: #fff; }
    .floating-button { position: fixed; right: 16px; bottom: calc(94px + var(--safe-bottom)); z-index: 9998; width: 48px; height: 48px; border: 0; border-radius: 15px; background: var(--accent); color: #fff; font-size: 23px; box-shadow: 0 6px 16px var(--accent-dark); }

    .settings-section { margin-bottom: 24px; }
    .settings-heading { margin: 0 0 6px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .theme-options, .accent-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill-button { padding: 9px 13px; border: 1px solid var(--border); border-radius: 17px; background: var(--surface); color: var(--text); font-size: 12px; font-weight: 700; }
    .pill-button.active { border-color: var(--accent); background: var(--accent); color: #fff; }
    .color-swatch { width: 38px; height: 38px; border: 3px solid transparent; border-radius: 50%; }
    .color-swatch.active { border-color: var(--text); }
    .settings-button, .rate-box { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px; margin-top: 7px; padding: 12px 13px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font-size: 13px; font-weight: 700; text-align: left; }
    .rate-box input { width: 80px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-soft); color: var(--text); font-size: 13px; text-align: right; }
    input[type="file"] { display: none; }
    .modal-overlay { position: fixed; inset: 0; z-index: 100000; display: flex; align-items: flex-end; background: rgba(0,0,0,.55); }
    .modal { width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px 18px calc(24px + var(--safe-bottom)); border-radius: 24px 24px 0 0; background: var(--surface-solid); }
    .modal-title { margin: 0 0 14px; font-size: 18px; font-weight: 800; }
    .field { margin-bottom: 11px; }
    .field-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--border); border-radius: 10px; outline: none; background: var(--surface-soft); color: var(--text); font-size: 15px; }
    .field textarea { min-height: 58px; resize: vertical; }
    .modal-actions { display: flex; gap: 8px; margin-top: 15px; }
    .modal-actions button { flex: 1; padding: 12px; border: 0; border-radius: 13px; font-size: 14px; font-weight: 800; }
    .save-button { background: var(--accent); color: #fff; }
    .cancel-button { border: 1px solid var(--border) !important; background: var(--surface-soft); color: var(--text); }
    .delete-button { background: #c94a5a; color: #fff; }
    .toast { position: fixed; bottom: calc(100px + var(--safe-bottom)); left: 50%; z-index: 100001; max-width: 90vw; padding: 10px 15px; border-radius: 17px; background: var(--text); color: var(--bg); font-size: 12.5px; font-weight: 700; text-align: center; opacity: 0; transform: translateX(-50%); transition: opacity .25s ease; }
    .toast.visible { opacity: 1; }
  </style>
</head>

<body>
  <div id="app">
    <div id="backgroundLayer" aria-hidden="true">
      <svg id="backgroundPattern" viewBox="0 0 520 520" preserveAspectRatio="xMidYMid slice"></svg>
    </div>

    <header id="topbar">
      <div class="topbar-row">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 9h18M6 9V6c0-1 1-2 2-2h8c1 0 2 1 2 2v3M6 9v11M18 9v11" /></svg>
        </div>
        <h1 id="pageTitle" class="page-title">Itinerario</h1>
      </div>
      <div id="pageSubtitle" class="page-subtitle"></div>
      <div id="tripBanner" class="trip-banner" hidden></div>
    </header>

    <main id="main"></main>
    <button id="addButton" class="floating-button" type="button" hidden>+</button>
    <nav id="tabbar" aria-label="Sezioni app"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script>
    /* ================================================================
       Versione senza sezione Mappa
       ================================================================ */

    const DATA_KEY = "giappone-data";
    const SETTINGS_KEY = "giappone-settings";
    const STATUSES = ["Da preparare", "Da comprare", "In valigia", "Fatto"];
    const URGENCY_ORDER = { Alta: 0, Media: 1, Bassa: 2 };
    const MONTHS = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
    const WEEKDAYS = ["dom", "lun", "mar", "mer", "gio", "ven", "sab"];

    const SHEETS = [
      "1. Itinerario", "2. Hotel e Alloggi", "3. Trasporti", "4. App",
      "5. Valigia", "6. Attrazioni", "7. Guida", "8. Cibo e Ristoranti",
      "9. Shopping", "10. Emergenze", "11. Budget"
    ];

    const TABS = [
      "1. Itinerario", "6. Attrazioni", "8. Cibo e Ristoranti",
      "2. Hotel e Alloggi", "3. Trasporti", "9. Shopping", "4. App",
      "5. Valigia", "7. Guida", "10. Emergenze", "11. Budget", "settings"
    ];

    const ICONS = {
      "1. Itinerario": "🗺️", "2. Hotel e Alloggi": "🏨", "3. Trasporti": "🚄",
      "4. App": "📱", "5. Valigia": "🧳", "6. Attrazioni": "⛩️",
      "7. Guida": "📖", "8. Cibo e Ristoranti": "🍜", "9. Shopping": "🛍️",
      "10. Emergenze": "🚨", "11. Budget": "💴"
    };

    const FIELD_ICONS = {
      "Città": "📍", "Categoria": "🏷️", "Note": "📝",
      "Note e Suggerimenti": "📝", "Note per il Giappone": "🎒",
      "Note / Categoria": "📝", "Note / Conferma": "📝",
      "Costo Stimato": "💰", "Durata": "⏱️", "Mezzo / Vettore": "🚆",
      "Nome Hotel / Ryokan": "🏨", "Quartiere": "🧭",
      "Articolo Mirato / Note": "🛍️", "Dettagli Operativi": "📋",
      "Numero / Riferimento": "☎️", "Funzione Principale": "⚙️",
      "Urgenza Configurazione": "⏳", "Urgenza": "⏳",
      "Spesa Effettiva Revolut": "💸", "Differenza": "📊",
      "Budget Previsto (Yen)": "💴", "Pernottamento": "🏨",
      "Spostamento": "🚉", "App": "📱", "Contatto / Servizio": "🚨"
    };

    const META = {
      "1. Itinerario": { label: "Itinerario", title: "Attività Principali", search: ["Città", "Attività Principali", "Spostamento"] },
      "2. Hotel e Alloggi": { label: "Alloggi", title: "Nome Hotel / Ryokan", fallback: "Città", sub: ["Città", "Notte"], notes: ["Note / Conferma"], maps: [{ field: "Link Google Maps", label: "Maps" }], search: ["Città", "Nome Hotel / Ryokan"], city: "Città" },
      "3. Trasporti": { label: "Trasporti", title: "Tratta / Servizio", sub: ["Mezzo / Vettore"], badge: "Costo Stimato", extra: ["Durata"], maps: [{ field: "Link Maps Partenza", label: "Partenza" }, { field: "Link Maps Arrivo", label: "Arrivo" }], search: ["Tratta / Servizio", "Mezzo / Vettore"] },
      "4. App": { label: "App", title: "App", sub: ["Categoria"], badge: "Urgenza Configurazione", notes: ["Funzione Principale", "Note"], search: ["App", "Categoria"] },
      "5. Valigia": { label: "Valigia", title: "Articolo", sub: ["Categoria"], status: "Messo in Valigia?", notes: ["Note per il Giappone"], extra: ["Urgenza"], search: ["Articolo", "Categoria"] },
      "6. Attrazioni": { label: "Attrazioni", title: "Attrazione", fallback: "Città", sub: ["Città", "Categoria"], badge: "Urgenza", notes: ["Note"], maps: [{ field: "Link Google Maps", label: "Maps" }], search: ["Città", "Attrazione", "Categoria"], city: "Città" },
      "7. Guida": { label: "Guida", title: "Argomento", notes: ["Dettagli Operativi"], search: ["Argomento"] },
      "8. Cibo e Ristoranti": { label: "Cibo", title: "Specialità / Piatto", fallback: "Città", sub: ["Città", "Categoria"], notes: ["Note e Suggerimenti"], maps: [{ field: "Link Google Maps", label: "Maps" }], search: ["Città", "Specialità / Piatto", "Categoria"], city: "Città" },
      "9. Shopping": { label: "Shopping", title: "Brand / Negozio", fallback: "Quartiere", sub: ["Città", "Quartiere", "Categoria"], notes: ["Articolo Mirato / Note"], maps: [{ field: "Link Google Maps", label: "Maps" }], search: ["Città", "Quartiere", "Brand / Negozio"], city: "Città" },
      "10. Emergenze": { label: "Emergenze", title: "Contatto / Servizio", sub: ["Numero / Riferimento"], notes: ["Dettagli Operativi"], search: ["Contatto / Servizio"] },
      "11. Budget": { label: "Budget", title: "Data", sub: ["Giorno"], badge: "Budget Previsto (Yen)", notes: ["Note / Categoria"], extra: ["Spesa Effettiva Revolut", "Differenza"], search: ["Data", "Giorno"] }
    };

    const state = {
      data: JSON.parse(localStorage.getItem(DATA_KEY) || "{}"),
      settings: JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}"),
      view: "1. Itinerario",
      search: "",
      city: "",
      sort: "default"
    };

    state.settings.theme = "dark";
    state.settings.accent ||= "torii";
    state.settings.exchangeRate ||= 160;

    function saveData() {
      localStorage.setItem(DATA_KEY, JSON.stringify(state.data));
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings));
    }

    function iconFor(field) {
      return FIELD_ICONS[field] || "•";
    }

    function isUrl(value) {
      return /^https?:\/\//i.test(String(value || "").trim());
    }

    function isPhone(value) {
      return /^[\d+\-\s()]{3,}$/.test(String(value || "").trim());
    }

    function applyTheme() {
      document.documentElement.dataset.theme = "dark";
      document.documentElement.dataset.accent = state.settings.accent;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function parseDate(value) {
      const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
      return match
        ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]))
        : null;
    }

    function todayString() {
      const date = new Date();
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function shortDate(value) {
      const date = parseDate(value);
      return date
        ? `${WEEKDAYS[date.getDay()]} ${date.getDate()} ${MONTHS[date.getMonth()]}`
        : String(value || "");
    }

    function monthDay(value) {
      const date = parseDate(value);
      return date
        ? `${date.getDate()} ${MONTHS[date.getMonth()]}`
        : String(value || "");
    }

    function cityClass(value) {
      const city = String(value || "").split("/")[0].trim().toLowerCase();
      const classes = {
        osaka: "city-osaka", kyoto: "city-kyoto", tokyo: "city-tokyo",
        takayama: "city-takayama", hiroshima: "city-hiroshima",
        kamakura: "city-kamakura", kawaguchiko: "city-kawaguchiko"
      };
      return classes[city] || "city-default";
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("visible");
      setTimeout(() => toast.classList.remove("visible"), 2200);
    }

    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    function renderBackground() {
      const svg = document.getElementById("backgroundPattern");
      const radius = 46;
      let paths = "";

      for (let row = 0; row < 11; row += 1) {
        for (let column = 0; column < 14; column += 1) {
          const offset = row % 2 ? radius * 0.52 : 0;
          const x = column * radius * 1.05 + offset;
          const y = row * radius * 0.55;
          paths += `<path d="M${x - radius} ${y}a${radius} ${radius} 0 0 1 ${radius * 2} 0" fill="none" stroke="var(--accent)" stroke-width="1.6"/>`;
        }
      }

      svg.innerHTML = paths;
    }

    function renderTabs() {
      const tabbar = document.getElementById("tabbar");
      tabbar.innerHTML = "";

      TABS.forEach((key) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.type = "button";
        button.dataset.tab = key;
        button.innerHTML = `
          <span class="tab-button-icon">${key === "settings" ? "⚙️" : ICONS[key]}</span>
          ${key === "settings" ? "Impostazioni" : META[key].label}
        `;

        button.onclick = () => {
          state.view = key;
          state.search = "";
          state.city = "";
          state.sort = "default";
          renderApp();
        };

        tabbar.appendChild(button);
      });
    }

    function renderApp() {
      const main = document.getElementById("main");
      const title = document.getElementById("pageTitle");
      const subtitle = document.getElementById("pageSubtitle");
      const addButton = document.getElementById("addButton");

      document.querySelectorAll(".tab-button").forEach((button) => {
        button.classList.toggle(button.dataset.tab === state.view);
      });

      main.innerHTML = "";
      addButton.hidden = true;
      subtitle.textContent = "";

      if (state.view === "settings") {
        title.textContent = "⚙️ Impostazioni";
        main.appendChild(renderSettings());
        return;
      }

      const meta = META[state.view];
      title.textContent = `${ICONS[state.view]} ${meta.label}`;

      addButton.hidden = false;
      addButton.onclick = () => openEditModal(state.view, null);

      const toolbar = renderToolbar(state.view, meta);
      const list = document.createElement("div");
      main.append(toolbar, list);
      renderList(state.view, list);
    }

    function renderToolbar(key, meta) {
      const toolbar = document.createElement("div");
      toolbar.className = "toolbar";
      const input = document.createElement("input");
      input.type = "search";
      input.placeholder = `🔎 Cerca in ${meta.label}...`;
      input.value = state.search;
      input.oninput = () => {
        state.search = input.value;
        renderList(key, toolbar.nextElementSibling);
      };
      toolbar.appendChild(input);

      if (key !== "1. Itinerario" && key !== "11. Budget") {
        const options = [
          { value: "default", label: "↕️ Originale" },
          { value: "alpha", label: "🔤 A-Z" }
        ];
        if (state.data[key].headers.includes("Urgenza")) {
          options.push({ value: "urgency", label: "⏳ Urgenza" });
        }
        toolbar.appendChild(createSelect(options, state.sort, (value) => {
          state.sort = value;
          renderList(key, toolbar.nextElementSibling);
        }));
      }

      return toolbar;
    }

    function createSelect(options, selected, onChange) {
      const wrapper = document.createElement("div");
      wrapper.className = "dropdown";
      const select = document.createElement("select");
      options.forEach((option) => {
        const element = document.createElement("option");
        element.value = option.value;
        element.textContent = option.label;
        element.selected = option.value === selected;
        select.appendChild(element);
      });
      select.onchange = () => onChange(select.value);
      wrapper.appendChild(select);
      return wrapper;
    }

    function rowHasContent(key, meta, row) {
      const title = String(row[meta.title] || row[meta.fallback] || "").trim();
      return Boolean(title) || Boolean(
        key === "1. Itinerario" &&
        String(row["Data"] || "").trim() &&
        String(row["Attività Principali"] || "").trim()
      );
    }

    function renderList(key, container) {
      if (!container) return;
      const meta = META[key];
      const query = state.search.toLowerCase().trim();
      let items = (state.data[key]?.rows || [])
        .map((row, index) => ({ row, index }))
        .filter(({ row }) => rowHasContent(key, meta, row));

      items = items.filter(({ row }) => {
        return !query || meta.search.some((field) => {
          return String(row[field] || "").toLowerCase().includes(query);
        });
      });

      if (state.sort === "alpha") {
        items.sort((a, b) => {
          const aValue = String(a.row[meta.title] || a.row[meta.fallback] || "");
          const bValue = String(b.row[meta.title] || b.row[meta.fallback] || "");
          return aValue.localeCompare(bValue);
        });
      }

      if (state.sort === "urgency") {
        items.sort((a, b) => {
          return (URGENCY_ORDER[a.row.Urgenza] ?? 99) -
            (URGENCY_ORDER[b.row.Urgenza] ?? 99);
        });
      }

      container.innerHTML = "";

      if (!items.length) {
        container.innerHTML = `<div class="empty-state">🔍 Nessun elemento trovato.<br>Tocca + per aggiungerne uno.</div>`;
        return;
      }

      items.forEach(({ row, index }) => {
        container.appendChild(renderDataCard(key, meta, row, index));
      });
    }

    function renderDataCard(key, meta, row, index) {
      const title = row[meta.title] || row[meta.fallback] || "(senza titolo)";
      const subtitle = (meta.sub || []).map((field) => row[field]).filter(Boolean).join(" · ");
      const card = document.createElement("article");
      card.className = `card${meta.city && row[meta.city] ? ` city-card ${cityClass(row[meta.city])}` : ""}`;
      card.onclick = (event) => {
        if (!event.target.closest("button, a, select")) openEditModal(key, index);
      };

      const right = meta.status
        ? renderStatus(row, meta.status)
        : meta.badge && row[meta.badge]
          ? `<span class="badge">${iconFor(meta.badge)} ${escapeHtml(row[meta.badge])}</span>`
          : `<span class="chevron">›</span>`;

      const notes = (meta.notes || []).map((field) => row[field]
        ? `<div class="bullet"><span>${iconFor(field)}</span><span>${escapeHtml(row[field])}</span></div>`
        : "").join("");

      const extra = (meta.extra || []).map((field) => row[field]
        ? `<div class="bullet muted"><span>${iconFor(field)}</span><span>${escapeHtml(field)}: ${escapeHtml(row[field])}</span></div>`
        : "").join("");

      const maps = (meta.maps || []).map((map) => {
        if (!isUrl(row[map.field])) return "";
        return `<a class="action-button" href="${row[map.field]}" target="_blank" rel="noopener">📍 ${map.label === "Maps" ? "Apri in Maps" : map.label}</a>`;
      }).join("");

      const emergency = key === "10. Emergenze" && isPhone(row["Numero / Riferimento"])
        ? `<a class="action-button" href="tel:${row["Numero / Riferimento"].replace(/\s/g, "")}">📞 Chiama</a>`
        : "";

      card.innerHTML = `
        <div class="card-top">
          <div class="card-title-wrap">
            <h3 class="card-title">${escapeHtml(title)}</h3>
            ${subtitle ? `<div class="card-subtitle">${escapeHtml(subtitle)}</div>` : ""}
          </div>
          ${right}
        </div>
        ${notes || extra ? `<div class="bullet-list">${notes}${extra}</div>` : ""}
        ${maps || emergency ? `<div class="button-row">${maps}${emergency}</div>` : ""}
        <div class="button-row"><button class="action-button secondary" data-share>📤 Condividi</button></div>
      `;

      const select = card.querySelector("[data-status]");
      if (select) {
        select.onclick = (event) => event.stopPropagation();
        select.onchange = () => {
          row[meta.status] = select.value;
          saveData();
          renderApp();
        };
      }

      card.querySelector("[data-share]").onclick = (event) => {
        event.stopPropagation();
        shareText(title, `${title}${subtitle ? ` · ${subtitle}` : ""}`);
      };

      return card;
    }

    function renderStatus(row, field) {
      const current = row[field] || STATUSES[0];
      const className = current === "Fatto"
        ? "state-ready"
        : current === "Da comprare"
          ? "state-buy"
          : current === "In valigia"
            ? "state-booked"
            : "state-preparing";

      return `<select class="status-select ${className}" data-status>${STATUSES.map((option) => `<option value="${option}" ${option === current ? "selected" : ""}>${option}</option>`).join("")}</select>`;
    }

    /* ================================================================
       Modali e impostazioni
       ================================================================ */

    function openEditModal(key, index) {
      const sheet = state.data[key];
      const row = index === null ? {} : sheet.rows[index];
      const meta = META[key];
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.onclick = (event) => {
        if (event.target === overlay) closeModal();
      };

      const modal = document.createElement("div");
      modal.className = "modal";
      modal.innerHTML = `
        <h2 class="modal-title">
          ${index === null ? "➕ Nuovo" : "✎ Modifica"}
          · ${ICONS[key]} ${meta.label}
        </h2>
        ${sheet.headers.map((field) => renderField(field, row[field], meta)).join("")}
        <div class="modal-actions">
          <button class="cancel-button" data-cancel>Annulla</button>
          <button class="save-button" data-save>Salva</button>
        </div>
        ${index === null ? "" : `<div class="modal-actions"><button class="delete-button" data-delete>🗑️ Elimina</button></div>`}
      `;

      overlay.appendChild(modal);
      document.getElementById("modalRoot").appendChild(overlay);
      modal.querySelector("[data-cancel]").onclick = closeModal;

      modal.querySelector("[data-save]").onclick = () => {
        const updated = {};
        modal.querySelectorAll("[data-field]").forEach((field) => {
          updated[field.dataset.field] = field.value;
        });

        if (index === null) sheet.rows.push(updated);
        else sheet.rows[index] = updated;

        saveData();
        closeModal();
        renderApp();
        showToast("✅ Salvato");
      };

      const remove = modal.querySelector("[data-delete]");
      if (remove) {
        remove.onclick = () => {
          sheet.rows.splice(index, 1);
          saveData();
          closeModal();
          renderApp();
          showToast("🗑️ Eliminato");
        };
      }
    }

    function renderField(field, value, meta) {
      const current = value || "";
      const label = `${iconFor(field)} ${field}`;

      if (meta.status === field) {
        return `
          <div class="field">
            <label class="field-label">${escapeHtml(label)}</label>
            <select data-field="${escapeHtml(field)}">
              ${STATUSES.map((option) => `<option value="${option}" ${option === current ? "selected" : ""}>${option}</option>`).join("")}
            </select>
          </div>
        `;
      }

      const type = /^data$/i.test(field)
        ? "date"
        : /link|maps/i.test(field)
          ? "url"
          : "text";

      const isLong = /note|dettagli|articolo mirato|attività/i.test(field);

      if (isLong) {
        return `
          <div class="field">
            <label class="field-label">${escapeHtml(label)}</label>
            <textarea data-field="${escapeHtml(field)}">${escapeHtml(current)}</textarea>
          </div>
        `;
      }

      return `
        <div class="field">
          <label class="field-label">${escapeHtml(label)}</label>
          <input type="${type}" data-field="${escapeHtml(field)}" value="${escapeHtml(current)}">
        </div>
      `;
    }

    function closeModal() {
      document.getElementById("modalRoot").innerHTML = "";
    }

    function renderSettings() {
      const wrapper = document.createElement("div");
      wrapper.innerHTML = `
        <section class="settings-section">
          <h2 class="settings-heading">🖌️ Colore accento</h2>
          <div class="accent-options">
            <button class="color-swatch" data-accent="torii" style="background:#d14e62"></button>
            <button class="color-swatch" data-accent="ao" style="background:#4f83c2"></button>
            <button class="color-swatch" data-accent="matcha" style="background:#5aa66b"></button>
            <button class="color-swatch" data-accent="sakura" style="background:#de86a5"></button>
          </div>
        </section>
        <section class="settings-section">
          <h2 class="settings-heading">💴 Cambio Yen / Euro</h2>
          <label class="rate-box"><span>1 € =</span><input id="exchangeRate" type="number" value="${state.settings.exchangeRate}" step="0.5"><span>¥</span></label>
        </section>
        <section class="settings-section">
          <h2 class="settings-heading">💾 Backup</h2>
          <button class="settings-button" id="exportJson">💾 Esporta JSON</button>
          <button class="settings-button" id="importJson">📥 Importa JSON</button>
          <button class="settings-button" id="exportXlsx">📤 Esporta Excel</button>
          <button class="settings-button" id="importXlsx">📊 Importa Excel</button>
          <input id="jsonInput" type="file" accept="application/json">
          <input id="xlsxInput" type="file" accept=".xlsx">
        </section>
      `;

      wrapper.querySelectorAll("[data-accent]").forEach((button) => {
        button.classList.toggle(button.dataset.accent === state.settings.accent);
        button.onclick = () => {
          state.settings.accent = button.dataset.accent;
          saveSettings();
          applyTheme();
          renderApp();
        };
      });

      wrapper.querySelector("#exchangeRate").onchange = (event) => {
        const value = Number(event.target.value);
        if (value > 0) {
          state.settings.exchangeRate = value;
          saveSettings();
          showToast("Cambio aggiornato");
        }
      };

      wrapper.querySelector("#exportJson").onclick = () => {
        downloadFile(
          JSON.stringify({ data: state.data, settings: state.settings }, null, 2),
          "giappone-backup.json",
          "application/json"
        );
        showToast("Backup esportato");
      };

      wrapper.querySelector("#importJson").onclick = () => {
        wrapper.querySelector("#jsonInput").click();
      };

      wrapper.querySelector("#jsonInput").onchange = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const payload = JSON.parse(reader.result);
            if (payload.data) state.data = payload.data;
            if (payload.settings) state.settings = payload.settings;
            state.settings.theme = "dark";
            saveData();
            saveSettings();
            applyTheme();
            renderApp();
            showToast("Backup importato");
          } catch (error) {
            alert(`Backup non valido: ${error.message}`);
          }
        };
        reader.readAsText(file);
      };

      wrapper.querySelector("#exportXlsx").onclick = () => {
        if (!window.XLSX) {
          alert("Libreria Excel non disponibile.");
          return;
        }

        const workbook = XLSX.utils.book_new();
        SHEETS.forEach((key) => {
          const sheet = state.data[key];
          if (!sheet) return;
          const values = [
            sheet.headers,
            ...sheet.rows.map((row) => {
              return sheet.headers.map((header) => row[header] || "");
            })
          ];
          XLSX.utils.book_append_sheet(
            workbook,
            XLSX.utils.aoa_to_sheet(values),
            key.slice(0, 31)
          );
        });
        XLSX.writeFile(workbook, "Giappone_Backup.xlsx");
        showToast("Excel esportato");
      };

      wrapper.querySelector("#importXlsx").onclick = () => {
        wrapper.querySelector("#xlsxInput").click();
      };

      wrapper.querySelector("#xlsxInput").onchange = (event) => {
        const file = event.target.files?.[0];
        if (!file || !window.XLSX) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const workbook = XLSX.read(new Uint8Array(reader.result), { type: "array", cellDates: false });
            const imported = {};
            const missing = [];
            let total = 0;

            SHEETS.forEach((key) => {
              const name = workbook.SheetNames.find((item) => item.trim() === key.trim()) || workbook.SheetNames.find((item) => item.replace(/^\d+\.\s*/, "").trim() === key.replace(/^\d+\.\s*/, "").trim());
              if (!name) {
                missing.push(key);
                return;
              }

              const values = XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1, defval: "", raw: false });
              if (!values.length) {
                missing.push(key);
                return;
              }

              const headers = values[0].map((header) => String(header).trim());
              const rows = values.slice(1)
                .filter((row) => row.some((value) => value !== "" && value !== null && value !== undefined))
                .map((row) => {
                  const result = {};
                  headers.forEach((header, index) => {
                    result[header] = String(row[index] ?? "");
                  });
                  return result;
                });

              imported[key] = { headers, rows };
              total += rows.length;
            });

            if (missing.length) {
              alert("Importazione annullata. Fogli mancanti o vuoti:\n\n" + missing.join("\n"));
              return;
            }

            state.data = imported;
            state.settings.theme = "dark";
            saveData();
            saveSettings();
            state.view = "1. Itinerario";
            renderApp();
            showToast(`Importati ${total} elementi`);
          } catch (error) {
            alert(`Errore Excel: ${error.message}`);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      return wrapper;
    }

    /* ================================================================
       Avvio
       ================================================================ */

    applyTheme();
    renderBackground();
    renderTabs();
    renderApp();
  </script>
</body>
</html>
