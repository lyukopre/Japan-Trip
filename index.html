<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Giappone">

  <title>Giappone 2026/27</title>

  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    /* ================================================================
       1. Variabili e temi
       ================================================================ */

    :root {
      --bg: #f3f1ec;
      --surface: #ffffff;
      --surface-soft: #faf8f4;
      --text: #1c1a18;
      --text-muted: #77716a;
      --border: #e6e0d6;
      --accent: #c94a5a;
      --accent-soft: #fae9eb;
      --gold: #c9a24a;
      --nav-bg: rgba(255, 255, 255, 0.78);
      --header-bg: rgba(243, 241, 236, 0.82);
      --shadow-small: 0 1px 3px rgba(28, 20, 10, 0.07);
      --shadow-card:
        0 1px 2px rgba(28, 20, 10, 0.06),
        0 10px 22px -12px rgba(28, 20, 10, 0.22);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius-large: 26px;
      --radius-medium: 20px;
      --radius-small: 12px;
    }

    html[data-theme="dark"] {
      --bg: #111318;
      --surface: #1b1e26;
      --surface-soft: #22252e;
      --text: #f2f0ec;
      --text-muted: #96939a;
      --border: #2c2f39;
      --accent-soft: #35232a;
      --nav-bg: rgba(17, 19, 24, 0.8);
      --header-bg: rgba(17, 19, 24, 0.82);
      --shadow-small: 0 1px 3px rgba(0, 0, 0, 0.35);
      --shadow-card:
        0 1px 2px rgba(0, 0, 0, 0.4),
        0 12px 24px -12px rgba(0, 0, 0, 0.65);
    }

    html[data-accent="ao"] {
      --accent: #3f6ea8;
      --accent-soft: #e8eef8;
    }

    html[data-accent="torii"] {
      --accent: #c94a5a;
      --accent-soft: #fae9eb;
    }

    html[data-accent="matcha"] {
      --accent: #4f8a5e;
      --accent-soft: #e8f2e9;
    }

    html[data-accent="sakura"] {
      --accent: #d97ea0;
      --accent-soft: #f9e9f0;
    }

    html[data-theme="dark"][data-accent="ao"] {
      --accent-soft: #1a293b;
    }

    html[data-theme="dark"][data-accent="matcha"] {
      --accent-soft: #192d1e;
    }

    html[data-theme="dark"][data-accent="sakura"] {
      --accent-soft: #30212a;
    }

    /* Colori delle città */
    .city-osaka { --city-color: #e08a3c; }
    .city-kyoto { --city-color: #4f8a5e; }
    .city-tokyo { --city-color: #2c4a6e; }
    .city-takayama { --city-color: #b5623f; }
    .city-hiroshima { --city-color: #7a6bb0; }
    .city-kamakura { --city-color: #3f9b9b; }
    .city-kawaguchiko { --city-color: #4f8fc9; }
    .city-partenza { --city-color: #8a8478; }
    .city-default { --city-color: var(--accent); }

    /* ================================================================
       2. Reset e struttura generale
       ================================================================ */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior-y: none;
      -webkit-text-size-adjust: 100%;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    select {
      cursor: pointer;
    }

    a {
      color: var(--accent);
    }

    #app {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      position: relative;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 12px 16px calc(116px + var(--safe-bottom));
      position: relative;
      z-index: 1;
    }

    .view-fade {
      animation: viewFade 0.25s ease;
    }

    @keyframes viewFade {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ================================================================
       3. Sfondo decorativo e header
       ================================================================ */

    .seigaiha-background {
      position: absolute;
      inset: 0 0 auto;
      height: 230px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.42;
      z-index: 0;
    }

    .seigaiha-background svg {
      width: 100%;
      height: 100%;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: max(14px, calc(var(--safe-top) + 10px)) 18px 10px;
      background: var(--header-bg);
      border-bottom: 1px solid transparent;
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      backdrop-filter: blur(20px) saturate(150%);
      transition: padding 0.25s ease, border-color 0.25s ease;
    }

    .topbar.scrolled {
      padding-bottom: 6px;
      border-bottom-color: var(--border);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 9px;
      background: var(--accent);
      box-shadow: var(--shadow-small);
      transition: width 0.25s ease, height 0.25s ease;
    }

    .logo-mark svg {
      width: 62%;
      height: 62%;
    }

    .topbar.scrolled .logo-mark {
      width: 24px;
      height: 24px;
    }

    .page-title {
      flex: 1;
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.03em;
      transition: font-size 0.25s ease;
    }

    .topbar.scrolled .page-title {
      font-size: 19px;
    }

    .page-subtitle {
      max-height: 24px;
      padding-left: 40px;
      margin-top: 3px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 13.5px;
      transition: opacity 0.2s ease, max-height 0.25s ease, margin 0.25s ease;
    }

    .topbar.scrolled .page-subtitle {
      max-height: 0;
      margin-top: 0;
      opacity: 0;
    }

    .trip-banner {
      margin-top: 10px;
      padding: 11px 15px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-soft), transparent);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      box-shadow: var(--shadow-small);
    }

    /* ================================================================
       4. Toolbar, statistiche e progressi
       ================================================================ */

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0 6px;
    }

    .stat-box {
      padding: 15px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-medium);
      background: var(--surface-soft);
      text-align: center;
      box-shadow: var(--shadow-small);
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
    }

    .progress-card {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 14px 0 6px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-medium);
      background: var(--surface-soft);
      box-shadow: var(--shadow-small);
    }

    .progress-ring {
      flex: 0 0 auto;
      transform: rotate(-90deg);
    }

    .progress-ring-background {
      fill: none;
      stroke: var(--border);
      stroke-width: 8;
    }

    .progress-ring-value {
      fill: none;
      stroke: var(--accent);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.4s ease;
    }

    .progress-ring-label {
      fill: var(--text);
      font-size: 13px;
      font-weight: 800;
    }

    .progress-title {
      font-size: 14px;
      font-weight: 800;
    }

    .progress-subtitle {
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 12px;
    }

    .toolbar input[type="search"] {
      flex: 1 1 140px;
      min-width: 0;
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      outline: none;
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      box-shadow: var(--shadow-small);
    }

    .toolbar input:focus,
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .dropdown {
      flex: 0 0 auto;
    }

    .dropdown select {
      max-width: 155px;
      padding: 12px 30px 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      outline: none;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow-small);
    }

    /* ================================================================
       5. Card e contenuti
       ================================================================ */

    .card {
      position: relative;
      overflow: hidden;
      margin-bottom: 12px;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-medium);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:active {
      transform: scale(0.985);
    }

    .card.city-card {
      border-left: 4px solid var(--city-color, var(--accent));
    }

    .card.today {
      box-shadow: 0 0 0 2px var(--accent), var(--shadow-card);
    }

    .card-top,
    .card-top-left {
      display: flex;
      align-items: center;
    }

    .card-top {
      justify-content: space-between;
      gap: 10px;
    }

    .card-top-left {
      min-width: 0;
      gap: 10px;
    }

    .card-title-wrap {
      min-width: 0;
    }

    .card-title {
      margin: 0;
      font-size: 17.5px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.015em;
      overflow-wrap: anywhere;
    }

    .card-subtitle {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .day-chip {
      flex: 0 0 auto;
      padding: 5px 11px;
      border-radius: 9px;
      background: var(--city-color, var(--accent));
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .day-chip.today-chip {
      background: #2ea86b;
    }

    .date-chevron {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 4px;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chevron {
      color: var(--text-muted);
      font-size: 17px;
      opacity: 0.55;
    }

    .badge {
      flex: 0 0 auto;
      padding: 5px 11px;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .bullet {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.45;
    }

    .bullet-icon {
      width: 20px;
      flex: 0 0 auto;
      margin-top: 1px;
      text-align: center;
    }

    .bullet.muted {
      color: var(--text-muted);
      font-size: 13.5px;
    }

    .hotel-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      background: var(--surface-soft);
    }

    .hotel-name {
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 11px;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;
      padding: 10px 15px;
      border: 0;
      border-radius: var(--radius-small);
      background: var(--accent);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: var(--shadow-small);
    }

    .action-button.small {
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 12.5px;
    }

    .action-button.secondary {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: none;
    }

    .status-select {
      max-width: 135px;
      padding: 8px 27px 8px 13px;
      border: 0;
      border-radius: 20px;
      outline: none;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12.5px;
      font-weight: 800;
    }

    .empty-state {
      padding: 56px 20px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 4px 10px;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    /* ================================================================
       6. Barra di navigazione e pulsante flottante
       ================================================================ */

    .floating-button {
      position: fixed;
      right: 18px;
      bottom: calc(84px + var(--safe-bottom));
      z-index: 15;
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 18px;
      background: var(--accent);
      color: #ffffff;
      font-size: 26px;
      box-shadow: 0 8px 20px -4px var(--accent);
      transition: transform 0.15s ease;
    }

    .floating-button:active {
      transform: scale(0.92);
    }

    .tabbar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 25;
      display: flex;
      overflow-x: auto;
      padding: 9px 0 calc(6px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: var(--nav-bg);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      scrollbar-width: none;
    }

    .tabbar::-webkit-scrollbar {
      display: none;
    }

    .tab-button {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 66px;
      padding: 5px 8px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 700;
    }

    .tab-button-icon {
      font-size: 21px;
      transition: transform 0.15s ease;
    }

    .tab-button.active {
      color: var(--accent);
    }

    .tab-button.active .tab-button-icon {
      transform: translateY(-1px) scale(1.08);
    }

    /* ================================================================
       7. Impostazioni e modale
       ================================================================ */

    .settings-section {
      margin-bottom: 26px;
    }

    .settings-heading {
      margin: 0 0 6px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .theme-options,
    .accent-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill-button {
      padding: 11px 17px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow-small);
    }

    .pill-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .color-swatch {
      width: 42px;
      height: 42px;
      border: 3px solid transparent;
      border-radius: 50%;
      box-shadow: var(--shadow-small);
    }

    .color-swatch.active {
      border-color: var(--text);
    }

    .settings-button,
    .rate-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 10px;
      margin-top: 8px;
      padding: 15px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      box-shadow: var(--shadow-small);
    }

    .settings-button.danger {
      color: var(--accent);
    }

    .rate-box input {
      width: 90px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 15px;
      text-align: right;
    }

    input[type="file"] {
      display: none;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: flex-end;
      background: rgba(20, 15, 10, 0.5);
    }

    .modal {
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 22px 20px calc(26px + var(--safe-bottom));
      border-radius: 28px 28px 0 0;
      background: var(--surface);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.25);
    }

    .modal-title {
      margin: 0 0 16px;
      font-size: 19px;
      font-weight: 800;
    }

    .field {
      margin-bottom: 13px;
    }

    .field-label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      outline: none;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 16px;
    }

    .field textarea {
      min-height: 64px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-actions button {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
    }

    .save-button {
      background: var(--accent);
      color: #ffffff;
    }

    .cancel-button {
      border: 1px solid var(--border) !important;
      background: var(--surface-soft);
      color: var(--text);
    }

    .delete-button {
      background: #c94a5a;
      color: #ffffff;
    }

    .toast {
      position: fixed;
      bottom: calc(100px + var(--safe-bottom));
      left: 50%;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 90vw;
      padding: 12px 18px;
      border-radius: 20px;
      background: var(--text);
      color: var(--bg);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .toast.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .toast button {
      border: 0;
      background: transparent;
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="seigaihaBackground" class="seigaiha-background"></div>

    <header id="topbar" class="topbar">
      <div class="topbar-row">
        <div class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
            <path d="M3 9h18M6 9V6c0-1 1-2 2-2h8c1 0 2 1 2 2v3M6 9v11M18 9v11" />
          </svg>
        </div>
        <h1 id="pageTitle" class="page-title">Itinerario</h1>
      </div>
      <div id="pageSubtitle" class="page-subtitle"></div>
      <div id="tripBanner" class="trip-banner" hidden></div>
    </header>

    <main id="main"></main>

    <button id="addButton" class="floating-button" type="button" hidden aria-label="Aggiungi elemento">+</button>
    <nav id="tabbar" class="tabbar" aria-label="Sezioni app"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script>
    /* ================================================================
       1. Configurazione e dati iniziali
       ================================================================ */

    /* ================================================================
       2. Stato e utility
       ================================================================ */

    const state = {
      data: null,
      settings: null,
      view: "1. Itinerario",
      search: "",
      city: "",
      sort: "default"
    };

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadState() {
      const savedData = localStorage.getItem("giappone-data");
      const savedSettings = localStorage.getItem("giappone-settings");

      state.data = savedData ? JSON.parse(savedData) : clone(DEFAULT_DATA);
      state.settings = savedSettings
        ? JSON.parse(savedSettings)
        : { theme: "auto", accent: "torii", exchangeRate: 160 };

      if (!state.settings.exchangeRate) {
        state.settings.exchangeRate = 160;
      }

      applyTheme();
    }

    function saveData() {
      localStorage.setItem("giappone-data", JSON.stringify(state.data));
    }

    function saveSettings() {
      localStorage.setItem("giappone-settings", JSON.stringify(state.settings));
    }

    function applyTheme() {
      let theme = state.settings.theme;

      if (theme === "auto") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.accent = state.settings.accent;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function fieldEmoji(field) {
      return FIELD_EMOJI[field] || "•";
    }

    function isHttpUrl(value) {
      return /^https?:\/\//i.test(String(value || "").trim());
    }

    function isPhoneNumber(value) {
      return /^[\d+\-\s()]{3,}$/.test(String(value || "").trim());
    }

    function parseDate(value) {
      const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return null;
      return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    }

    function todayString() {
      const date = new Date();
      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-");
    }

    function shortDate(value) {
      const date = parseDate(value);
      if (!date) return value || "";
      return `${WEEKDAYS_IT[date.getDay()]} ${date.getDate()} ${MONTHS_IT[date.getMonth()]}`;
    }

    function dayMonth(value) {
      const date = parseDate(value);
      if (!date) return value || "";
      return `${date.getDate()} ${MONTHS_IT[date.getMonth()]}`;
    }

    function cityClass(value) {
      const city = String(value || "").split("/")[0].trim().toLowerCase();
      const map = {
        osaka: "city-osaka",
        kyoto: "city-kyoto",
        tokyo: "city-tokyo",
        takayama: "city-takayama",
        hiroshima: "city-hiroshima",
        kamakura: "city-kamakura",
        kawaguchiko: "city-kawaguchiko",
        partenza: "city-partenza"
      };
      return map[city] || "city-default";
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerHTML = "";
      toast.textContent = message;
      toast.classList.add("visible");
      setTimeout(() => toast.classList.remove("visible"), 2300);
    }

    function showUndoToast(message, undo) {
      const toast = document.getElementById("toast");
      toast.innerHTML = `<span>${escapeHtml(message)}</span><button type="button">ANNULLA</button>`;
      toast.classList.add("visible");

      let undone = false;
      toast.querySelector("button").onclick = () => {
        undone = true;
        undo();
        toast.classList.remove("visible");
      };

      setTimeout(() => {
        if (!undone) toast.classList.remove("visible");
      }, 5000);
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    /* ================================================================
       3. Rendering dell'interfaccia
       ================================================================ */

    function renderPattern() {
      const target = document.getElementById("seigaihaBackground");
      let paths = "";
      const radius = 46;

      for (let row = 0; row < 3; row += 1) {
        for (let column = 0; column < 11; column += 1) {
          const offset = row % 2 ? radius * 0.52 : 0;
          const x = column * radius * 1.05 + offset;
          const y = row * radius * 0.55;
          paths += `<path d="M${x - radius} ${y}a${radius} ${radius} 0 0 1 ${radius * 2} 0" fill="none" stroke="var(--accent)" stroke-width="1.4"/>`;
        }
      }

      target.innerHTML = `<svg viewBox="0 0 460 230" preserveAspectRatio="xMidYMin slice">${paths}</svg>`;
    }

    function renderTabs() {
      const tabbar = document.getElementById("tabbar");
      tabbar.innerHTML = "";

      TAB_ORDER.forEach((key) => {
        const button = document.createElement("button");
        button.className = "tab-button";
        button.dataset.tab = key;
        button.type = "button";

        const icon = key === "mappa"
          ? "🗺️📍"
          : key === "settings"
            ? "⚙️"
            : SECTION_EMOJI[key];

        const label = key === "mappa"
          ? "Mappa"
          : key === "settings"
            ? "Impostazioni"
            : SECTION_META[key].label;

        button.innerHTML = `<span class="tab-button-icon">${icon}</span>${label}`;
        button.onclick = () => {
          state.view = key;
          state.search = "";
          state.city = "";
          state.sort = "default";
          render();
        };

        tabbar.appendChild(button);
      });
    }

    function renderCountdown() {
      const banner = document.getElementById("tripBanner");
      const rows = state.data["1. Itinerario"]?.rows || [];

      if (!rows.length) {
        banner.hidden = true;
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const start = parseDate(rows[0].Data);
      const end = parseDate(rows[rows.length - 1].Data);

      if (!start || !end) {
        banner.hidden = true;
        return;
      }

      banner.hidden = false;

      if (today < start) {
        const days = Math.ceil((start - today) / 86400000);
        banner.textContent = `🛫 Mancano ${days} giorni alla partenza`;
      } else if (today <= end) {
        let index = rows.findIndex((row) => row.Data === todayString());
        if (index < 0) index = rows.findIndex((row) => parseDate(row.Data) >= today);
        banner.textContent = `📍 Sei in viaggio · Giorno ${Math.max(index + 1, 1)} di ${rows.length}`;
      } else {
        banner.textContent = "✅ Viaggio concluso · che ricordi! 🎌";
      }
    }

    function render() {
      const main = document.getElementById("main");
      const title = document.getElementById("pageTitle");
      const subtitle = document.getElementById("pageSubtitle");
      const addButton = document.getElementById("addButton");

      document.querySelectorAll(".tab-button").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === state.view);
      });

      main.innerHTML = "";
      main.classList.remove("view-fade");
      void main.offsetWidth;
      main.classList.add("view-fade");
      addButton.hidden = true;
      subtitle.textContent = "";
      renderCountdown();

      if (state.view === "settings") {
        title.textContent = "⚙️ Impostazioni";
        main.appendChild(renderSettings());
        return;
      }

      if (state.view === "mappa") {
        title.textContent = "🗺️ Mappa rapida";
        subtitle.textContent = "Luoghi con link Google Maps";
        main.appendChild(renderMap());
        return;
      }

      const meta = SECTION_META[state.view];
      title.textContent = `${SECTION_EMOJI[state.view]} ${meta.label}`;

      if (state.view === "1. Itinerario") {
        main.appendChild(renderItineraryStats());
      }

      if (state.view === "5. Valigia") {
        main.appendChild(renderPackingProgress());
      }

      addButton.hidden = false;
      addButton.onclick = () => openEditModal(state.view, null);

      const container = document.createElement("div");
      const toolbar = renderToolbar(state.view, meta);
      const list = document.createElement("div");

      toolbar.onchange = () => renderList(state.view, list);
      container.append(toolbar, list);
      main.appendChild(container);
      renderList(state.view, list);
    }

    function renderItineraryStats() {
      const rows = state.data["1. Itinerario"].rows;
      const cities = new Set();

      rows.forEach((row) => {
        String(row["Città"] || "").split("/").forEach((city) => {
          const clean = city.trim();
          if (clean && clean !== "Partenza" && clean !== "-") cities.add(clean);
        });
      });

      const start = rows[0]?.Data || "";
      const end = rows[rows.length - 1]?.Data || "";
      document.getElementById("pageSubtitle").textContent = `Giappone ${dayMonth(start)} – ${dayMonth(end)}`;

      const element = document.createElement("div");
      element.className = "stats-row";
      element.innerHTML = `
        <div class="stat-box">
          <div class="stat-label">Durata</div>
          <div class="stat-value">${rows.length} giorni</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Tappe</div>
          <div class="stat-value">${cities.size} città</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Periodo</div>
          <div class="stat-value">${dayMonth(start)} – ${dayMonth(end)}</div>
        </div>
      `;
      return element;
    }

    function renderPackingProgress() {
      const rows = state.data["5. Valigia"].rows;
      const completed = rows.filter((row) => row["Messo in Valigia?"] === "Fatto").length;
      const percent = rows.length ? Math.round((completed / rows.length) * 100) : 0;
      const radius = 30;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (percent / 100) * circumference;

      const element = document.createElement("div");
      element.className = "progress-card";
      element.innerHTML = `
        <svg class="progress-ring" width="72" height="72" viewBox="0 0 72 72">
          <circle class="progress-ring-background" cx="36" cy="36" r="${radius}"></circle>
          <circle
            class="progress-ring-value"
            cx="36"
            cy="36"
            r="${radius}"
            stroke-dasharray="${circumference}"
            stroke-dashoffset="${offset}"
          ></circle>
          <text class="progress-ring-label" x="36" y="41" text-anchor="middle" transform="rotate(90 36 36)">${percent}%</text>
        </svg>
        <div>
          <div class="progress-title">🧳 Preparazione valigia</div>
          <div class="progress-subtitle">${completed} di ${rows.length} oggetti pronti</div>
        </div>
      `;
      return element;
    }

    function renderToolbar(key, meta) {
      const toolbar = document.createElement("div");
      toolbar.className = "toolbar";

      const search = document.createElement("input");
      search.type = "search";
      search.placeholder = `🔎 Cerca in ${meta.label}...`;
      search.value = state.search;
      search.oninput = () => {
        state.search = search.value;
        const list = toolbar.nextElementSibling;
        renderList(key, list);
      };
      toolbar.appendChild(search);

      if (meta.cityField) {
        const cities = [...new Set(
          state.data[key].rows.map((row) => row[meta.cityField]).filter(Boolean)
        )].sort();

        toolbar.appendChild(createSelect(
          "🌆 Tutte le città",
          cities.map((city) => ({ value: city, label: city })),
          state.city,
          (value) => {
            state.city = value;
            renderList(key, toolbar.nextElementSibling);
          }
        ));
      }

      if (key !== "1. Itinerario" && key !== "11. Budget") {
        const sortOptions = [
          { value: "default", label: "↕️ Originale" },
          { value: "alpha", label: "🔤 A-Z" }
        ];

        if (state.data[key].headers.includes("Urgenza")) {
          sortOptions.push({ value: "urgency", label: "⏳ Urgenza" });
        }

        toolbar.appendChild(createSelect(
          "↕️ Originale",
          sortOptions,
          state.sort,
          (value) => {
            state.sort = value;
            renderList(key, toolbar.nextElementSibling);
          },
          true
        ));
      }

      return toolbar;
    }

    function createSelect(firstLabel, options, selectedValue, onChange, customOptions = false) {
      const wrapper = document.createElement("div");
      wrapper.className = "dropdown";

      const select = document.createElement("select");
      const firstOption = document.createElement("option");

      if (customOptions) {
        options.forEach((option) => {
          const element = document.createElement("option");
          element.value = option.value;
          element.textContent = option.label;
          element.selected = option.value === selectedValue;
          select.appendChild(element);
        });
      } else {
        firstOption.value = "";
        firstOption.textContent = firstLabel;
        firstOption.selected = !selectedValue;
        select.appendChild(firstOption);

        options.forEach((option) => {
          const element = document.createElement("option");
          element.value = option.value;
          element.textContent = option.label;
          element.selected = option.value === selectedValue;
          select.appendChild(element);
        });
      }

      select.onchange = () => onChange(select.value);
      wrapper.appendChild(select);
      return wrapper;
    }

    function renderList(key, container) {
      if (!container) return;

      const meta = SECTION_META[key];
      const rows = state.data[key]?.rows || [];
      const query = state.search.toLowerCase().trim();
      let items = rows.map((row, index) => ({ row, index }));

      items = items.filter(({ row }) => {
        const matchesSearch = !query || meta.search.some((field) => {
          return String(row[field] || "").toLowerCase().includes(query);
        });

        const matchesCity = !meta.cityField || !state.city || row[meta.cityField] === state.city;
        return matchesSearch && matchesCity;
      });

      if (state.sort === "alpha") {
        items.sort((a, b) => {
          const aValue = String(a.row[meta.title] || a.row[meta.fallbackTitle] || "");
          const bValue = String(b.row[meta.title] || b.row[meta.fallbackTitle] || "");
          return aValue.localeCompare(bValue);
        });
      }

      if (state.sort === "urgency") {
        items.sort((a, b) => {
          return (URGENZA_ORDER[a.row.Urgenza] ?? 99) - (URGENZA_ORDER[b.row.Urgenza] ?? 99);
        });
      }

      container.innerHTML = "";

      if (!items.length) {
        container.innerHTML = `<div class="empty-state">🔍 Nessun elemento trovato.<br>Tocca + per aggiungerne uno.</div>`;
        return;
      }

      items.forEach(({ row, index }) => {
        const card = key === "1. Itinerario"
          ? renderItineraryCard(row, index)
          : renderDataCard(key, meta, row, index);
        container.appendChild(card);
      });

      if (key === "1. Itinerario") {
        setTimeout(() => {
          document.querySelector(".card.today")?.scrollIntoView({ block: "center", behavior: "smooth" });
        }, 60);
      }
    }

    /* ================================================================
       4. Card itinerario e card dati
       ================================================================ */

    function renderItineraryCard(row, index) {
      const card = document.createElement("article");
      const today = row.Data === todayString();
      card.className = `card city-card ${cityClass(row["Città"])}${today ? " today" : ""}`;
      card.onclick = (event) => {
        if (!event.target.closest("button") && !event.target.closest("a")) {
          openEditModal("1. Itinerario", index);
        }
      };

      const activities = String(row["Attività Principali"] || "")
        .split(/,|;/)
        .map((item) => item.trim())
        .filter(Boolean)
        .slice(0, 4);

      const activityIcons = ["☀️", "🏙️", "🌙", "✨"];
      const activityHtml = activities.map((activity, activityIndex) => `
        <div class="bullet">
          <span class="bullet-icon">${activityIcons[activityIndex % activityIcons.length]}</span>
          <span>${escapeHtml(activity)}</span>
        </div>
      `).join("");

      const transferHtml = row["Spostamento"] && row["Spostamento"] !== "-"
        ? `<div class="bullet muted"><span class="bullet-icon">🚉</span><span>${escapeHtml(row["Spostamento"])}</span></div>`
        : "";

      const hotel = state.data["2. Hotel e Alloggi"].rows.find((item) => item.Data === row.Data);
      const hotelName = hotel?.["Nome Hotel / Ryokan"] || (row["Pernottamento"] !== "-" ? row["Pernottamento"] : "");
      const hotelLink = hotel?.["Link Google Maps"];

      const hotelHtml = hotelName ? `
        <div class="hotel-pill">
          <span class="hotel-name">🏨 ${escapeHtml(hotelName)}</span>
          ${isHttpUrl(hotelLink) ? `<a class="action-button small" href="${hotelLink}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 Maps</a>` : ""}
        </div>
      ` : "";

      card.innerHTML = `
        <div class="card-top">
          <div class="card-top-left">
            <span class="day-chip${today ? " today-chip" : ""}">${today ? "OGGI" : `G${index + 1}`}</span>
            <div class="card-title-wrap">
              <h3 class="card-title">${escapeHtml(row["Città"] || "—")}</h3>
            </div>
          </div>
          <div class="date-chevron">${escapeHtml(shortDate(row.Data))}<span class="chevron">›</span></div>
        </div>
        <div class="bullet-list">${activityHtml}${transferHtml}</div>
        ${hotelHtml}
        <div class="button-row">
          <button class="action-button small secondary" type="button" data-calendar>📅 Calendario</button>
          <button class="action-button small secondary" type="button" data-share>📤 Condividi</button>
        </div>
      `;

      card.querySelector("[data-calendar]").onclick = (event) => {
        event.stopPropagation();
        addToCalendar(row);
      };

      card.querySelector("[data-share]").onclick = (event) => {
        event.stopPropagation();
        shareText(`Giappone · ${row.Città}`, `${shortDate(row.Data)}: ${row["Attività Principali"] || ""}`);
      };

      return card;
    }

    function renderDataCard(key, meta, row, index) {
      const title = row[meta.title] || row[meta.fallbackTitle] || "(senza titolo)";
      const subtitle = (meta.sub || []).map((field) => row[field]).filter(Boolean).join(" · ");
      const card = document.createElement("article");
      const city = meta.cityField ? row[meta.cityField] : "";

      card.className = `card${city ? ` city-card ${cityClass(city)}` : ""}`;
      card.onclick = (event) => {
        if (!event.target.closest("button, a, select")) openEditModal(key, index);
      };

      const statusHtml = meta.statusField
        ? renderStatusSelect(row, meta.statusField)
        : meta.badge && row[meta.badge]
          ? `<span class="badge">${fieldEmoji(meta.badge)} ${escapeHtml(row[meta.badge])}</span>`
          : `<span class="chevron">›</span>`;

      const notesHtml = (meta.notes || []).map((field) => row[field] ? `
        <div class="bullet"><span class="bullet-icon">${fieldEmoji(field)}</span><span>${escapeHtml(row[field])}</span></div>
      ` : "").join("");

      const extraHtml = (meta.extra || []).map((field) => row[field] ? `
        <div class="bullet muted"><span class="bullet-icon">${fieldEmoji(field)}</span><span>${escapeHtml(field)}: ${escapeHtml(row[field])}</span></div>
      ` : "").join("");

      const mapsHtml = (meta.maps || []).map((map) => {
        if (!isHttpUrl(row[map.field])) return "";
        return `<a class="action-button" href="${row[map.field]}" target="_blank" rel="noopener">📍 ${map.label === "Maps" ? "Apri in Maps" : map.label}</a>`;
      }).join("");

      const emergencyHtml = key === "10. Emergenze" && isPhoneNumber(row["Numero / Riferimento"])
        ? `
          <a class="action-button" href="tel:${row["Numero / Riferimento"].replace(/\s/g, "")}">📞 Chiama</a>
          <button class="action-button secondary" type="button" data-copy-phone>📋 Copia</button>
        `
        : "";

      const budgetHtml = key === "11. Budget" ? renderBudgetEuro(row) : "";

      card.innerHTML = `
        <div class="card-top">
          <div class="card-top-left">
            <div class="card-title-wrap">
              <h3 class="card-title">${escapeHtml(title)}</h3>
              ${subtitle ? `<div class="card-subtitle">${escapeHtml(subtitle)}</div>` : ""}
            </div>
          </div>
          ${statusHtml}
        </div>
        ${(notesHtml || extraHtml || budgetHtml) ? `<div class="bullet-list">${notesHtml}${extraHtml}${budgetHtml}</div>` : ""}
        ${(mapsHtml || emergencyHtml) ? `<div class="button-row">${mapsHtml}${emergencyHtml}</div>` : ""}
        <div class="button-row">
          <button class="action-button small secondary" type="button" data-share>📤 Condividi</button>
        </div>
      `;

      const select = card.querySelector("select[data-status]");
      if (select) {
        select.onclick = (event) => event.stopPropagation();
        select.onchange = () => {
          row[meta.statusField] = select.value;
          saveData();
          if (key === "5. Valigia") refreshPackingProgress();
        };
      }

      const copyButton = card.querySelector("[data-copy-phone]");
      if (copyButton) {
        copyButton.onclick = (event) => {
          event.stopPropagation();
          navigator.clipboard?.writeText(row["Numero / Riferimento"])
            .then(() => showToast("📋 Numero copiato"));
        };
      }

      card.querySelector("[data-share]").onclick = (event) => {
        event.stopPropagation();
        shareText(title, `${title}${subtitle ? ` · ${subtitle}` : ""}`);
      };

      return card;
    }

    function renderStatusSelect(row, field) {
      const current = row[field] || VALIGIA_STATUS[0];
      const options = VALIGIA_STATUS.includes(current)
        ? VALIGIA_STATUS
        : [current, ...VALIGIA_STATUS];

      return `
        <select class="status-select" data-status aria-label="Stato elemento">
          ${options.map((option) => `<option value="${escapeHtml(option)}" ${option === current ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}
        </select>
      `;
    }

    function renderBudgetEuro(row) {
      const rate = state.settings.exchangeRate || 160;
      const planned = Number(row["Budget Previsto (Yen)"]);
      const spent = Number(row["Spesa Effettiva Revolut"]);
      let html = "";

      if (!Number.isNaN(planned) && planned > 0) {
        html += `<div class="bullet muted"><span class="bullet-icon">💶</span><span>Previsto: ≈ €${(planned / rate).toFixed(2)}</span></div>`;
      }

      if (!Number.isNaN(spent) && spent > 0) {
        html += `<div class="bullet muted"><span class="bullet-icon">💶</span><span>Spesa: ≈ €${(spent / rate).toFixed(2)}</span></div>`;
      }

      return html;
    }

    /* ================================================================
       5. Mappa, calendario e condivisione
       ================================================================ */

    function renderMap() {
      const wrapper = document.createElement("div");
      let found = false;

      SHEET_ORDER.forEach((key) => {
        const meta = SECTION_META[key];
        if (!meta.maps) return;

        const links = [];
        state.data[key].rows.forEach((row) => {
          meta.maps.forEach((map) => {
            if (!isHttpUrl(row[map.field])) return;
            found = true;
            links.push({
              title: row[meta.title] || row[meta.fallbackTitle] || "—",
              subtitle: (meta.sub || []).map((field) => row[field]).filter(Boolean).join(" · "),
              url: row[map.field],
              city: meta.cityField ? row[meta.cityField] : ""
            });
          });
        });

        if (!links.length) return;

        const heading = document.createElement("div");
        heading.className = "group-title";
        heading.innerHTML = `${SECTION_EMOJI[key]} ${meta.label}`;
        wrapper.appendChild(heading);

        links.forEach((item) => {
          const card = document.createElement("article");
          card.className = `card${item.city ? ` city-card ${cityClass(item.city)}` : ""}`;
          card.innerHTML = `
            <h3 class="card-title">${escapeHtml(item.title)}</h3>
            ${item.subtitle ? `<div class="card-subtitle">${escapeHtml(item.subtitle)}</div>` : ""}
            <div class="button-row"><a class="action-button" href="${item.url}" target="_blank" rel="noopener">📍 Apri in Maps</a></div>
          `;
          wrapper.appendChild(card);
        });
      });

      if (!found) {
        wrapper.innerHTML = `<div class="empty-state">📍 Nessun link Google Maps inserito.</div>`;
      }

      return wrapper;
    }

    function buildCalendarFile(row) {
      const date = parseDate(row.Data);
      if (!date) return null;

      const start = row.Data.replace(/-/g, "");
      const next = new Date(date.getTime() + 86400000);
      const end = [
        next.getFullYear(),
        String(next.getMonth() + 1).padStart(2, "0"),
        String(next.getDate()).padStart(2, "0")
      ].join("");

      const summary = `${row.Città || "Giappone"}: ${(row["Attività Principali"] || "").slice(0, 70)}`;
      const description = `${row["Attività Principali"] || ""}${row.Spostamento ? ` | Spostamento: ${row.Spostamento}` : ""}`;

      return [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "BEGIN:VEVENT",
        `UID:giappone-${start}@local`,
        `DTSTAMP:${start}T000000Z`,
        `DTSTART;VALUE=DATE:${start}`,
        `DTEND;VALUE=DATE:${end}`,
        `SUMMARY:${summary.replace(/\r?\n/g, " ")}`,
        `DESCRIPTION:${description.replace(/\r?\n/g, " ")}`,
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");
    }

    function addToCalendar(row) {
      const calendar = buildCalendarFile(row);
      if (!calendar) {
        showToast("Data non valida");
        return;
      }

      downloadFile(calendar, `giorno-${row.Data}.ics`, "text/calendar;charset=utf-8");
      showToast("📅 File calendario creato");
    }

    function shareText(title, text) {
      if (navigator.share) {
        navigator.share({ title, text }).catch(() => {});
        return;
      }

      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast("📋 Copiato negli appunti"));
        return;
      }

      showToast("Condivisione non supportata");
    }

    /* ================================================================
       6. Modifica, eliminazione e backup
       ================================================================ */

    function openEditModal(key, index) {
      const sheet = state.data[key];
      const row = index === null ? {} : sheet.rows[index];
      const meta = SECTION_META[key];
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.onclick = (event) => {
        if (event.target === overlay) closeModal();
      };

      const modal = document.createElement("div");
      modal.className = "modal";

      const fields = sheet.headers.map((field) => renderField(field, row[field], meta)).join("");
      modal.innerHTML = `
        <h2 class="modal-title">${index === null ? "➕ Nuovo" : "✎ Modifica"} · ${SECTION_EMOJI[key]} ${meta.label}</h2>
        ${fields}
        <div class="modal-actions">
          <button class="cancel-button" type="button" data-cancel>Annulla</button>
          <button class="save-button" type="button" data-save>Salva</button>
        </div>
        ${index !== null ? `<div class="modal-actions"><button class="delete-button" type="button" data-delete>🗑️ Elimina</button></div>` : ""}
      `;

      overlay.appendChild(modal);
      document.getElementById("modalRoot").appendChild(overlay);

      modal.querySelector("[data-cancel]").onclick = closeModal;
      modal.querySelector("[data-save]").onclick = () => {
        const updated = {};
        modal.querySelectorAll("[data-field]").forEach((field) => {
          updated[field.dataset.field] = field.value;
        });

        if (index === null) sheet.rows.push(updated);
        else sheet.rows[index] = updated;

        saveData();
        closeModal();
        render();
        showToast("✅ Salvato");
      };

      const deleteButton = modal.querySelector("[data-delete]");
      if (deleteButton) {
        deleteButton.onclick = () => {
          const removed = sheet.rows.splice(index, 1)[0];
          saveData();
          closeModal();
          render();
          showUndoToast("🗑️ Elemento eliminato", () => {
            sheet.rows.splice(index, 0, removed);
            saveData();
            render();
            showToast("↩️ Ripristinato");
          });
        };
      }
    }

    function renderField(field, value, meta) {
      const current = value || "";
      const label = `${fieldEmoji(field)} ${field}`;
      const isLong = /note|dettagli|articolo mirato|attività/i.test(field);

      if (meta.statusField === field) {
        return `
          <div class="field">
            <label class="field-label">${escapeHtml(label)}</label>
            <select data-field="${escapeHtml(field)}">
              ${VALIGIA_STATUS.map((option) => `<option value="${escapeHtml(option)}" ${option === current ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}
            </select>
          </div>
        `;
      }

      if (field === "Urgenza" || field === "Urgenza Configurazione") {
        const options = ["Alta", "Media", "Bassa"];
        return `
          <div class="field">
            <label class="field-label">${escapeHtml(label)}</label>
            <select data-field="${escapeHtml(field)}">
              ${options.map((option) => `<option value="${option}" ${current.startsWith(option) ? "selected" : ""}>${option}</option>`).join("")}
            </select>
          </div>
        `;
      }

      const type = /^data$/i.test(field) ? "date" : /link|maps/i.test(field) ? "url" : "text";

      if (isLong) {
        return `
          <div class="field">
            <label class="field-label">${escapeHtml(label)}</label>
            <textarea data-field="${escapeHtml(field)}">${escapeHtml(current)}</textarea>
          </div>
        `;
      }

      return `
        <div class="field">
          <label class="field-label">${escapeHtml(label)}</label>
          <input type="${type}" data-field="${escapeHtml(field)}" value="${escapeHtml(current)}" ${type === "url" ? "placeholder=\"https://maps.app.goo.gl/...\"" : ""}>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById("modalRoot").innerHTML = "";
    }

    function refreshPackingProgress() {
      const progress = document.querySelector(".progress-card");
      if (progress) progress.replaceWith(renderPackingProgress());
    }

    function renderSettings() {
      const wrapper = document.createElement("div");
      wrapper.innerHTML = `
        <section class="settings-section">
          <h2 class="settings-heading">🎨 Tema</h2>
          <div class="theme-options">
            <button class="pill-button" data-theme="light" type="button">☀️ Chiaro</button>
            <button class="pill-button" data-theme="dark" type="button">🌙 Scuro</button>
            <button class="pill-button" data-theme="auto" type="button">🔄 Automatico</button>
          </div>
        </section>

        <section class="settings-section">
          <h2 class="settings-heading">🖌️ Colore accento</h2>
          <div class="accent-options">
            <button class="color-swatch" data-accent="torii" style="background:#c94a5a" type="button" aria-label="Torii"></button>
            <button class="color-swatch" data-accent="ao" style="background:#3f6ea8" type="button" aria-label="Indaco"></button>
            <button class="color-swatch" data-accent="matcha" style="background:#4f8a5e" type="button" aria-label="Matcha"></button>
            <button class="color-swatch" data-accent="sakura" style="background:#d97ea0" type="button" aria-label="Sakura"></button>
          </div>
        </section>

        <section class="settings-section">
          <h2 class="settings-heading">💴 Cambio Yen / Euro</h2>
          <label class="rate-box">
            <span>1 € =</span>
            <input id="exchangeRate" type="number" min="1" step="0.5" value="${state.settings.exchangeRate}">
            <span>¥</span>
          </label>
        </section>

        <section class="settings-section">
          <h2 class="settings-heading">💾 Backup e ripristino</h2>
          <button class="settings-button" data-action="export-json" type="button">💾 Esporta backup JSON <span>›</span></button>
          <button class="settings-button" data-action="import-json" type="button">📥 Importa backup JSON <span>›</span></button>
          <button class="settings-button" data-action="export-xlsx" type="button">📤 Esporta Excel <span>›</span></button>
          <button class="settings-button" data-action="import-xlsx" type="button">📊 Importa Excel <span>›</span></button>
          <button class="settings-button danger" data-action="reset" type="button">♻️ Ripristina dati originali <span>›</span></button>
          <input id="jsonInput" type="file" accept="application/json">
          <input id="xlsxInput" type="file" accept=".xlsx">
        </section>

        <section class="settings-section">
          <h2 class="settings-heading">ℹ️ Informazioni</h2>
          <p style="color:var(--text-muted);font-size:13px;line-height:1.6;margin:0">
            I dati vengono salvati localmente sul dispositivo. Dopo il primo caricamento l'app può funzionare offline.
            Per aggiornare l'app dalla Home, chiudila completamente e riaprila.
          </p>
        </section>
      `;

      wrapper.querySelectorAll("[data-theme]").forEach((button) => {
        button.classList.toggle("active", button.dataset.theme === state.settings.theme);
        button.onclick = () => {
          state.settings.theme = button.dataset.theme;
          saveSettings();
          applyTheme();
          render();
        };
      });

      wrapper.querySelectorAll("[data-accent]").forEach((button) => {
        button.classList.toggle("active", button.dataset.accent === state.settings.accent);
        button.onclick = () => {
          state.settings.accent = button.dataset.accent;
          saveSettings();
          applyTheme();
          render();
        };
      });

      wrapper.querySelector("#exchangeRate").onchange = (event) => {
        const value = Number(event.target.value);
        if (value > 0) {
          state.settings.exchangeRate = value;
          saveSettings();
          showToast("💴 Cambio aggiornato");
        }
      };

      wrapper.querySelector('[data-action="export-json"]').onclick = exportJson;
      wrapper.querySelector('[data-action="import-json"]').onclick = () => wrapper.querySelector("#jsonInput").click();
      wrapper.querySelector('[data-action="export-xlsx"]').onclick = exportXlsx;
      wrapper.querySelector('[data-action="import-xlsx"]').onclick = () => wrapper.querySelector("#xlsxInput").click();
      wrapper.querySelector('[data-action="reset"]').onclick = resetData;

      wrapper.querySelector("#jsonInput").onchange = importJson;
      wrapper.querySelector("#xlsxInput").onchange = importXlsx;

      return wrapper;
    }

    function exportJson() {
      const payload = {
        exportedAt: new Date().toISOString(),
        data: state.data,
        settings: state.settings
      };
      downloadFile(JSON.stringify(payload, null, 2), "giappone-backup.json", "application/json");
      showToast("💾 Backup JSON esportato");
    }

    function importJson(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const payload = JSON.parse(reader.result);
          if (payload.data) state.data = payload.data;
          if (payload.settings) state.settings = payload.settings;
          saveData();
          saveSettings();
          applyTheme();
          render();
          showToast("✅ Backup importato");
        } catch (error) {
          alert(`Backup non valido: ${error.message}`);
        }
      };
      reader.readAsText(file);
    }

    function exportXlsx() {
      if (!window.XLSX) {
        alert("Libreria Excel non disponibile. Riprova quando hai una connessione.");
        return;
      }

      const workbook = XLSX.utils.book_new();

      SHEET_ORDER.forEach((key) => {
        const sheet = state.data[key];
        const rows = [
          sheet.headers,
          ...sheet.rows.map((row) => sheet.headers.map((header) => row[header] || ""))
        ];
        const worksheet = XLSX.utils.aoa_to_sheet(rows);
        XLSX.utils.book_append_sheet(workbook, worksheet, key.slice(0, 31));
      });

      XLSX.writeFile(workbook, "Giappone_Backup.xlsx");
      showToast("📤 Excel esportato");
    }

    function importXlsx(event) {
      const file = event.target.files?.[0];
      if (!file || !window.XLSX) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const workbook = XLSX.read(new Uint8Array(reader.result), { type: "array", cellDates: false });
          let importedRows = 0;

          SHEET_ORDER.forEach((key) => {
            const sheetName = workbook.SheetNames.find((name) => name.trim() === key.trim());
            if (!sheetName) return;

            const values = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
              header: 1,
              defval: "",
              raw: false
            });

            if (!values.length) return;

            const headers = values[0].map((header) => String(header).trim());
            const rows = values.slice(1)
              .filter((row) => row.some((value) => value !== "" && value !== null && value !== undefined))
              .map((row) => {
                const result = {};
                headers.forEach((header, index) => {
                  result[header] = String(row[index] ?? "");
                });
                return result;
              });

            state.data[key] = { headers, rows };
            importedRows += rows.length;
          });

          saveData();
          state.view = "1. Itinerario";
          render();
          alert(`Importati ${importedRows} elementi.`);
        } catch (error) {
          alert(`Errore Excel: ${error.message}`);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function resetData() {
      if (!confirm("Ripristinare tutti i dati originali?")) return;
      state.data = clone(DEFAULT_DATA);
      saveData();
      render();
      showToast("♻️ Dati ripristinati");
    }

    /* ================================================================
       7. Avvio app e interazioni globali
       ================================================================ */

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }

    window.addEventListener("scroll", () => {
      document.getElementById("topbar").classList.toggle("scrolled", window.scrollY > 30);
    }, { passive: true });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (state.settings.theme === "auto") applyTheme();
    });

    loadState();
    renderPattern();
    renderTabs();
    render();
  </script>
</body>
</html>
